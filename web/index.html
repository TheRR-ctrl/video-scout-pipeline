<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Revisión</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12151a">
<link rel="icon" href="/icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --ground:#12151a; --surface:#1b2027; --surface-2:#232932;
    --line:#2e3540; --line-soft:#252b34;
    --ink:#eceef1; --ink-dim:#98a2ae; --ink-faint:#626c79;
    --accent:#4db4a8; --accent-ink:#06211e; --accent-soft:#16332f;
    --warn:#d9944a; --warn-soft:#33240f;
    --crit:#d96a5a; --crit-soft:#331b18;
    --ok:#6aab7a; --ok-soft:#172a1c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root{ --ground:#edeff1; --surface:#fff; --surface-2:#f5f6f8;
      --line:#d9dde2; --line-soft:#e6e9ed; --ink:#191d23; --ink-dim:#5b6572;
      --ink-faint:#939ba6; --accent:#1d7d72; --accent-ink:#fff; --accent-soft:#dcefec;
      --warn:#9a6416; --warn-soft:#f7ead6; --crit:#b4402f; --crit-soft:#f8dfda;
      --ok:#35754a; --ok-soft:#dff0e3; }
  }
  *{box-sizing:border-box}
  /* Sin esto, un .sangria (display:flex) marcado con hidden se sigue viendo:
     la regla del navegador para [hidden] la pisa cualquier display del autor. */
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);
       -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:1000px;margin:0 auto;padding:0 14px 70px}

  /* Cabecera en dos alturas: la marca arriba, las pestañas debajo. Antes iba
     todo en una sola fila que se plegaba sola, y en un movil de 412px las
     siete pestañas caian en tres renglones apretados contra el titulo. */
  .nav{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--line);margin-bottom:20px}
  .nav-in{max-width:1000px;margin:0 auto;padding:12px 14px 0}
  .marca{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  /* El glifo es el unico adorno de la cabecera: un boton de reproducir, que es
     de lo que va todo esto. Va dibujado con texto y color, no con una imagen
     que haya que cargar aparte. */
  .marca .glifo{flex-shrink:0;width:30px;height:30px;border-radius:9px;
    background:var(--accent-soft);color:var(--accent);font-size:11px;
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    display:flex;align-items:center;justify-content:center}
  .marca .txt{min-width:0}
  .kicker{display:block;font:500 9px var(--mono);text-transform:uppercase;
    letter-spacing:.2em;color:var(--ink-faint);margin-bottom:1px}
  .titulo{margin:0;font:600 20px/1.05 var(--body);letter-spacing:-.02em;color:var(--ink)}
  .titulo .b{color:var(--accent)}
  .nav-acc{margin-left:auto;display:flex;gap:6px;flex-shrink:0}

  /* Las pestañas ya no se pliegan: ruedan de lado en un solo renglon. Los
     margenes negativos las llevan hasta el borde de la pantalla, que es lo que
     deja ver que hay mas a la derecha. */
  .tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;
    margin:0 -14px;padding:0 14px;scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  /* Difuminado en el borde derecho, pero solo mientras quede pestaña por ver:
     lo enciende el JS segun donde este el scroll. Una mascara fija fingiria
     que siempre hay mas, tambien al llegar al final. */
  .tabs.mas{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
  .tabs button{flex-shrink:0;scroll-snap-align:center;
    font:500 13px var(--body);color:var(--ink-dim);background:none;
    border:0;border-bottom:2px solid transparent;
    padding:8px 11px;border-radius:7px 7px 0 0;cursor:pointer;
    display:flex;align-items:center;gap:6px}
  .tabs button.on{color:var(--accent);background:var(--accent-soft);border-bottom-color:var(--accent)}
  .tabs .c{font:11px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
  .tabs button.on .c{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  /* En el teléfono las siete no caben en una fila, y rodando de lado Ajustes
     quedaba fuera de la vista: quien no sabe que hay más no las busca. En
     dos filas se ven todas de un vistazo. */
  @media (max-width:520px){
    .tabs{flex-wrap:wrap;overflow:visible;row-gap:2px;scroll-snap-type:none}
    .tabs.mas{-webkit-mask-image:none;mask-image:none}
    .tabs button{padding:7px 9px}
  }

  .view{display:none} .view.on{display:block}
  h2{font-size:16px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
  p.sub{font-size:13px;color:var(--ink-dim);margin:0 0 16px;max-width:64ch}
  h3.sec{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;
    color:var(--ink-faint);margin:24px 0 10px}

  .btn{font:500 13px var(--body);padding:8px 13px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);color:var(--ink-dim);background:var(--surface);
    display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  .btn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.sm{font-size:12px;padding:6px 10px}
  .btn.danger{color:var(--crit)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  select.btn{color:var(--ink)}

  .pill{font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;
    padding:3px 7px;border-radius:4px;white-space:nowrap}
  .pill.ok{color:var(--ok);background:var(--ok-soft)}
  .pill.warn{color:var(--warn);background:var(--warn-soft)}
  .pill.crit{color:var(--crit);background:var(--crit-soft)}
  .pill.idle{color:var(--ink-faint);background:var(--surface-2)}
  .pill.acc{color:var(--accent);background:var(--accent-soft)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
  details.mas{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
  details.mas > summary{cursor:pointer;font:600 15px var(--body);padding:10px 0;color:var(--ink)}
  .card.siguiente{border-color:var(--accent);border-left-width:4px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .muted{font-size:12.5px;color:var(--ink-dim);line-height:1.45}
  code.cmd{display:block;font:11.5px var(--mono);background:var(--surface-2);
    border:1px solid var(--line-soft);border-radius:6px;padding:7px 9px;color:var(--ink);
    overflow-x:auto;white-space:pre}

  /* trabajo en curso — deliberadamente quieto: una línea de paso actual que
     se reemplaza en su sitio, no un registro que va cayendo. */
  .job{background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;
    padding:12px 14px;margin-bottom:16px}
  .job.err{background:var(--crit-soft);border-color:var(--crit)}
  .job.fin{background:var(--ok-soft);border-color:var(--ok)}
  .job-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .job-top b{flex-grow:1}
  .paso{margin-top:9px;font:12px/1.45 var(--mono);color:var(--ink);
    min-height:2.9em;display:flex;align-items:center;
    overflow:hidden;text-overflow:ellipsis}
  .barra{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
  .barra i{display:block;height:100%;background:var(--accent);width:0;
    transition:width .4s linear}
  .log{margin-top:9px;background:#0c0f13;border-radius:7px;padding:9px 10px;
    font:11.5px/1.5 var(--mono);color:#c8d2dc;height:170px;overflow:auto;white-space:pre-wrap}
  @media (prefers-color-scheme:light){ .log{background:#171b20} }
  .tbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}

  /* El mismo avance, en una linea y pegado abajo. La tarjeta entera vive
     arriba del todo, y en una pestaña larga eso obliga a subir solo para ver
     como va. Esto queda debajo de lo que estes mirando, sea el apartado que
     sea, y se quita solo cuando la tarjeta de arriba ya esta a la vista: dos
     veces lo mismo en pantalla es ruido, no informacion. */
  .mini{position:fixed;left:0;right:0;bottom:0;z-index:40;width:100%;
    background:var(--surface);border:0;border-top:1px solid var(--line);
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));
    font:inherit;color:inherit;text-align:left;cursor:pointer}
  .mini:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mini-top{display:flex;align-items:center;gap:9px}
  /* min-width:0 por lo de siempre: sin esto el paso largo estira la fila y se
     sale por el lado derecho en vez de cortarse con puntos suspensivos. */
  .mini-top .q{flex:1;min-width:0;font:11.5px var(--mono);color:var(--ink-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-top .t{flex-shrink:0;font:11.5px var(--mono);color:var(--ink-dim);
    font-variant-numeric:tabular-nums}
  .mini .barra{margin-top:7px}
  /* La tarjeta de arriba avisa del fallo poniéndose roja entera; aquí abajo no
     hay caja que teñir, así que lo dice la barra. Sin esto quedaba una barra
     verde al 100% justo al lado de la etiqueta ERROR. */
  .mini.err .barra i{background:var(--crit)}
  .mini.fin .barra i{background:var(--ok)}

  /* revisar */
  .review{display:grid;grid-template-columns:300px 1fr;gap:20px}
  video{width:100%;border-radius:9px;background:#000;display:block;aspect-ratio:9/16;object-fit:contain}
  video.wide{aspect-ratio:16/9}
  .facts{display:flex;flex-wrap:wrap;gap:5px 13px;font:11.5px var(--mono);color:var(--ink-dim)}
  .facts b{color:var(--ink);font-weight:500}
  .script{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;
    padding:11px 13px;font-size:13.5px;color:var(--ink-dim);line-height:1.55;max-height:150px;overflow:auto}
  .thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
  .th{position:relative;flex-shrink:0;width:64px;border:1px solid var(--line);
    border-radius:7px;overflow:hidden;cursor:pointer;background:var(--surface)}
  /* El elegido lleva anillo, no solo borde de color: el verde de "subido" y
     el turquesa del acento se parecen demasiado en pantalla pequeña. */
  .th.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .th .im{position:relative;aspect-ratio:9/16;
    /* El degradado se queda debajo: si ffmpeg no pudo sacar el fotograma,
       el recuadro sigue teniendo fondo en vez de quedarse transparente. */
    background:linear-gradient(170deg,#2b3340,#171c23) center/cover no-repeat;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;
    font:9px var(--mono);color:#fff}
  .th .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* La duración va sobre la imagen, con un velo detrás: encima de un
     fotograma claro el texto blanco solo se perdía. */
  .th .im span{position:relative;z-index:1;padding:1px 4px;border-radius:4px;
    background:rgba(0,0,0,.55)}
  .th .cp{font-size:9.5px;color:var(--ink-faint);padding:4px 3px;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .th.on .cp{color:var(--accent)}

  /* Ya subido: el color solo no basta —hay quien no lo distingue y el sol del
     móvil se come los matices—, así que va con marca ✓ y con la miniatura
     apagada. Lo que queda vivo es lo que aún te toca mirar. */
  .th.sub{border-color:var(--ok)}
  /* Con fotograma dentro, el fondo verde no se vería. Lo subido se marca
     apagando la imagen —queda claro que ya está hecho— más el ✓ y el borde. */
  .th.sub .im img{opacity:.32}
  .th.sub.on .im img{opacity:.6}
  .th.sub .cp{color:var(--ok)}
  /* La marca va colgada de .th, no de la miniatura: si colgara de dentro se
     apagaría con ella y en tema claro el ✓ quedaba casi invisible. Como chip
     sólido se lee igual sobre cualquier fondo y en cualquier tema. */
  .th .ck{position:absolute;top:4px;right:4px;display:none;width:15px;height:15px;
    border-radius:50%;background:var(--ok);color:var(--ground);
    align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
    line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .th.sub .ck{display:flex}
  /* El elegido gana al estado: si lo estás mirando, tiene que verse cuál es. */
  .th.sub.on{border-color:var(--accent)}

  .leyenda{display:flex;gap:13px;align-items:center;flex-wrap:wrap;
    margin:-2px 0 8px;font-size:11.5px;color:var(--ink-faint)}
  .leyenda b{color:var(--ink-dim);font-weight:600}
  .leyenda .pt{display:inline-flex;align-items:center;gap:5px}
  .leyenda .mu{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface-2)}
  .leyenda .mu.sub{border-color:var(--ok);background:var(--ok);color:var(--ground);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:8.5px;font-weight:700;line-height:1}

  /* listas */
  .list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .row{display:grid;gap:10px;align-items:center;padding:10px 13px;
    border-bottom:1px solid var(--line-soft);background:var(--surface);font-size:13px}
  .row:last-child{border-bottom:0}
  .row.sel{grid-template-columns:20px 26px 1fr 56px 14px 46px;cursor:pointer}
  .row.sel.on{background:var(--accent-soft)}
  .row.sel input{accent-color:var(--accent);width:15px;height:15px;margin:0}
  /* Una celda de cuadricula no baja de lo que mide su contenido salvo que se
     le diga. Sin esto un titulo largo estira la fila entera y se sale por el
     lado derecho de la pantalla, en vez de cortarse con puntos suspensivos. */
  .row>*{min-width:0}
  .row .n,.row .m{font:11.5px var(--mono);color:var(--ink-faint)}
  .row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Titulo de dos lineas: en un telefono el titulo es lo unico que distingue
     una fila de otra, y cortarlo en la segunda palabra deja dos historias
     distintas con el mismo aspecto. */
  .row .t.dos{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  /* Dos lineas de datos debajo del titulo, y la diferencia importa: .meta es
     una caja flexible para alinear etiquetas, y ahi cada trozo de texto suelto
     cuenta como un elemento aparte que puede saltar de renglon por su cuenta
     («1770» en un renglon y «vistas» en el siguiente). Cuando lo de debajo es
     una frase y no etiquetas, va en .info, que es texto normal. */
  .row .meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:3px}
  .row .info{margin-top:3px}
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;padding:11px 13px;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
  .list-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;padding:11px 13px;background:var(--surface-2);border-top:1px solid var(--line-soft)}
  .equiv{font:11.5px var(--mono);color:var(--ink-dim);background:var(--ground);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px}

  /* ajuste fino: las casillas de "al rehacer, cambiar…" */
  .finos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .fino{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:9px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
  .fino.on{border-color:var(--accent);background:var(--accent-soft)}
  .fino input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex-shrink:0}
  .fino.no{opacity:.45;cursor:not-allowed}
  .sangria{margin:8px 0 4px 24px;display:flex;flex-direction:column;gap:7px}

  /* botón deslizante, para el interruptor de "usar chip de video" */
  .switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch .rail{position:absolute;inset:0;background:var(--line);border-radius:24px;
    cursor:pointer;transition:background .15s}
  .switch .rail::before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;
    background:#fff;border-radius:50%;transition:transform .15s}
  .switch input:checked + .rail{background:var(--accent)}
  .switch input:checked + .rail::before{transform:translateX(18px)}

  /* presets */
  .presets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .preset{border:1px solid var(--line);border-radius:9px;background:var(--surface);
    padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .preset.on{border-color:var(--accent)}
  .preset h4{margin:0;font:500 13.5px var(--mono)}
  .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}

  /* editor de estilos: una fila por ajuste, que a 412px no cabe otra cosa */
  .campo{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    padding:10px 13px;border-bottom:1px solid var(--line)}
  .campo:last-child{border-bottom:0}
  .campo>label{font-size:13px}
  .campo .m{font-size:11.5px}
  .campo input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);
    border-radius:6px;background:none}
  .campo input[type=text],.campo select{min-width:132px}
  .campo .slider{min-width:150px}
  .paleta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  .paleta .quita{cursor:pointer;color:var(--ink-faint);font-size:15px;line-height:1}

  .slider{display:flex;align-items:center;gap:11px}
  .slider input[type=range]{flex-grow:1;accent-color:var(--accent);min-width:90px}
  .slider .v{font:11.5px var(--mono);color:var(--ink);width:42px;text-align:right}

  .aviso{display:flex;gap:10px;align-items:flex-start;background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 9px 9px 0;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
  .aviso.warn{border-left-color:var(--warn)}
  .aviso.crit{border-left-color:var(--crit)}

  /* Pestaña de TikTok: la tira de pasos. Es lo primero que se ve, y es tambien
     lo que ve el revisor de TikTok en el video de la auditoria, asi que el
     orden de la operacion tiene que leerse sin que nadie lo explique. */
  .pasos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .paso-t{flex:1 1 155px;background:var(--surface);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
  .paso-t .n{flex-shrink:0;width:19px;height:19px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);font:600 11px var(--mono);
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .paso-t .d{font-size:12.5px;line-height:1.4;min-width:0}
  .paso-t .d b{display:block;font-weight:600}
  .paso-t .d span{color:var(--ink-dim)}
  /* En un movil caben dos por fila y la tercera queda suelta a lo ancho, que se
     lee como si fuera otra cosa. O las tres en fila, o una debajo de otra. */
  @media (max-width:560px){ .paso-t{flex-basis:100%} }
  .row.tk .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;
    background:var(--surface);border:1px solid var(--accent);color:var(--ink);
    padding:10px 16px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 26px rgba(0,0,0,.35);
    opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.on{opacity:1}

  .modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .caja{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:18px;max-width:460px;width:100%}
  .modal textarea{width:100%;height:120px;background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:10px;
    font:11.5px/1.5 var(--mono);resize:vertical}
  .modal input[type=text]{width:100%;background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:10px;font:12px var(--mono)}

  @media (max-width:780px){
    .review{grid-template-columns:1fr}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

</button>

<div class="toast" id="toast"></div>
<audio id="oido" style="display:none"></audio>

<script>
const $ = s => document.querySelector(s);
let E = null;            // último estado del servidor
let elegido = 0;         // índice del video en revisión
let seleccion = new Set();
let tocado = false;      // ¿el usuario ya eligió historias a mano?
let abiertoRehacer = false;
let finos = {};          // qué casillas de "al rehacer, cambiar…" están marcadas
let musicaElegida = {};  // nº de historia -> archivo de música fijado a mano
let verGrabadas = false; // en la cola, ¿enseñar también las que ya tienen video?

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }

async function api(url, opts){
  const r = await fetch(url, opts);
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
const post = (url, cuerpo) => api(url, {method:'POST',
  headers:{'Content-Type':'application/json'}, body: JSON.stringify(cuerpo||{})});

async function ejecutar(accion, cuerpo){
  try{
    const r = await post('/api/ejecutar/'+accion, cuerpo);
    // Sin esto, pulsar con algo corriendo parece que no hace nada: antes
    // salía un error y ahora se encola en silencio.
    if(r && r.encolado) toast(`En espera (${r.encolado.posicion}º): ${r.encolado.nombre}`);
    refrescar();
  }catch(e){ toast(e.message); }
}
async function trabajo(que){
  try{ await api('/api/trabajo/'+que, {method:'POST'}); refrescar(); }
  catch(e){ toast(e.message); }
}

/* ---------- previsualizar música ---------- */
let sonando = null;
function oir(archivo, boton){
  const a = $('#oido');
  if(sonando === archivo){ a.pause(); sonando = null; pintaBotonesOir(); return; }
  a.src = '/audio/' + encodeURIComponent(archivo);
  a.play().catch(e => toast('No se pudo reproducir: ' + e.message));
  sonando = archivo; pintaBotonesOir();
}
function pintaBotonesOir(){
  document.querySelectorAll('[data-oir]').forEach(b=>{
    b.textContent = b.dataset.oir === sonando ? '⏸' : '▶';
  });
}
$('#oido').onended = ()=>{ sonando = null; pintaBotonesOir(); };

/* =========================================================
   TRABAJO EN CURSO

   Se construye una vez y después solo se reemplaza el texto de los nodos.
   Repintar el bloque entero en cada refresco es lo que hacía que el registro
   pareciera una cascada: el navegador redibujaba las 120 líneas cada 1.5 s.
   ========================================================= */
let jobMontado = null;   // nombre+arranque del trabajo ya dibujado

/* La barra de abajo (.mini) enseña lo mismo que la tarjeta, pero solo cuando
   la tarjeta no se ve. Quien decide eso es el navegador, no un cálculo de
   scroll a mano: el margen negativo descuenta la cabecera pegajosa, porque la
   tarjeta asomando POR DEBAJO de la cabecera no es una tarjeta que puedas
   leer. */
let hayTrabajo = false, tarjetaALaVista = false, vigilante = null;

function refrescarMini(){
  $('#mini-job').hidden = !hayTrabajo || tarjetaALaVista;
}

function vigilarTarjeta(caja){
  if(vigilante) vigilante.disconnect();
  tarjetaALaVista = false;
  const alto = document.querySelector('.nav').offsetHeight;
  vigilante = new IntersectionObserver(entradas=>{
    tarjetaALaVista = entradas[0].isIntersecting;
    refrescarMini();
  }, {rootMargin: `-${alto}px 0px 0px 0px`});
  vigilante.observe(caja);
}

/* La cola de espera y los últimos terminados.

   Va en su propio hueco y no dentro de la tarjeta del trabajo, porque esa
   solo se vuelve a montar cuando cambia el nombre de lo que corre: la cola
   cambia mientras el nombre es el mismo, y se quedaría congelada.

   Los terminados están aquí porque con cola el panel deja de estar mirando:
   arrancas cinco, sales, y al volver quieres ver cómo fueron los cuatro que
   ya pasaron. De los que fallaron se enseña el final de su salida, que es lo
   que hay que leer. */
/* Las historias que no caben en un short. Partirlas es decisión tuya: aquí
   se ofrece, historia por historia, y nada se parte solo salvo que actives
   el modo automático en Ajustes → Subida. */
function bloquePartibles(h){
  const largas = h.filter(x => x.partes > 1 && !x.renderizada);
  if(!largas.length) return '';
  return `<div class="aviso"><span>✂</span><div>
    <b>${largas.length === 1 ? 'Una historia es demasiado larga' : largas.length + ' historias son demasiado largas'}
      para un short.</b> Mientras los videos largos estén bloqueados no se graban. Puedes
    partirlas en varios shorts seguidos («Parte 1 de 3…»), sin cambiar el texto.
    ${largas.map(x=>`<div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <span style="flex-grow:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.titulo)}</span>
      <button class="btn sm" style="white-space:nowrap" data-partir="${x.n}" data-partes="${x.partes}">✂ Partir en ${x.partes}</button>
    </div>`).join('')}</div></div>`;
}

function pintaColaTrabajos(){
  const cola = (E && E.cola) || [], hechos = (E && E.hechos) || [];
  const slot = $('#cola-slot');
  if(!cola.length && !hechos.length){ slot.innerHTML = ''; return; }

  slot.innerHTML = `
    ${!cola.length ? '' : `
    <div class="list" style="margin-top:8px">
      <div class="list-head">
        <div><b>En espera</b><div class="m">Arrancan solos, de uno en uno.</div></div>
        <button class="btn sm" onclick="vaciarCola()">Vaciar</button>
      </div>
      ${cola.map((e,i)=>`
        <div class="row" style="grid-template-columns:auto 1fr auto auto auto">
          <span class="n">${i+1}</span>
          <span class="t">${esc(e.nombre)}</span>
          <button class="tbtn" title="Subir" ${i===0?'disabled style="opacity:.3"':''}
            onclick="moverEnCola(${e.id},'arriba')">↑</button>
          <button class="tbtn" title="Bajar" ${i===cola.length-1?'disabled style="opacity:.3"':''}
            onclick="moverEnCola(${e.id},'abajo')">↓</button>
          <button class="tbtn" title="Quitar de la cola"
            onclick="quitarDeCola(${e.id})">✕</button>
        </div>`).join('')}
    </div>`}
    ${!hechos.length ? '' : `
    <div class="list" style="margin-top:8px">
      <div class="list-head">
        <div><b>Ya terminados</b></div>
        <button class="btn sm" onclick="olvidarHechos()">Limpiar</button>
      </div>
      ${hechos.slice().reverse().map(h=>`
        <div class="row" style="grid-template-columns:1fr auto auto auto">
          <div style="min-width:0">
            <span class="t">${esc(h.nombre)}</span>
            ${!h.lineas ? '' : `<div class="m" style="font:11px var(--mono);
              color:var(--ink-faint);white-space:pre-wrap">${esc(h.lineas.join('\n'))}</div>`}
          </div>
          <span class="m">${Math.floor(h.segundos/60)}:${String(h.segundos%60).padStart(2,'0')}</span>
          <span class="pill ${h.estado==='ok'?'ok':h.estado==='error'?'crit':'idle'}">${esc(h.estado)}</span>
          <button class="tbtn" title="Cerrar este"
            onclick="olvidarHecho(${h.id})">✕</button>
        </div>`).join('')}
    </div>`}`;
}

async function quitarDeCola(id){
  try{ await post('/api/cola/quitar', {id}); refrescar(); }
  catch(e){ toast(e.message); }
}
/* Reordenar mueve la entrada un puesto y vuelve a preguntar el estado: quien
   manda es la cola del servidor, no lo que se ve. Si el trabajo en curso
   terminó justo ahora y la lista ya se corrió sola, el refresco lo enseña. */
async function moverEnCola(id, hacia){
  try{ await post('/api/cola/mover', {id, hacia}); refrescar(); }
  catch(e){ toast(e.message); }
}
async function olvidarHecho(id){
  try{ await post('/api/hechos/quitar', {id}); refrescar(); }
  catch(e){ toast(e.message); }
}
async function olvidarHechos(){
  try{ await post('/api/hechos/vaciar'); refrescar(); }
  catch(e){ toast(e.message); }
}
async function cerrarTrabajo(){
  try{ await post('/api/trabajo/cerrar'); refrescar(); }
  catch(e){ toast(e.message); }
}
async function vaciarCola(){
  if(!confirm('¿Quitar todo lo que está esperando?\n\nLo que ya está corriendo sigue.')) return;
  try{ const r = await post('/api/cola/vaciar'); toast(`${r.quitados} quitado(s).`); refrescar(); }
  catch(e){ toast(e.message); }
}

function pintaJob(){
  const j = E && E.trabajo, slot = $('#job-slot');
  if(!j){
    slot.innerHTML=''; jobMontado=null;
    if(vigilante){ vigilante.disconnect(); vigilante = null; }
    hayTrabajo = false; refrescarMini();
    return;
  }

  const id = j.nombre;
  if(jobMontado !== id){
    jobMontado = id;
    slot.innerHTML = `
      <div class="job" id="job-caja">
        <div class="job-top">
          <b id="job-nom"></b>
          <span class="pill acc" id="job-estado"></span>
          <span id="job-t" style="font:11.5px var(--mono);color:var(--ink-dim)"></span>
          <button class="tbtn" id="b-pausa" title="Pausar">⏸</button>
          <button class="tbtn" id="b-abort" title="Abortar" style="color:var(--crit)">⏹</button>
          <button class="tbtn" id="b-cerrar" title="Cerrar">✕</button>
        </div>
        <div class="paso" id="job-paso"></div>
        <div class="barra"><i id="job-barra"></i></div>
        <button class="btn sm" id="b-detalle" style="margin-top:9px">Ver detalle</button>
        <div class="log" id="log" style="display:none"></div>
      </div>`;
    $('#b-pausa').onclick = ()=>trabajo(E.trabajo.estado==='pausado'?'reanudar':'pausar');
    $('#b-abort').onclick = ()=>{ if(confirm('¿Abortar lo que está corriendo?')) trabajo('abortar'); };
    // Cerrar solo aparece cuando ya terminó: quita la tarjeta de la vista.
    // Lo que pasó no se pierde, queda apuntado abajo en "Ya terminados".
    $('#b-cerrar').onclick = cerrarTrabajo;
    $('#b-detalle').onclick = ()=>{
      const l = $('#log'), abierto = l.style.display !== 'none';
      l.style.display = abierto ? 'none' : 'block';
      $('#b-detalle').textContent = abierto ? 'Ver detalle' : 'Ocultar detalle';
      if(!abierto) l.scrollTop = l.scrollHeight;
    };
    vigilarTarjeta($('#job-caja'));
  }

  const corriendo = j.estado==='corriendo' || j.estado==='pausado';
  const mins = Math.floor(j.segundos/60), segs = j.segundos%60;
  $('#job-caja').className = 'job' + (j.estado==='error' ? ' err' : (j.estado==='ok' ? ' fin' : ''));
  $('#job-nom').textContent = j.nombre;
  $('#job-estado').textContent = j.estado;
  $('#job-estado').className = 'pill ' + (j.estado==='ok'?'ok':j.estado==='error'?'crit':'acc');
  $('#job-t').textContent = `${mins}:${String(segs).padStart(2,'0')}`;
  $('#b-pausa').style.display = corriendo ? '' : 'none';
  $('#b-abort').style.display = corriendo ? '' : 'none';
  $('#b-cerrar').style.display = corriendo ? 'none' : '';
  $('#b-pausa').textContent = j.estado==='pausado' ? '▶' : '⏸';

  // El paso actual es la última línea con contenido. El HUD del render ya
  // trae el porcentaje entre corchetes: se saca de ahí para la barra en vez
  // de inventar un avance que no se puede saber.
  const ultima = j.lineas.length ? j.lineas[j.lineas.length-1] : '(arrancando…)';
  $('#job-paso').textContent = ultima;
  const m = ultima.match(/(\d{1,3}(?:\.\d)?)\s*%/);
  $('#job-barra').style.width = m ? Math.min(100, parseFloat(m[1])) + '%' : (corriendo ? '' : '100%');
  // Una barra llena al 100% no dice nada que no diga ya la etiqueta "ok":
  // en cuanto termina se va, y queda el resultado a secas.
  $('#job-barra').parentElement.style.display = corriendo ? '' : 'none';

  // La mini repite lo que acaba de calcularse arriba, no lo recalcula: si
  // algún día cambia cómo se saca el porcentaje, cambia en un solo sitio.
  // La barra de abajo es para seguir el avance sin subir: terminado el
  // trabajo no hay avance que seguir, así que desaparece.
  hayTrabajo = corriendo;
  $('#mini-job').className = 'mini' + (j.estado==='error' ? ' err' : (j.estado==='ok' ? ' fin' : ''));
  $('#mini-estado').textContent = j.estado;
  $('#mini-estado').className = $('#job-estado').className;
  $('#mini-paso').textContent = ultima;
  $('#mini-t').textContent = $('#job-t').textContent;
  $('#mini-barra').style.width = $('#job-barra').style.width;
  refrescarMini();

  const log = $('#log');
  if(log.style.display !== 'none'){
    // Solo sigue el final si ya estabas al final: si subiste a leer algo,
    // que no te lo arrastre hacia abajo en el siguiente refresco.
    const alFinal = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const texto = j.lineas.join('\n');
    if(log.textContent !== texto){
      log.textContent = texto;
      if(alFinal) log.scrollTop = log.scrollHeight;
    }
  }
}

/* =========================================================
   REVISAR
   ========================================================= */
function firmaRevisar(){
  const v = E.videos;
  // La metadata entra en la firma para que al terminar de generarla se vea
  // sola. Pero mientras estés escribiendo en sus campos, el repintado se
  // congela: te borraría lo que llevas escrito a media frase.
  //
  // Solo cuenta el foco en un campo de texto. Incluir los botones dejaba el
  // bloque congelado justo después de pulsar "Guardar" —el foco se queda en
  // el botón— y el resultado del guardado no llegaba a verse.
  const foco = document.activeElement;
  if(foco && foco.matches && foco.matches('#caja-meta input, #caja-meta textarea'))
    return firmas.revisar;
  if(!v.length) return 'vacio';
  // Solo entra el video que estás mirando, NO la lista entera. Terminar de
  // renderizar otro video cambia la lista, y con la lista dentro de esta
  // firma el repintado rehacía el <video>: se te reiniciaba justo mientras
  // lo veías. La tira se actualiza aparte, en pintaTira().
  const a = v[Math.min(elegido, v.length - 1)];
  return ['hay', elegido, a.archivo, a.mtime, a.publicado, a.subido, JSON.stringify(a.meta),
          JSON.stringify(a.calidad), abiertoRehacer, JSON.stringify(finos)].join('~');
}

// La tira de miniaturas, aparte de la ficha y con su propia firma: puede
// crecer mientras un render avanza sin tocar nada de lo que estás usando.
let firmaTiraActual = null;
function pintaTira(){
  const v = E.videos, caja = document.querySelector('#v-revisar .thumbs');
  if(!caja) return;   // la vista aún no está montada (o no hay videos)
  const f = [v.length, elegido,
             v.map(x=>x.archivo+x.mtime+x.subido).join('|')].join('~');
  if(firmaTiraActual === f) return;
  firmaTiraActual = f;

  const enc = document.querySelector('#v-revisar h2');
  if(enc) enc.textContent = `${v.length} video${v.length>1?'s':''} grabado${v.length>1?'s':''}`;
  const ley = document.querySelector('#v-revisar .leyenda');
  if(ley) ley.outerHTML = leyendaSubidos(v);

  const izq = caja.scrollLeft;
  caja.innerHTML = miniaturas(v);
  caja.scrollLeft = izq;   // que no se te vaya al principio al aparecer una
  caja.querySelectorAll('.th').forEach(t =>
    t.onclick = ()=>{ elegido = +t.dataset.i; pintar(); });
}

function miniaturas(v){
  return v.map((x,i)=>`
      <div class="th ${i===elegido?'on':''} ${x.subido?'sub':''}" data-i="${i}"
           title="${x.subido?'ya subido a YouTube':(x.publicado?'rechazado, no se subió':'sin subir')}">
        <div class="im"><img loading="lazy" alt=""
             src="/miniatura/${encodeURIComponent(x.archivo)}?v=${x.mtime||0}"
             onerror="this.remove()"><span>${Math.floor(x.duracion_sec/60)}:${String(Math.round(x.duracion_sec%60)).padStart(2,'0')}</span></div>
        <span class="ck">✓</span>
        <div class="cp">${String(x.numero??i+1).padStart(2,'0')}</div>
      </div>`).join('');
}
function leyendaSubidos(v){
  // El recuento delante de la tira: cuántos quedan es lo que de verdad
  // quieres saber al abrir el panel, y el número lo dice antes de que te
  // pongas a contar miniaturas.
  const subidos = v.filter(x => x.subido).length;
  const faltan = v.length - subidos;
  return `<div class="leyenda">
    <span class="pt"><span class="mu sub">✓</span><b>${subidos}</b> subido${subidos===1?'':'s'}</span>
    <span class="pt"><span class="mu"></span><b>${faltan}</b> sin subir</span>
    ${faltan ? '' : '<span style="color:var(--ok)">todo al día</span>'}
  </div>`;
}

function pintaRevisar(){
  const v = E.videos, cont = $('#v-revisar');
  if(!v.length){
    cont.innerHTML = `
      <h2>Nada que revisar todavía</h2>
      <p class="sub">Cuando se grabe un video, aparece aquí para que lo veas y lo apruebes antes de
        que se suba. Lo que toca hacer ahora está en la tarjeta de arriba.</p>`;
    return;
  }
  if(elegido >= v.length) elegido = 0;
  const a = v[elegido];
  const mins = Math.floor(a.duracion_sec/60), segs = Math.round(a.duracion_sec%60);
  const pistas = E.musica || [];
  const subidos = v.filter(x => x.subido).length;

  cont.innerHTML = `
    <h2>${v.length} video${v.length>1?'s':''} grabado${v.length>1?'s':''}</h2>
    <p class="sub">Míralo aquí mismo — el archivo está en este teléfono. Toca el video para pantalla completa.</p>
    ${leyendaSubidos(v)}
    <div class="thumbs">${miniaturas(v)}</div>

    <div class="card review">
      <div>
        <video controls playsinline preload="metadata" class="${a.es_short?'':'wide'}"
               src="/video/${encodeURIComponent(a.archivo)}"></video>
      </div>
      <div style="display:flex;flex-direction:column;gap:11px;min-width:0">
        <div>
          <h3 style="margin:0 0 5px;font-size:17px;line-height:1.3">${esc(a.titulo)}</h3>
          <div class="facts">
            <span><b>${mins}:${String(segs).padStart(2,'0')}</b></span>
            <span>${a.es_short?'Short':'Largo'}</span>
            <span>Emoción <b>${esc(a.emocion)}</b></span>
            ${a.musica?`<span>Música <b>${esc(a.musica.replace(/^musica_|\.mp3$/g,''))}</b></span>
              <button class="btn sm" data-oir="${esc(a.musica)}" style="padding:2px 8px">▶</button>`:''}
            ${a.subido ? '<span class="pill ok">✓ ya subido a YouTube</span>'
              : (a.publicado ? '<span class="pill warn">rechazado, no se subió</span>'
                             : '<span class="pill idle">sin subir</span>')}
          </div>
        </div>
        ${bloqueCalidad(a)}
        <div class="script"><b style="color:var(--ink-faint);font:10px var(--mono);
          text-transform:uppercase;letter-spacing:.09em;display:block;margin-bottom:5px">Narración</b>${esc(a.cuerpo).slice(0,700)}${a.cuerpo.length>700?'…':''}</div>
        ${bloqueMeta(a)}

        <div style="display:flex;gap:7px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line-soft)">
          <button class="btn go" onclick="ejecutar('publicar')">⬆ Publicar pendientes</button>

  $('#b-rehacer').onclick = ()=>{ abiertoRehacer = !abiertoRehacer; pintar();

/* ---------- lo que se puede medir del archivo ----------
   Los defectos que no se ven mirando el video por encima: el audio que se
   corta a mitad de frase, el volumen doce decibelios por debajo de lo normal,
   el medio segundo en negro del principio —que además es el fotograma que
   YouTube ofrece como miniatura—. Los mide calidad.py con ffmpeg y aquí solo
   se leen: medirlos es descodificar el video entero y esta ficha se repinta
   sola cada segundo y medio. */
function bloqueCalidad(a){
  const c = a.calidad;
  const caja = (dentro) => `<div class="card" style="background:var(--surface-2);padding:13px">
    <b style="font:10px var(--mono);text-transform:uppercase;letter-spacing:.09em;
       color:var(--ink-faint);display:block;margin-bottom:8px">Cómo salió el archivo</b>
    ${dentro}</div>`;

  // Sin revisar no es lo mismo que revisado y limpio, así que no se pinta
  // un ✓ que nadie ha comprobado.
  if(!c) return caja(`
    <div class="muted" style="margin-bottom:9px">Todavía no se ha medido.</div>
    <button class="btn sm" onclick="ejecutar('calidad')">Revisar los renderizados</button>`);

  const m = c.medidas || {};
  const datos = [`${Math.round(m.duracion||0)}s`, `${m.ancho}x${m.alto}`, `${m.tamano_mb} MB`];
  if(m.lufs != null) datos.push(`${m.lufs.toFixed(1)} LUFS`);

  const resumen = c.hallazgos.length
    ? `${c.fallos ? `<span class="pill crit">${c.fallos} para arreglar</span>` : ''}
       ${c.avisos ? `<span class="pill warn">${c.avisos} aviso${c.avisos>1?'s':''}</span>` : ''}`
    : '<span class="pill ok">sin defectos</span>';

  return caja(`
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:${
      c.hallazgos.length?'10px':'0'}">
      ${resumen}<span class="m">${datos.join('\u00a0· ')}</span>
    </div>
    ${c.hallazgos.map(h=>`<div style="margin-bottom:9px">
      <div style="font-size:13px"><b style="color:var(--${h.nivel==='fallo'?'crit':'warn'})">${
        h.nivel==='fallo'?'❌':'⚠️'}</b> ${esc(h.que)}</div>
      <div class="muted" style="margin-left:19px">${esc(h.arreglo)}</div>
    </div>`).join('')}
    ${bloqueIA(c.ia)}`);
}

// Vista previa del recorte. El cálculo lo hace el servidor (POST /api/recorte)
// en vez de repetirse aquí en JavaScript: dos implementaciones del mismo
// algoritmo acabarían separándose, y esta vista previa solo sirve si dice
// exactamente lo que se va a subir. El servidor es local, así que preguntar
// cuesta un milisegundo.
let recortePedido = 0, recorteReloj = null;
const recorteCache = new Map();

function pedirRecorte(texto, caja){
  const pinta = (donde, t) => { if(donde) donde.innerHTML =
    `Se pasa de 100. Se subirá recortado por palabras:<br>
     <b style="color:var(--ink)">${esc(t)}</b>`; };

  if(recorteCache.has(texto)){ pinta(caja, recorteCache.get(texto)); return; }

  const token = ++recortePedido;
  caja.textContent = 'Se pasa de 100. Calculando el recorte…';
  clearTimeout(recorteReloj);
  recorteReloj = setTimeout(async ()=>{
    let r;
    try{
      r = await (await fetch('/api/recorte', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({titulo: texto})})).json();
    }catch(e){ return; }   // sin servidor no hay nada que enseñar
    if(token !== recortePedido) return;   // ya escribiste algo más
    recorteCache.set(texto, r.titulo);
    // Puede haber repintado mientras tanto: se busca el div otra vez.
    pinta(document.querySelector('#m-recorte'), r.titulo);
  }, 250);
}

function conectarMeta(a){
  if(!$('#caja-meta')) return;
  const tit = $('#m-titulo'), cuenta = $('#m-cuenta');
  // Copia de trabajo: se edita aquí y solo se manda al guardar, para que un
  // refresco a media escritura no se lleve lo que estabas poniendo.
  let tags = [...(a.meta.hashtags || [])];

  const contar = ()=>{
    // .length de JS ya cuenta en unidades UTF-16, que es como mide YouTube
    // (y como mide largo_youtube en el servidor): coinciden sin convertir.
    const n = tit.value.length;
    cuenta.textContent = `${n}/100`;
    cuenta.style.color = n > 100 ? 'var(--crit)' : (n > 90 ? 'var(--warn)' : 'var(--ink-faint)');

    // Pasarse no es un error: se recorta por palabras. Pero verlo antes de
    // guardar evita la sorpresa de descubrir en YouTube dónde quedó el corte.
    const av = $('#m-recorte');
    if(n > 100){ av.style.display = 'block'; pedirRecorte(tit.value, av); }
    else { av.style.display = 'none'; recortePedido++; }
  };
  tit.oninput = contar; contar();

  const repintaTags = ()=>{
    const caja = $('#m-tags');
    caja.querySelectorAll('.pill').forEach(e=>e.remove());
    const add = $('#m-add');
    tags.forEach(t=>{
      const s = document.createElement('span');
      s.className = 'pill acc';
      s.style.cssText = 'display:inline-flex;gap:6px;align-items:center;text-transform:none;font-size:11.5px;padding:5px 8px';
      s.innerHTML = `#${esc(t)} <b style="cursor:pointer;opacity:.65">×</b>`;
      s.querySelector('b').onclick = ()=>{ tags = tags.filter(x=>x!==t); repintaTags(); };
      caja.insertBefore(s, add);
    });
    add.style.display = tags.length >= 6 ? 'none' : '';
  };
  repintaTags();

  $('#m-add').onclick = ()=>{
    const crudo = prompt('Hashtag (sin #):');
    if(!crudo) return;
    const limpio = crudo.replace(/[^\w]/g, '');
    if(!limpio) return toast('Ese hashtag se queda en nada al limpiarlo');
    if(tags.includes(limpio)) return toast('Ya está');
    if(tags.length >= 6) return toast('Seis es el tope que sube publisher.py');
    tags.push(limpio); repintaTags();
  };

  $('#m-guardar').onclick = async ()=>{
    if(!tit.value.trim()) return toast('El título no puede quedar vacío');
    try{
      await post('/api/metadata/'+encodeURIComponent(a.archivo), {
        titulo_youtube: tit.value,
        descripcion_youtube: $('#m-desc').value,
        hashtags: tags,
      });
      toast('Guardado — se subirá así');
      refrescar();
    }catch(e){ toast(e.message); }
  };
  $('#m-regenerar').onclick = ()=>{
    if(a.meta.origen === 'manual' &&
       !confirm('Lo editaste a mano. Regenerar reemplaza tu texto. ¿Seguir?')) return;
    ejecutar('regenerar_metadata', {numero: a.numero});
  };
}

function otraPistaDe(emocion, evitar){
  const pool = (E.musica||[]).filter(p => p.emocion === emocion && p.archivo !== evitar);
  const alt = pool.length ? pool : (E.musica||[]).filter(p => p.archivo !== evitar);
  return alt.length ? alt[Math.floor(Math.random()*alt.length)].archivo : '';
}

/* =========================================================
   COLA
   ========================================================= */
function rangoTexto(){
  const a = [...seleccion].sort((x,y)=>x-y), p=[]; let i=0;
  while(i<a.length){ let j=i; while(j+1<a.length && a[j+1]===a[j]+1) j++;
    p.push(j>i+1 ? a[i]+'-'+a[j] : a.slice(i,j+1).join(',')); i=j+1; }
  return p.join(',');
}
/* Al limpiar la cola, lo que queda se renumera: la 54 pasa a ser la 1. Pero
   lo que has elegido —qué renderizar y qué música— se guarda por número, no
   por historia. Sin esto, después de limpiar la música que le pusiste a la 20
   se la queda la que ahora ocupa el 20, que es otra, y «Renderizar 62» sigue
   diciendo 62 con tres historias en la lista.

   Se recuerda qué título tenía cada número y se suelta lo que dejó de
   coincidir. Perder la elección es lo correcto aquí: el número ya no
   significa lo mismo, y renderizar la historia equivocada se descubre veinte
   minutos después. */
let tituloPorNumero = {};
function olvidarLoQueSeRenumero(){
  const antes = tituloPorNumero;
  tituloPorNumero = {};
  (E.historias || []).forEach(h => { tituloPorNumero[h.n] = h.titulo; });
  Object.keys(antes).forEach(n => {
    if(tituloPorNumero[n] !== antes[n]){ seleccion.delete(+n); delete musicaElegida[n]; }
  });
  [...seleccion].forEach(n => { if(!(n in tituloPorNumero)) seleccion.delete(n); });
  Object.keys(musicaElegida).forEach(n => {
    if(!(n in tituloPorNumero)) delete musicaElegida[n];
  });
}

function firmaCola(){
  return [E.historias.length, E.historias.map(h=>h.n+h.titulo+(h.renderizada?'✓':'')).join('|'),
          [...seleccion].sort().join(','), JSON.stringify(musicaElegida),
          (E.musica||[]).length, E.candidatos || 0, verGrabadas].join('~');
}
/* El aviso de limpiar la cola sale en dos sitios —aquí y en Mantenimiento—
   y dice justo lo que se pierde, que es la numeración. Una sola copia para
   que no se queden diciendo cosas distintas. */
const AVISO_LIMPIAR_COLA =
  "Quita de guion.txt las historias que ya tienen video.\n\nEl texto no se pierde: pasa a guion_historial.txt, y además queda una copia con fecha. Las que quedan se renumeran (un «--historias 44» de antes deja de apuntar a lo mismo).";

/* La cola enseña lo que falta por grabar.

   guion.txt guarda todo lo que Gemini escribió y renderizar no borra nada de
   ahí, así que a las pocas semanas la lista eran decenas de historias ya
   grabadas y había que ir recordando cuáles. Quitarlas de verdad es cosa de
   «Limpiar» (que las pasa al historial); aquí solo se ocultan, que es
   reversible y no renumera nada. */
function pintaCola(){
  const todas = E.historias, cont = $('#v-cola');
  const grabadas = todas.filter(x=>x.renderizada).length;
  const h = verGrabadas ? todas : todas.filter(x=>!x.renderizada);
  // Lo que no se ve tampoco se renderiza: una historia grabada oculta pero
  // marcada saldría en «Renderizar 3,7,12» sin que nadie la vea en la lista.
  if(!verGrabadas) todas.forEach(x=>{ if(x.renderizada) seleccion.delete(x.n); });
  if(!h.length && grabadas && !verGrabadas){
    cont.innerHTML = `<h2>Nada pendiente</h2>
      <p class="sub">Las ${grabadas} historia(s) de la cola ya tienen video.</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn go" onclick="ejecutar('buscar')">🔍 Buscar en Reddit</button>
        <button class="btn go" onclick="ejecutar('guiones')">✍ Escribir guiones</button>
        <button class="btn" onclick="verGrabadas=true;pintar()">👁 Ver las ya grabadas</button>
        <button class="btn" title="Las pasa al historial y renumera lo que quede"
          onclick="if(confirm(AVISO_LIMPIAR_COLA)) ejecutar('limpiar_cola')">🧹 Limpiar</button>
      </div>`;
    return;
  }
  if(!h.length){
    cont.innerHTML = `<h2>Sin historias</h2>
      <p class="sub">No hay guion.txt. Busca historias en Reddit y conviértelas en guiones.</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn go" onclick="ejecutar('buscar')">🔍 Buscar en Reddit</button>
        <button class="btn go" onclick="ejecutar('buscar_youtube')">▶️ Buscar en YouTube</button>
        <button class="btn" onclick="ejecutar('guiones')">✍ Escribir guiones</button>
        <button class="btn" onclick="ejecutar('diagnostico_busqueda')">🩺 ¿Por qué no hay historias?</button>
      </div>`;
    return;
  }
  // De entrada, las tres primeras que se pueden grabar tal cual: una larga
  // marcada por defecto se aplazaría al grabar sin producir nada.
  if(!tocado && !seleccion.size) h.filter(x=>!x.larga).slice(0,3).forEach(x=>seleccion.add(x.n));
  const pistas = E.musica || [];
  const elegidas = h.filter(x=>seleccion.has(x.n));

  // El scroll de la lista se guarda y se repone: sin esto, repintar mientras
  // recorres las historias te devuelve al principio de la lista.
  const cajaPrevia = cont.querySelector('#caja-lista');
  const scrollPrevio = cajaPrevia ? cajaPrevia.scrollTop : 0;

  // Los candidatos que trajeron los buscadores no son historias todavía:
  // están en candidatos.json esperando a que Gemini les escriba el guion.
  // Antes esto no se veía en ningún sitio, así que buscar en Reddit parecía
  // no traer nada: la lista seguía enseñando las mismas de siempre.
  const esperando = E.candidatos || 0;
  cont.innerHTML = `
    <h2>${h.length === 1 ? 'Una historia' : h.length + ' historias'} en la cola</h2>
    ${!grabadas ? '' : `<p class="sub">${verGrabadas
      ? `Se ven también las ${grabadas} que ya tienen video.`
      : `${grabadas} más ya tienen video y no se enseñan.`}
      <a href="#" onclick="verGrabadas=${!verGrabadas};pintar();return false"
        >${verGrabadas ? 'ocultarlas' : 'verlas'}</a></p>`}
    ${!esperando ? '' : `<div class="aviso warn"><span>✍</span><div>
      <b>${esperando} candidato(s)</b> esperando guion. Lo que encuentran Reddit y
      YouTube no entra aquí hasta que Gemini los escribe. Va por tandas —los más
      recientes primero— para no gastar la cuota del día de una sentada.
      <div style="margin-top:7px"><button class="btn go" onclick="ejecutar('guiones')"
        >✍ Escribir guiones</button></div></div></div>`}
    ${bloquePartibles(h)}
    <div class="list">
      <div class="list-head">
        <div><b>Elige cuáles grabar</b><div id="cuenta" style="font:11.5px var(--mono);color:var(--ink-dim);margin-top:2px"></div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">
          <button class="btn sm" id="q-todas">Todas</button>
          <button class="btn sm" id="q-ning">Ninguna</button>
        </div>
      </div>
      <div id="caja-lista" style="max-height:340px;overflow:auto">${h.map(x=>`
        <label class="row sel ${seleccion.has(x.n)?'on':''}" data-n="${x.n}">
          <input type="checkbox" ${seleccion.has(x.n)?'checked':''}>
          <span class="n">${String(x.n).padStart(2,'0')}</span>
          <span class="t">${x.renderizada ? '🎬 ' : ''}${esc(x.titulo)}</span>
          <span class="m">${esc(x.emocion).slice(0,5)}</span>
          <span class="m" style="white-space:nowrap" title="voz ${x.genero==='femenino'?'femenina (Dalia)':'masculina (Jorge)'}"
            >${x.genero==='femenino'?'voz ♀':'voz ♂'}</span>
          <span class="m">${x.duracion}</span>
        </label>`).join('')}</div>
      <div class="list-foot">
        <code class="equiv" id="equiv" style="display:none"></code>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn" onclick="ejecutar('buscar')">🔍 Buscar en Reddit</button>
          <button class="btn" onclick="ejecutar('buscar_youtube')">▶️ Buscar en YouTube</button>
          <button class="btn" title="Convierte en guion lo que encontraron los buscadores"
            onclick="ejecutar('guiones')">✍ Escribir guiones</button>
          <button class="btn" onclick="ejecutar('diagnostico_busqueda')">🩺 Diagnóstico</button>
          <button class="btn" title="Quita las que ya tienen video. Para verlas antes sin tocar nada: Ajustes → Más opciones → Tareas sueltas"
            onclick="if(confirm(AVISO_LIMPIAR_COLA)) ejecutar('limpiar_cola')">🧹 Limpiar</button>
          <button class="btn go" id="b-render">▶ Grabar</button>
        </div>
      </div>
    </div>

    <h3 class="sec">Música de cada una</h3>
    ${!pistas.length ? `<div class="aviso warn"><span>⚠</span><div>No hay pistas descargadas.
      Ve a <b>Ajustes → Música y fondos</b> y actualízalas, o los videos saldrán sin fondo musical.</div></div>`
    : !elegidas.length ? `<div class="aviso"><span>·</span><div>Selecciona historias arriba para elegirles música.</div></div>`
    : `<p class="sub">Por omisión sale una al azar de la emoción que detectó el guion. Si eliges
       una a mano, óyela antes — así no descubres que no pegaba después de esperar el render.
       Lo que dejes en «al azar» sigue funcionando sin ti, que es lo que necesita el cron.</p>
    <div class="list">${elegidas.map(x=>`
      <div class="row" style="grid-template-columns:26px 1fr auto auto">
        <span class="n">${String(x.n).padStart(2,'0')}</span>
        <select class="btn sm" data-mus="${x.n}" style="min-width:0">
          <option value="">al azar · ${esc(x.emocion)}</option>
          ${pistas.map(p=>`<option value="${esc(p.archivo)}" ${musicaElegida[x.n]===p.archivo?'selected':''}>
            ${esc(p.emocion)} · ${esc(p.titulo || p.archivo.replace(/^musica_[a-z]*_|\.mp3$/g,''))}</option>`).join('')}
        </select>
        <button class="btn sm" data-oir-fila="${x.n}" style="padding:6px 9px">▶</button>
        <span class="m">${musicaElegida[x.n] ? 'fijada' : 'auto'}</span>
      </div>`).join('')}</div>`}`;

  const caja = cont.querySelector('#caja-lista');
  if(caja) caja.scrollTop = scrollPrevio;

  const sync = ()=>{
    $('#cuenta').textContent = `${seleccion.size} de ${h.length} seleccionadas`;
    $('#equiv').textContent = seleccion.size ? '--historias '+rangoTexto() : 'nada seleccionado';
    const b = $('#b-render');
    b.textContent = seleccion.size ? `▶ Grabar ${seleccion.size}` : '▶ Grabar';
    b.disabled = !seleccion.size;
  };
  cont.querySelectorAll('.row.sel').forEach(r=>{
    r.querySelector('input').onchange = e=>{
      tocado = true;
      const n = +r.dataset.n;
      e.target.checked ? seleccion.add(n) : seleccion.delete(n);
      r.classList.toggle('on', e.target.checked);
      sync(); pintar();
    };
  });
  cont.querySelectorAll('[data-mus]').forEach(s => s.onchange = ()=>{
    const n = s.dataset.mus;
    if(s.value) musicaElegida[n] = s.value; else delete musicaElegida[n];
    pintar();
  });
  cont.querySelectorAll('[data-oir-fila]').forEach(b => b.onclick = ()=>{
    const n = b.dataset.oirFila;
    const f = musicaElegida[n] || (E.historias.find(x=>x.n==n)
      ? otraPistaDe(E.historias.find(x=>x.n==n).emocion, null) : '');
    if(!f) return toast('No hay pista que oír');
    oir(f, b);
  });
  cont.querySelectorAll('[data-partir]').forEach(b => b.onclick = ()=>{
    if(!confirm(`¿Partir esta historia en ${b.dataset.partes} shorts seguidos?\n\nEl texto no cambia: solo se corta entre frases. `
      + 'La original queda guardada entera en el historial.')) return;
    ejecutar('partir_una', {numero: +b.dataset.partir});
  });
  $('#q-todas').onclick = ()=>{ tocado=true; h.forEach(x=>seleccion.add(x.n)); pintar(); };
  $('#q-ning').onclick  = ()=>{ tocado=true; seleccion.clear(); pintar(); };
  $('#b-render').onclick = ()=>{
    const mus = {};
    for(const n of seleccion) if(musicaElegida[n]) mus[String(n)] = musicaElegida[n];
    ejecutar('renderizar', {historias: rangoTexto(), musica: mus});
  };
  sync();
  pintaBotonesOir();
}

const DESCR = {
  predeterminado:'Frase completa; solo las palabras con carga se pintan, rotando colores.',
  verde_fijo:'Todas las palabras activas del mismo verde, sin rotación.',
  amarillo_clasico:'Karaoke por relleno: lo ya dicho se queda amarillo.',
  una_palabra:'Una palabra a la vez con rebote, un solo color.',
  sobrio:'Sin color: la palabra activa solo crece. Lo más discreto.',
  alto_contraste:'Bebas Neue, resalte rojo, menos palabras por frase.',
  palabras_clave:'Una palabra a la vez, algunas pintadas rotando. El del video de referencia.'
};
/* El editor vive aquí y no en el DOM: mientras está abierto, lo que escribes
   se queda en los inputs, y la firma solo cambia al abrirlo o cerrarlo. Así un
   refrescar() de los que corren cada 1,5s no te borra lo que ibas poniendo. */
let editorEstilo = null;   // null = cerrado; {base, nombre} = abierto

function firmaEstilo(){
  return [JSON.stringify(E.subtitulos), JSON.stringify(E.presets_propios||{}),
          (E.previsualizaciones||[]).join(','),
          editorEstilo ? 'editando:'+editorEstilo.base+':'+editorEstilo.nombre : ''].join('~');
}

/* Los valores con los que arranca el formulario: los del estilo que se está
   copiando, ya resueltos (defaults -> preset), que es lo que se ve en pantalla. */
function valoresDe(nombre){
  const propio = (E.presets_propios||{})[nombre];
  // El activo ya viene resuelto del servidor; de los demás solo llegan las
  // claves que cambian, así que el resto se completa con el activo.
  const base = Object.assign({}, E.subtitulos);
  delete base.preset;
  return nombre === (E.subtitulos.preset||'predeterminado') ? base
       : Object.assign(base, propio || {});
}

function campoColor(clave, etiqueta, valor, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <input type="color" data-k="${clave}" value="${esc(valor)}"></div>`;
}
function campoRango(clave, etiqueta, valor, min, max, sufijo, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <div class="slider"><input type="range" data-k="${clave}" data-num="1" min="${min}" max="${max}" step="1" value="${valor}">
      <span class="v">${valor}${sufijo||''}</span></div></div>`;
}
function campoSiNo(clave, etiqueta, valor, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <button class="btn sm" data-k="${clave}" data-bool="${valor?'1':'0'}">${valor?'sí':'no'}</button></div>`;
}
function campoLista(clave, etiqueta, valor, opciones, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <select class="btn sm" data-k="${clave}">${opciones.map(o=>
      `<option value="${esc(o)}" ${o===valor?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
}

      ${campoRango('escala_activa','Cuánto crece la activa', v.escala_activa, 100, 160, '%')}
      ${campoRango('grosor_borde','Grosor del borde', v.grosor_borde, 0, 20)}
      ${campoRango('sombra','Sombra', v.sombra, 0, 10)}

      ${campoSiNo('mayusculas','Mayúsculas', v.mayusculas)}
      ${campoSiNo('italica','Itálica', v.italica)}
      ${campoLista('reparto_respaldo','Reparto del respaldo', v.reparto_respaldo, op.repartos,
        'solo si edge-tts no da el tiempo por palabra')}
    </div>
    <div style="display:flex;gap:7px;margin-top:12px">
      <button class="btn go" id="e-guardar">Guardar y activar</button>
      <button class="btn" id="e-cancelar">Cancelar</button>
    </div>`;
}

            <div class="m muted" style="margin-bottom:5px">${esc(f.replace(/\.png$/,'').replace(/^_/,''))}</div>
            <img src="/previsualizacion/${encodeURIComponent(f)}" alt="${esc(f)}" loading="lazy"
                 style="width:100%;border:1px solid var(--line);border-radius:9px;display:block">
          </div>`).join('')}
      </div>`
      : `<div class="muted" style="margin-top:10px">Todavía no hay muestras. El botón tarda un
         minuto y hace falta ffmpeg.</div>`}`;

  document.querySelectorAll('.preset').forEach(el=>{
    el.onclick = async (ev)=>{
      // Los botones de ✎ y 🗑 viven dentro de la tarjeta: sin esto, tocarlos
      // activaría además el preset, que no es lo que pediste.
      if(ev.target.closest('[data-editar],[data-borrar]')) return;
      try{ await post('/api/preset',{preset:el.dataset.p});
        toast('Estilo: '+el.dataset.p); refrescar();
      }catch(e){ toast(e.message); }
    };
  });

  document.querySelectorAll('[data-editar]').forEach(b=>{
    b.onclick = ()=>{ const n = b.dataset.editar;
      editorEstilo = {base:n, nombre:n, nuevo:false}; pintar(); };
  });
  document.querySelectorAll('[data-borrar]').forEach(b=>{
    b.onclick = async ()=>{
      const n = b.dataset.borrar;
      if(!confirm('¿Borrar el estilo «'+n+'»?\n\nLos videos ya renderizados no cambian.')) return;
      try{ const j = await post('/api/estilo/borrar',{nombre:n});
        toast(j.volvio_al_predeterminado ? 'Borrado; vuelve el predeterminado' : 'Borrado: '+n);
        refrescar();
      }catch(e){ toast(e.message); }
    };
  });

  const bNuevo = $('#b-estilo-nuevo');
  if(bNuevo) bNuevo.onclick = ()=>{
    const base = E.subtitulos.preset || 'predeterminado';
    editorEstilo = {base, nombre:'', nuevo:true}; pintar();
  };

  if(editorEstilo) conectarEditorEstilo();
}

function conectarEditorEstilo(){
  // Los rangos enseñan su número al moverlos; el resto se lee al guardar.
  document.querySelectorAll('#editor-estilo input[type=range]').forEach(r=>{
    const v = r.parentElement.querySelector('.v');
    const sufijo = (v.textContent.match(/[^0-9]+$/)||[''])[0];
    r.oninput = ()=>{ v.textContent = r.value + sufijo; };
  });
  document.querySelectorAll('#editor-estilo [data-bool]').forEach(b=>{
    b.onclick = ()=>{ const ahora = b.dataset.bool === '1';
      b.dataset.bool = ahora ? '0' : '1'; b.textContent = ahora ? 'no' : 'sí'; };
  });

  const selFuente = $('#e-fuente');
  selFuente.onchange = ()=>{
    $('#e-fuente-otra').style.display = selFuente.value === '__otra' ? '' : 'none';
  };

  $('#e-mas-color').onclick = ()=>{
    const cont = $('#e-paleta');
    if(cont.querySelectorAll('[data-paleta]').length >= 8) return toast('Ocho colores es el tope');
    const hueco = document.createElement('span');
    hueco.innerHTML = '<input type="color" data-paleta="1" value="'+
      (E.subtitulos.color_activo||'#3BF07A')+'"> <span class="quita">×</span>';
    hueco.querySelector('.quita').onclick = ()=> hueco.remove();
    cont.insertBefore(hueco, $('#e-mas-color'));
  };
  document.querySelectorAll('#e-paleta .quita').forEach(x=>{
    x.onclick = ()=> x.parentElement.remove();
  });

  $('#e-cancelar').onclick = ()=>{ editorEstilo = null; pintar(); };
  $('#e-guardar').onclick = guardarEstilo;
}

function leerEditorEstilo(){
  const valores = {};
  document.querySelectorAll('#editor-estilo [data-k]').forEach(el=>{
    const k = el.dataset.k;
    if(el.dataset.bool !== undefined)      valores[k] = el.dataset.bool === '1';
    else if(el.dataset.num !== undefined)  valores[k] = parseInt(el.value, 10);
    else                                   valores[k] = el.value;
  });
  if(valores.fuente === '__otra') valores.fuente = ($('#e-fuente-libre').value||'').trim();
  valores.colores_resalte = [...document.querySelectorAll('#e-paleta [data-paleta]')].map(i=>i.value);
  return valores;
}

async function guardarEstilo(){
  const nombre = ($('#e-nombre').value||'').trim().toLowerCase().replace(/\s+/g,'_');
  if(!/^[a-z0-9_]{1,32}$/.test(nombre))
    return toast('El nombre va en minúsculas, sin acentos ni espacios');
  const valores = leerEditorEstilo();
  if(!valores.fuente) return toast('Falta el nombre de la fuente');
  try{
    const j = await post('/api/estilo/guardar',{nombre, valores, activar:true});
    editorEstilo = null;
    toast('Estilo «'+j.nombre+'» guardado y activo');
    refrescar();
  }catch(e){ toast(e.message); }
}

/* =========================================================
   PUBLICADOS
   ========================================================= */
function estadoPublicacion(x){
  // Se distingue "lo pedimos y YouTube lo aplicó" de "lo pedimos y no".
  // Antes solo se enseñaba lo que habíamos pedido, así que un video ya
  // público seguía apareciendo como "programado" y nada lo delataba.
  if(x.programado_ok === false)
    return `<span style="color:var(--crit)">⛔ YouTube no respetó la ventana` +
           (x.privacidad_real ? ` — quedó ${esc(x.privacidad_real)}` : '') + `</span>`;
  if(x.publish_at) return 'programado ' + esc(x.publish_at.slice(0,16).replace('T',' '));
  return 'público';
}

function datosPublicado(x){
  // Todo en una linea debajo del titulo, con su etiqueta al lado del numero.
  // Antes iba en columnas, y en un telefono las columnas dejaban al titulo
  // unos 80 px: ninguna fila se distinguia de la siguiente.
  // Los espacios duros no son decoracion: sin ellos la linea parte entre el
  // numero y la palabra, y queda un "1770" solo al final de un renglon.
  const d = [estadoPublicacion(x)];
  // Falta el dato no es lo mismo que cero vistas: un video borrado a mano, con
  // las estadisticas ocultas o subido despues de la ultima lectura no aparece
  // en vistas.json, y ensenar "0" ahi seria inventarselo.
  d.push(x.vistas === null || x.vistas === undefined
    ? '<span title="Sin leer todavía: pestaña Canal → Releer vistas">vistas&nbsp;sin&nbsp;leer</span>'
    : `<b style="color:var(--ink);font-variant-numeric:tabular-nums">${x.vistas.toLocaleString('es')}</b>&nbsp;vistas`);
  if(x.borrado_local) d.push('borrado&nbsp;del&nbsp;teléfono');
  else if(x.dias_restantes !== null) d.push(`${x.dias_restantes}d&nbsp;en&nbsp;el&nbsp;teléfono`);
  return d;
}

function firmaPublicados(){ return JSON.stringify(E.publicados); }
function pintaPublicados(){
  const p = E.publicados;
  const porBorrar = p.filter(x=>x.dias_restantes!==null && x.dias_restantes<=2 && !x.borrado_local);
  $('#v-publicados').innerHTML = `
    <h2>Subidos</h2>
    <p class="sub">Los archivos se quedan 7 días en el teléfono tras subirse, para que te dé tiempo de pasarlos a TikTok.</p>
    ${(()=>{ const mal = p.filter(x=>x.programado_ok === false).length;
      return mal ? `<div class="aviso crit"><span>⛔</span><div>
        <b>${mal} video(s) se publicaron sin ventana de revisión.</b>
        YouTube ignoró la fecha que se le pidió. Suele ser porque el canal no
        está verificado por teléfono: sin verificar no deja programar.
        <div style="margin-top:7px"><a class="btn sm" target="_blank" rel="noopener"
          href="https://www.youtube.com/verify">Verificar el canal ↗</a></div>
      </div></div>` : ''; })()}
    ${porBorrar.length ? `<div class="aviso crit"><span>↓</span><div><b>${porBorrar.length} se borran pronto.</b> Si los quieres para TikTok, descárgalos ya.</div></div>`:''}
    ${!p.length ? `<div class="aviso"><span>·</span><div>Todavía no hay nada publicado.</div></div>` : `
    <div class="list">${p.map(x=>`
      <div class="row" style="grid-template-columns:1fr auto">
        <div>
          <div class="t dos">${esc(x.titulo)}</div>
          <div class="info m">${datosPublicado(x).join('\u00a0· ')}</div>
        </div>
        ${x.video_id?`<a class="btn sm" target="_blank" rel="noopener"
          href="https://studio.youtube.com/video/${esc(x.video_id)}/edit">Studio ↗</a>`:'<span></span>'}
      </div>`).join('')}</div>`}

    <h3 class="sec">Subir ahora</h3>
    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div class="muted" style="flex-grow:1">Sube los pendientes respetando el límite diario de YouTube.</div>
      <button class="btn go" onclick="ejecutar('publicar')">⬆ Publicar</button>
      <button class="btn" onclick="if(confirm('¿Subir usando datos móviles?')) ejecutar('publicar_datos')">Con datos móviles</button>
    </div>`;
}


/* =========================================================
   CANAL

   Lo que pasó después de publicar: cuántas vistas tiene cada video de
   verdad, cuáles la revisión quincenal daría por muertos, y si ya toca
   volver a hacer largos.

   Las vistas no se piden aquí. Las deja relanzar.py en vistas.json y esto
   las pinta: pintar una pestaña no puede depender de que haya cobertura, y
   la API de YouTube tiene cuota diaria. Por eso se ve la fecha de la última
   lectura y hay un botón para releerlas.
   ========================================================= */
function firmaCanal(){ return JSON.stringify(E.canal || null); }

function haceCuanto(iso){
  if(!iso) return null;
  const min = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(min < 2) return 'ahora mismo';
  if(min < 60) return `hace ${min} min`;
  const h = Math.round(min/60);
  if(h < 24) return `hace ${h} h`;
  const d = Math.round(h/24);
  return d === 1 ? 'ayer' : `hace ${d} días`;
}

function pintaCanal(){
  const c = E.canal;
  if(!c){ $('#v-canal').innerHTML = '<h2>Canal</h2><p class="sub">Sin datos.</p>'; return; }

  const leido = haceCuanto(c.cuando);
  const L = c.largos || {};
  const pct = (L.suscriptores != null && L.umbral)
    ? Math.min(100, Math.round(L.suscriptores / L.umbral * 100)) : null;

  const fila = v => {
    const marca = {
      repetida:  '<span class="pill warn">repetida</span>',
      rehacible: '<span class="pill crit">nadie la vio</span>',
      sin_dato:  '<span class="pill idle">sin dato</span>',
    }[v.marca] || '';
    // La marca va debajo del titulo y no en una columna propia: «nadie la vio»
    // ocupa a lo ancho justo lo que hace falta para reconocer la historia.
    return `<div class="row" style="grid-template-columns:56px 1fr">
      <span class="m" style="text-align:right;font-variant-numeric:tabular-nums"
        title="${v.vistas === null ? 'No estaba en la última lectura' : 'Vistas en la última lectura'}"
        >${v.vistas === null ? '—' : v.vistas.toLocaleString('es')}</span>
      <div>
        <div class="t dos">${esc(v.titulo)}</div>
        <div class="meta">
          <span class="m">${v.dias === null ? 'sin fecha de subida' : v.dias + '&nbsp;días en el canal'}</span>
          ${marca}
        </div>
      </div>
    </div>`;
  };

  $('#v-canal').innerHTML = `
    <h2>Cómo le va al canal</h2>
    <p class="sub">Las vistas son las que YouTube dice, no una estimación.
      ${leido ? `Leídas ${leido}.` : 'Todavía no se han leído nunca.'}</p>

    ${!c.puede_borrar ? `<div class="aviso warn"><span>!</span><div>
      <b>El token no tiene permiso para borrar.</b> Esta pestaña se ve igual,
      pero la revisión solo podrá listar. Para arreglarlo, una vez, en Termux:
      <div style="margin-top:7px"><code style="font:12px var(--mono)">rm youtube_token.json && python generar_youtube_token.py</code></div>
    </div></div>` : ''}

    ${!c.total ? `<div class="aviso"><span>·</span><div>Todavía no hay nada subido al canal.</div></div>` : `
    <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div style="flex-grow:1" class="muted">
        <b style="color:var(--ink)">${c.total}</b> subidos ·
        <b style="color:var(--ink)">${c.vistas_totales.toLocaleString('es')}</b> vistas en total ·
        mediana <b style="color:var(--ink)">${c.mediana ?? '—'}</b>
      </div>
      <button class="btn sm" onclick="ejecutar('vistas')">↻ Releer vistas</button>
    </div>

    <h3 class="sec">Lo que haría la revisión</h3>
    <div class="card">
      <div class="muted" style="margin-bottom:10px">
        Corre sola los días 1 y 15. No toca lo subido hace menos de
        ${c.dias_minimos} días, ni rehace una historia que ya se intentó
        ${c.max_intentos} veces.</div>
      <div class="list">
        <div class="row" style="grid-template-columns:44px 1fr">
          <b style="font-variant-numeric:tabular-nums">${c.repetidas}</b>
          <div><div class="t">copias repetidas</div>
            <div class="m">se borran del canal y no se rehacen</div></div></div>
        <div class="row" style="grid-template-columns:44px 1fr">
          <b style="font-variant-numeric:tabular-nums">${c.rehacibles}</b>
          <div><div class="t">que no vio nadie</div>
            <div class="m">se borran y la historia vuelve a la cola</div></div></div>
        ${c.sin_dato ? `<div class="row" style="grid-template-columns:44px 1fr">
          <b style="font-variant-numeric:tabular-nums">${c.sin_dato}</b>
          <div><div class="t">sin dato de vistas</div>
            <div class="m">borrados a mano, ocultos, o subidos después de la última lectura</div></div></div>` : ''}
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:11px">
        <button class="btn" onclick="ejecutar('ver_revision')">Ver qué haría</button>
        <button class="btn danger" onclick="if(confirm('Borra del canal las copias repetidas y los videos sin ninguna vista, y devuelve esas historias a la cola.\\n\\nLos videos borrados no vuelven.')) ejecutar('revision')">Hacerlo ahora</button>
      </div>
      <div class="muted" style="margin-top:9px">
        ${c.ultima_revision ? `Última vez que se borró algo: ${haceCuanto(c.ultima_revision)}
          (${c.borrados_en_total} en total desde que se lleva la cuenta).`
        : 'Todavía no se ha borrado nada por aquí.'}</div>
    </div>`}

    <h3 class="sec">Videos largos</h3>
    <div class="card">
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        ${L.permite_largos ? '<span class="pill ok">ya se pueden hacer</span>'
                           : '<span class="pill idle">bloqueados</span>'}
        <span class="muted" style="flex-grow:1">${esc(L.motivo || '')}</span>
        <button class="btn sm" onclick="ejecutar('formato')">Comprobar</button>
      </div>
      ${pct !== null ? `<div class="barra" style="margin-top:11px"><i style="width:${pct}%"></i></div>
        <div class="m" style="margin-top:5px">${L.suscriptores} de ${L.umbral} suscriptores</div>` : ''}
      <div class="muted" style="margin-top:9px">
        Un largo necesita que YouTube lo recomiende, y sin suscriptores no lo
        recomienda: se renderiza igual y no lo ve nadie. Mientras tanto se
        aplazan solos, la historia no se pierde.</div>
    </div>

    ${c.total ? `<h3 class="sec">Uno por uno</h3>
    <div class="list">${c.videos.map(fila).join('')}</div>` : ''}`;
}

/* =========================================================
   TIKTOK
   ========================================================= */

/* Pantalla de publicación de TikTok. La pide su guía de revisión: tiene que
   verse a qué cuenta va, la privacidad hay que elegirla a mano (sin valor por
   defecto), los permisos respetan lo que la cuenta admite, y la declaración de
   contenido comercial enseña el aviso legal que toque. */
let creadorTk = null;

const TK_ETIQUETA = {PUBLIC_TO_EVERYONE:'Público', MUTUAL_FOLLOW_FRIENDS:'Amigos',
                     FOLLOWER_OF_CREATOR:'Seguidores', SELF_ONLY:'Solo yo (privado)'};

async function abrirTiktok(nombre){
  const caja = $('#tk-form-'+CSS.escape(nombre));
  if(!caja) return;
  if(caja.innerHTML){ caja.innerHTML=''; return; }
  caja.innerHTML = '<div class="muted" style="padding:10px 13px">Preguntando a TikTok qué permite tu cuenta…</div>';

  if(!creadorTk){
    const r = await fetch('/api/tiktok/creador');
    const d = await r.json();
    if(!d.ok){ caja.innerHTML = '<div class="aviso crit"><span>⛔</span><div>'+esc(d.error||'')+'</div></div>'; return; }
    creadorTk = d.creador;
  }
  const c = creadorTk;
  const previo = (E.tiktok.pendientes.find(p=>p.nombre===nombre)||{}).opciones || null;
  const n = esc(nombre);

  caja.innerHTML = `
    <div class="card" style="margin:8px 13px 13px;background:var(--surface-2)">
      <div class="muted" style="margin-bottom:12px">
        TikTok exige que estas decisiones se tomen una por una, sin valores por
        defecto. Nada se publica hasta que guardes.
      </div>

      <div style="display:flex;align-items:center;gap:8px;padding-bottom:11px;
                  border-bottom:1px solid var(--line)">
        <span class="pill acc">Cuenta</span>
        <b>@${esc(c.creator_username||'')}</b>
        <span class="m">${c.creator_nickname?esc(c.creator_nickname):''}</span>
      </div>

      <div style="margin-top:13px">
        <label for="tk-priv-${n}"><b>1 · ¿Quién puede verlo?</b></label>
        <select id="tk-priv-${n}" class="btn" style="width:100%;margin-top:5px"
                onchange="revisaTiktok('${n}')">
          <option value="">— elige una opción —</option>
          ${(c.privacy_level_options||[]).map(o=>`<option value="${esc(o)}"
            ${previo && previo.privacidad===o?'selected':''}>${esc(TK_ETIQUETA[o]||o)}</option>`).join('')}
        </select>
      </div>

      <div style="margin-top:15px">
        <b>2 · ¿Qué permites a quien lo vea?</b>
        <div class="finos" style="margin-top:6px">
          ${[['comentarios','Comentarios',c.comment_disabled],
             ['dueto','Dúo',c.duet_disabled],
             ['stitch','Stitch',c.stitch_disabled]].map(([k,txt,off])=>`
            <label class="fino ${off?'no':''}">
              <input type="checkbox" id="tk-${k}-${n}" ${off?'disabled':''}
                ${previo && previo[k] && !off ? 'checked':''}>
              <span>${txt}${off?'<br><span class="m">apagado en tu cuenta</span>':''}</span>
            </label>`).join('')}
        </div>
      </div>

      <div style="margin-top:15px">
        <b>3 · ¿Promociona algo?</b>
        <label class="fino" style="margin-top:6px">
          <input type="checkbox" id="tk-com-${n}"
            ${previo && previo.comercial && previo.comercial.activo?'checked':''}
            onchange="document.getElementById('tk-com-caja-${n}').hidden=!this.checked;revisaTiktok('${n}')">
          <span>Sí, este vídeo promociona algo</span>
        </label>
        <div id="tk-com-caja-${n}" class="sangria"
             ${previo && previo.comercial && previo.comercial.activo?'':'hidden'}>
          <label class="fino"><input type="checkbox" id="tk-marca-${n}"
            onchange="revisaTiktok('${n}')"
            ${previo && previo.comercial && previo.comercial.marca_propia?'checked':''}>
            <span>Mi propia marca<br><span class="m">se etiqueta «Contenido promocional»</span></span></label>
          <label class="fino"><input type="checkbox" id="tk-patro-${n}"
            onchange="revisaTiktok('${n}')"
            ${previo && previo.comercial && previo.comercial.patrocinado?'checked':''}>
            <span>Contenido patrocinado<br><span class="m">se etiqueta «Colaboración pagada»</span></span></label>
          <div class="muted">
            <a href="https://www.tiktok.com/legal/page/global/bc-policy/es" target="_blank" rel="noopener">Política de contenido de marca ↗</a>
            · <a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/es" target="_blank" rel="noopener">Uso de música ↗</a></div>
        </div>
      </div>

      <div id="tk-alerta-${n}" style="margin-top:13px"></div>
      <div style="margin-top:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn go" id="tk-ok-${n}" onclick="guardarTiktok('${n}')">Guardar y dejar listo</button>
        <button class="btn" onclick="abrirTiktok('${n}')">Cerrar</button>
        <span class="m" id="tk-msg-${n}"></span>
      </div>
    </div>`;
  revisaTiktok(nombre);
}

/* Las mismas reglas que valida el servidor, pero dichas antes de pulsar
   Guardar: enterarse de que el patrocinio no puede ser privado *después* de
   rellenar el formulario es justo lo que hacia opaca esta pantalla. */
function tkFallo(nombre){
  const v = id => document.getElementById(id+'-'+nombre);
  if(!v('tk-priv').value) return 'Elige quién puede verlo.';
  if(v('tk-com').checked){
    if(!v('tk-marca').checked && !v('tk-patro').checked)
      return 'Marca si es tu marca, contenido patrocinado, o las dos.';
    if(v('tk-patro').checked && v('tk-priv').value === 'SELF_ONLY')
      return 'El contenido patrocinado no puede ser privado: elige otra visibilidad.';
  }
  return '';
}

function revisaTiktok(nombre){
  const fallo = tkFallo(nombre);
  const alerta = document.getElementById('tk-alerta-'+nombre);
  const boton = document.getElementById('tk-ok-'+nombre);
  if(!alerta || !boton) return;
  boton.disabled = !!fallo;
  alerta.innerHTML = fallo
    ? `<div class="aviso warn"><span>·</span><div>${esc(fallo)}</div></div>` : '';
}

async function guardarTiktok(nombre){
  const v = id => document.getElementById(id+'-'+nombre);
  const msg = v('tk-msg');
  const comercial = v('tk-com').checked;
  const cuerpo = {
    privacidad: v('tk-priv').value,
    comentarios: v('tk-comentarios').checked,
    dueto: v('tk-dueto').checked,
    stitch: v('tk-stitch').checked,
    comercial: {activo: comercial,
                marca_propia: comercial && v('tk-marca').checked,
                patrocinado: comercial && v('tk-patro').checked},
  };
  const r = await fetch('/api/tiktok/opciones/'+encodeURIComponent(nombre), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cuerpo)});
  const d = await r.json();
  msg.textContent = d.ok ? 'Guardado.' : (d.error||'No se pudo guardar');
  if(d.ok){ firmas.tiktok = null; refrescar(); }
}

async function marcarEnTiktok(ruta, titulo){

  const r = await fetch('/api/tiktok/marcar', {

/* El guion del vídeo demo de la auditoría.

   TikTok pide una grabación de pantalla con cinco escenas seguidas y sin
   cortes entre la elección y el resultado. Una toma fallida son cuatro
   minutos tirados, y lo que se olvida no es apretar grabar: es el orden, y
   comprobar antes que la toma va a salir.

   Las cuatro primeras escenas se marcan solas porque el panel se entera de
   que han ocurrido de verdad (token nuevo, cuenta consultada, elección
   guardada, subida terminada). La quinta pasa dentro de la app de TikTok,
   así que se enseña como recordatorio y no como casilla.

   Fuera de una grabación en curso esto es una línea y un botón: no estorba
   los otros 364 días. */
/* Copia el pie al portapapeles del telefono.

   navigator.clipboard solo existe en contexto seguro: va bien en
   http://localhost, que es como se abre el panel normalmente, pero no si lo
   abres por la IP de la red local. De ahi el respaldo con un textarea y
   execCommand, que es viejo pero sigue funcionando en el WebView de Android. */
async function copiarPie(boton, texto){
  let ok = false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(texto);
      ok = true;
    }
  }catch(e){ ok = false; }
  if(!ok){
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
  }
  // El aviso va en el propio boton: un toast pediria sitio que a 412px no
  // sobra, y aqui lo que hace falta es saber si pegar ya vale la pena.
  const antes = boton.textContent;
  boton.textContent = ok ? '\u2713 Copiado' : '\u2717 No pude';
  boton.disabled = true;
  setTimeout(()=>{ boton.textContent = antes; boton.disabled = false; }, 1500);
}

          <input data-cx-input="${esc(s.clave)}" placeholder="2 · Pega aquí la clave" autocomplete="off"

async function conectarGuardar(clave){
  const valor = (cxBorrador[clave] || '').trim();
  if(!valor){ cxNota[clave] = {ok:false, texto:'Primero pega la clave.'}; pintar(); return; }
  cxNota[clave] = {ok:true, texto:'Probándola con el servicio…'}; pintar();
  try{
    const r = await post('/api/conectar/' + encodeURIComponent(clave), {valor});
    // Guardada: la clave sale del panel. No tiene por qué quedarse a la vista.
    delete cxBorrador[clave]; cxAbierto.delete(clave);
    cxNota[clave] = {ok:true, texto:'✓ ' + r.mensaje + (r.aviso ? ' ' + r.aviso : '')};
    conectarCache = null; secretosCache = []; refrescar();
  }catch(e){ cxNota[clave] = {ok:false, texto:'✗ ' + e.message}; pintar(); }
}

function enlazarConectar(){
  document.querySelectorAll('[data-cx-input]').forEach(i => i.oninput = ()=>{
    cxBorrador[i.dataset.cxInput] = i.value;
  });
  document.querySelectorAll('[data-cx-cambiar]').forEach(b => b.onclick = ()=>{
    cxAbierto.add(b.dataset.cxCambiar); delete cxNota[b.dataset.cxCambiar]; pintar();
  });
  document.querySelectorAll('[data-cx-cancelar]').forEach(b => b.onclick = ()=>{
    const k = b.dataset.cxCancelar; cxAbierto.delete(k); delete cxBorrador[k]; delete cxNota[k]; pintar();
  });
  document.querySelectorAll('[data-cx-guardar]').forEach(b => b.onclick = ()=> conectarGuardar(b.dataset.cxGuardar));
  // Pegar y probar de un toque: es lo que se hace nueve de cada diez veces.
  // Si el navegador no deja leer el portapapeles, se deja el campo listo
  // para pegar a mano con una pulsación larga.
  document.querySelectorAll('[data-cx-pegar]').forEach(b => b.onclick = async ()=>{
    const k = b.dataset.cxPegar;
    let texto = '';
    try{ texto = (await navigator.clipboard.readText()).trim(); }catch(e){}
    if(!texto){
      const campo = document.querySelector(`[data-cx-input="${k}"]`);
      if(campo) campo.focus();
      toast('Mantén pulsado el campo y elige «Pegar»');
      return;
    }
    cxBorrador[k] = texto;
    conectarGuardar(k);
  });
  document.querySelectorAll('[data-cx-copiar]').forEach(b => b.onclick = ()=> copiarPie(b, b.dataset.cxCopiar));
}

        <div class="m">Buscar por nombre necesita una <code style="font:11.5px var(--mono)">YOUTUBE_API_KEY</code>

      </div>`}

               spellcheck="false" style="width:100%;margin-bottom:8px">

  // Sliders: se muestra en vivo, se guarda al soltar (un POST por pixel

      + '2. Quitar de la cola lo ya grabado (reescribe guion.txt, con copia)\n'
      + (E.partir_auto ? '3. Partir en varios shorts las historias demasiado largas (también con copia)\n' : '')
      + (E.partir_auto ? '4' : '3') + '. Cambiar la música que ya sonó\n\n¿Seguimos?')) return;
    try{
      const j = await post('/api/mantenimiento',{});
      const hechos = j.encolados.map(e=>e.nombre).join(', ');
      toast(hechos ? 'En marcha: ' + hechos : 'No se pudo encolar nada');
      (j.saltados||[]).forEach(sx=> toast('Se salta ' + sx.accion + ': ' + sx.motivo));
      refrescar();
    }catch(e){ toast(e.message); }
  };
  $('#b-partir-auto').onclick = async ()=>{
    try{ const j = await post('/api/partir/auto',{auto: !E.partir_auto});
      toast(j.auto ? 'Las historias largas se partirán solas'
                   : 'Solo se parte lo que elijas en la Cola'); refrescar();
    }catch(e){ toast(e.message); }
  };
  $('#b-musica-auto').onclick = async ()=>{
    try{ const j = await post('/api/musica/auto',{auto: !E.musica_auto});
      toast(j.auto ? 'La música se cambiará sola tras cada render'
                   : 'La música solo cambia cuando lo pidas'); refrescar();
    }catch(e){ toast(e.message); }
  };
  const chkChip = $('#chk-chip-android');
  if(chkChip) chkChip.onchange = async ()=>{
    const val = chkChip.checked;
    try{ const j = await post('/api/video/chip_android', {usar_chip_android: val});
      toast(j.usar_chip_android ? 'Se probará el chip de video en el próximo render'
                                 : 'Vuelve a renderizar por CPU (libx264)');
      E.usar_chip_android = j.usar_chip_android;
    }catch(e){ chkChip.checked = !val; toast(e.message); }
  };
  document.querySelectorAll('[data-quitar-canal]').forEach(b=>b.onclick = async ()=>{
    try{ await post('/api/fuentes/canal', {canal: b.dataset.quitarCanal, quitar: true});
      toast('Quitado: ' + b.dataset.quitarCanal); refrescar();
    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-quitar-sub]').forEach(b=>b.onclick = async ()=>{
    try{ await post('/api/fuentes/subreddit', {subreddit: b.dataset.quitarSub, quitar: true});
      toast('Quitado: r/' + b.dataset.quitarSub); refrescar();
    }catch(e){ toast(e.message); }
  });
  const bFuCanalBuscar = $('#b-fu-canal-buscar');
  if(bFuCanalBuscar) bFuCanalBuscar.onclick = async ()=>{
    const campo = $('#fu-canal-q'), val = (campo.value || '').trim();
    if(!val) return;
    bFuCanalBuscar.disabled = true; bFuCanalBuscar.textContent = 'Buscando…';
    try{ const j = await api('/api/fuentes/buscar_canal?q=' + encodeURIComponent(val));
      fuentesResultadosCanal = j.resultados || [];
    }catch(e){ fuentesResultadosCanal = null; toast(e.message); }
    bFuCanalBuscar.disabled = false; bFuCanalBuscar.textContent = '🔎 Buscar';
    pintar();
  };
  document.querySelectorAll('[data-agregar-canal]').forEach(b=>b.onclick = async ()=>{
    try{ const j = await post('/api/fuentes/canal', {canal: b.dataset.agregarCanal});
      toast(j.cambio ? 'Agregado: ' + b.dataset.agregarCanal : 'Ya estaba en la lista');
      fuentesResultadosCanal = null; refrescar();
    }catch(e){ toast(e.message); }
  });
  const bFuCanal = $('#b-fu-canal');
  if(bFuCanal) bFuCanal.onclick = async ()=>{
    const campo = $('#fu-canal'), val = (campo.value || '').trim();
    if(!val) return;
    try{ const j = await post('/api/fuentes/canal', {canal: val});
      toast(j.cambio ? 'Agregado: ' + val : 'Ya estaba en la lista');
      refrescar();
    }catch(e){ toast(e.message); }
  };
  const bFuSub = $('#b-fu-sub');
  if(bFuSub) bFuSub.onclick = async ()=>{
    const campo = $('#fu-sub'), val = (campo.value || '').trim();
    if(!val) return;
    try{ const j = await post('/api/fuentes/subreddit', {subreddit: val});
      toast(j.cambio ? 'Agregado: r/' + val : 'Ya estaba en la lista');
      refrescar();
    }catch(e){ toast(e.message); }
  };
  pintaBotonesOir();
}

/* ---------- ver / copiar / poner un secreto ----------
   Copiar directamente tras el fetch fallaba: para cuando llega la respuesta,
   Chrome ya no considera el clic "reciente" y niega el portapapeles sin
   decir nada. Por eso primero se muestra el valor y el botón de copiar actúa
   sobre algo que ya está en memoria — y si aun así el portapapeles falla,
   el texto queda a la vista para seleccionarlo a mano. */
async function abrirSecreto(nombre, tipo){
  let valor = '';
  try{ valor = (await api('/api/secretos/'+encodeURIComponent(nombre))).valor; }
  catch(e){ valor = ''; }

  const editable = tipo === 'entorno';
  const caja = document.createElement('div');
  caja.className = 'modal';
  caja.innerHTML = `
    <div class="caja">
      <b style="font:12px var(--mono)">${esc(nombre)}</b>
      <div class="muted" style="margin:8px 0 10px">
        ${editable ? 'Pégala aquí para guardarla en secretos.env, o cópiala para GitHub.'
                   : 'Contenido del archivo. Pégalo tal cual en el Secret de GitHub.'}</div>
      ${editable ? `<input type="text" id="s-val" value="${esc(valor)}" spellcheck="false"
                      placeholder="pega aquí la clave">`
                 : `<textarea id="s-val" readonly spellcheck="false">${esc(valor)}</textarea>`}
      <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">
        <button class="btn go" id="s-copiar">Copiar</button>
        ${editable ? '<button class="btn" id="s-guardar">Guardar</button>' : ''}
        <button class="btn" id="s-cerrar" style="margin-left:auto">Cerrar</button>
      </div>
      <div class="muted" id="s-nota" style="margin-top:9px"></div>
    </div>`;
  document.body.appendChild(caja);
  const campo = caja.querySelector('#s-val');
  const nota = caja.querySelector('#s-nota');

  caja.querySelector('#s-copiar').onclick = async ()=>{
    const texto = campo.value;
    if(!texto) return nota.textContent = 'No hay nada que copiar todavía.';
    campo.select(); campo.setSelectionRange(0, texto.length);
    try{
      await navigator.clipboard.writeText(texto);
      nota.textContent = '✓ Copiado al portapapeles.';
    }catch(e){
      // Reserva para cuando el portapapeles está bloqueado.
      const ok = document.execCommand && document.execCommand('copy');
      nota.textContent = ok ? '✓ Copiado al portapapeles.'
        : 'El navegador no dejó copiar. El texto ya está seleccionado: usa «Copiar» del menú largo.';
    }
  };
  if(editable) caja.querySelector('#s-guardar').onclick = async ()=>{
    try{ await post('/api/secretos/'+encodeURIComponent(nombre), {valor: campo.value.trim()});
      nota.textContent = '✓ Guardada en secretos.env — ya sobrevive a cerrar Termux.';
      secretosCache = []; refrescar();
    }catch(e){ nota.textContent = 'No se pudo guardar: ' + e.message; }
  };
  const cerrar = ()=>caja.remove();
  caja.querySelector('#s-cerrar').onclick = cerrar;
  caja.onclick = e => { if(e.target === caja) cerrar(); };
}

/* =========================================================
   CICLO DE PINTADO

   Cada vista declara una firma de lo que muestra. Si la firma no cambió, no
   se repinta: reescribir el HTML en cada refresco reiniciaba el <video>, te
   devolvía al inicio de las listas y hacía perder lo que estabas escribiendo.
   ========================================================= */
const VISTAS = {
  revisar:    [firmaRevisar,    pintaRevisar],
  cola:       [firmaCola,       pintaCola],
  estilo:     [firmaEstilo,     pintaEstilo],
  publicados: [firmaPublicados, pintaPublicados],
  canal:      [firmaCanal,      pintaCanal],
  tiktok:     [firmaTiktok,     pintaTiktok],
  ajustes:    [firmaAjustes,    pintaAjustes],
};
let firmas = {};

function vistaActual(){ return document.querySelector('.tabs button.on').dataset.v; }

function pintar(){
  if(!E) return;
  // Antes que nada y antes de las firmas: lo que sigue usa seleccion y
  // musicaElegida, y tienen que estar ya limpias de números que cambiaron
  // de dueño.
  olvidarLoQueSeRenumero();
  // Un contador en 0 no dice nada y ocupa sitio en la tira: se esconde.
  const contador = (id, n) => { const c = $(id); c.textContent = n; c.style.display = n ? '' : 'none'; };
  contador('#c-rev', E.videos.filter(x=>!x.publicado).length);
  contador('#c-col', E.historias.filter(h=>!h.renderizada).length);
  contador('#c-pub', E.publicados.length);
  // En Canal el número que importa es lo que la revisión se llevaría.
  contador('#c-can', E.canal ? (E.canal.repetidas + E.canal.rehacibles) : 0);
  contador('#c-tk', (E.tiktok && E.tiktok.pendientes) ? E.tiktok.pendientes.length : 0);
  pintaJob();
  pintaColaTrabajos();
  pintaPaso();

  const v = vistaActual();
  const [firma, pinta] = VISTAS[v];
  const f = firma();
  if(firmas[v] !== f){ firmas[v] = f; pinta(); }
  if(v === 'revisar') pintaTira();
}

/* El siguiente paso, para quien no se sabe el orden del pipeline. Lo decide
   el servidor (siguiente_paso en servidor.py); aquí solo se pinta. Va en su
   propio hueco, fuera de las pestañas, con su propia firma: dentro de
   Revisar se quedaría congelado, porque esa vista no se repinta mientras no
   cambien los videos. Sale en Revisar y en Cola, que es donde se empieza. */
let firmaPaso = null;
function pintaPaso(){
  const s = E && E.siguiente, v = vistaActual();
  const visible = s && (v === 'revisar' || v === 'cola');
  const f = visible ? JSON.stringify(s) + v : '';
  if(f === firmaPaso) return;
  firmaPaso = f;
  const slot = $('#paso-slot');
  if(!visible){ slot.innerHTML = ''; return; }
  slot.innerHTML = `
    <div class="card siguiente">
      <div class="kicker">Siguiente paso</div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:4px">
        <b style="flex-grow:1;font-size:16px">${esc(s.titulo)}</b>
        <button class="btn go" id="b-paso" style="white-space:nowrap">${esc(s.boton)} →</button>
      </div>
      <div style="margin-top:6px;font-size:13.5px;color:var(--ink-dim)">${esc(s.detalle)}</div>
    </div>`;
  $('#b-paso').onclick = ()=>{
    if(s.accion === 'renderizar') return ejecutar('renderizar', {historias: s.historias});
    if(s.accion) return ejecutar(s.accion);
    if(s.ir) irA(s.ir);
  };
}
// Cambiar de pestaña desde un botón, llevando también la tira de pestañas:
// en un teléfono Ajustes queda fuera de la vista, a la derecha.
function irA(vista){
  const b = document.querySelector(`.tabs button[data-v="${vista}"]`);
  if(!b) return;
  b.click();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function refrescar(){
  try{
    E = await api('/api/estado');
    // Los secretos van aparte: el valor no viaja aquí, solo si están puestos.
    if(vistaActual() === 'ajustes' && !secretosCache.length){
      try{ secretosCache = await api('/api/secretos'); }catch(e){}
    }
    if(vistaActual() === 'ajustes' && !conectarCache){
      try{ conectarCache = await api('/api/conectar'); }catch(e){}
    }
    pintar();
  }
  catch(e){ $('#job-slot').innerHTML =
    `<div class="aviso crit"><span>✕</span><div>Se perdió la conexión con el servidor. ¿Sigue corriendo <code style="font:12px var(--mono)">python servidor.py</code>?</div></div>`; }
}

// Tocar la barra de abajo sube a la tarjeta, que es donde están el detalle y
// los botones de pausar y abortar.
$('#mini-job').onclick = ()=>window.scrollTo({top:0, behavior:'smooth'});

/* La tira de pestañas rueda de lado, así que hay que avisar de que queda
   alguna fuera del borde derecho. */
const tiraTabs = document.querySelector('.tabs');
function sombraTabs(){
  tiraTabs.classList.toggle('mas',
    tiraTabs.scrollLeft + tiraTabs.clientWidth < tiraTabs.scrollWidth - 1);
}
tiraTabs.addEventListener('scroll', sombraTabs, {passive:true});
addEventListener('resize', sombraTabs);
sombraTabs();

document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabs button').forEach(o=>o.classList.toggle('on', o===b));
    document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on', s.id==='v-'+b.dataset.v));
    window.scrollTo(0,0);
    // Si la pestaña estaba medio asomada por un lado, se centra: da igual que
    // ya se haya pintado, lo que importa es poder leer en cuál estás.
    b.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    refrescar();
  };
});
refrescar();
// Mientras algo corre conviene ver el avance; si no, no hace falta insistir.
// Con la pestaña oculta (pantalla apagada durante un render, otra app) no se
// pide nada: nadie lo está mirando, y al volver se pone al día en el acto.
setInterval(()=>{ const j=E&&E.trabajo;
  if(!document.hidden && j && (j.estado==='corriendo'||j.estado==='pausado')) refrescar(); }, 1500);
setInterval(()=>{ if(!document.hidden) refrescar(); }, 12000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refrescar(); });

/* Latido: mientras la pestaña esté abierta, el servidor sabe que sigues
   aquí. Si deja de llegar (cerraste el panel), se apaga solo y suelta el
   wake lock. El margen del servidor es amplio porque Chrome ralentiza los
   temporizadores en segundo plano — cambiar de app un rato no lo apaga. */
setInterval(()=>{ fetch('/api/latido',{method:'POST'}).catch(()=>{}); }, 20000);

/* Service worker: es lo que convierte el panel en una app instalable de
   verdad (Chrome no ofrece instalar una página sin uno) y lo que hace que
   abrir el icono con el servidor apagado enseñe una pantalla propia en vez
   del dinosaurio. No cachea el panel — ver web/sw.js. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
fetch('/api/latido',{method:'POST'}).catch(()=>{});

// Actualizar a mano. El panel ya se refresca solo, pero tenerlo a mano
// quita la duda de si lo que ves es de hace un momento o de ahora.
$('#b-actualizar').onclick = async (e)=>{
  const b = e.currentTarget;
  b.textContent = '·'; b.disabled = true;
  await refrescar();
  b.textContent = '↻'; b.disabled = false;
  toast('Actualizado');
};

$('#b-apagar').onclick = async ()=>{
  const j = E && E.trabajo, enEspera = ((E && E.cola) || []).length;
  if(j && (j.estado==='corriendo'||j.estado==='pausado')){
    // La cola vive en memoria del servidor: apagar no la aplaza, la borra.
    // Decirlo aquí, que es donde se pierde, y no solo en la documentación.
    const extra = enEspera ? `\n(y ${enEspera} en espera se pierden)` : '';
    if(!confirm('Hay algo corriendo. ¿Apagar el panel de todas formas?\n(el trabajo se interrumpe)' + extra)) return;
  }else if(enEspera){
    if(!confirm(`Hay ${enEspera} en espera. ¿Apagar de todas formas?\n(la cola se pierde)`)) return;
  }
  try{ await fetch('/api/apagar',{method:'POST'}); }catch(e){}
  document.body.innerHTML = `<div style="max-width:420px;margin:22vh auto;padding:0 20px;
    text-align:center;font:15px/1.6 var(--body);color:var(--ink-dim)">
    <div style="font-size:34px;margin-bottom:12px">⏻</div>
    <b style="color:var(--ink);font-size:16px">Panel apagado</b>
    <p>Termux quedó libre y se soltó el wake lock. Ya puedes cerrar esta pestaña.</p>
    <p style="font:12px var(--mono)">Para volver: <b>panel</b> en Termux</p></div>`;
};
</script>
</body>

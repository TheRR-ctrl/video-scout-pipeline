/* El último respaldo hecho aquí: dónde quedó y cómo sacarlo. Sin esto el
   archivo aparecía en una línea de la salida del trabajo y había que ir a
   buscarlo con el gestor de archivos. */
function bloqueUltimoRespaldo(){
  const r = E.ultimo_respaldo;
  if(!r) return '';
  const peso = r.bytes >= 1048576 ? (r.bytes/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(r.bytes/1024)) + ' KB';
  const cuando = r.fecha ? new Date(r.fecha).toLocaleString('es', {dateStyle:'medium', timeStyle:'short'}) : '';
  const tipo = {ajustes:'solo ajustes', ninguno:'sin videos', sin_subir:'con los videos sin subir',
                todos:'con todos los videos'}[r.tipo] || '';
  return `
    <div class="card" style="margin-top:10px">
      <h3 class="sec" style="margin:0 0 8px">Último respaldo</h3>
      <div style="margin-top:4px"><b style="overflow-wrap:anywhere">${esc(r.nombre)}</b></div>
      <div class="muted">${[tipo, peso, cuando].filter(Boolean).map(esc).join(' · ')}</div>
      ${/\/(Download|Downloads|Descargas)\//.test(r.ruta.replace(/\\/g,'/'))
        ? '<div style="margin-top:6px">Está en tu carpeta <b>Descargas</b>:</div>' : ''}
      <div style="margin-top:4px;font:11.5px var(--mono);color:var(--ink-dim);overflow-wrap:anywhere">${esc(r.ruta)}</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
        <button class="btn go" id="b-compartir-respaldo">${E.es_android ? '📤 Enviar…' : '📂 Abrir la carpeta'}</button>
        <button class="btn" id="b-copiar-ruta-respaldo">Copiar la ruta</button>
      </div>
      ${E.es_android ? `<div class="muted" style="margin-top:8px">«Enviar» abre el menú de compartir de Android:
        WhatsApp a ti mismo, Drive o correo. Necesita la app Termux:API.</div>
      <details id="ayuda-compartir" style="margin-top:8px">
        <summary style="cursor:pointer;font-size:13.5px">¿No se abre nada al pulsar «Enviar»?</summary>
        <div class="muted" style="margin-top:6px">Android no deja que una app en segundo plano abra el menú
          de compartir si no tiene permiso. Una sola vez:
          <b>Ajustes de Android → Apps → Termux:API → Mostrar sobre otras apps → Permitir</b>
          (si sigue sin salir, lo mismo con <b>Termux</b>), y vuelve a pulsar «Enviar».</div>
        <div class="muted" style="margin-top:6px">O a mano, sin permisos: abre la app <b>Archivos</b> → <b>Descargas</b>,
          mantén pulsado <code style="font:11.5px var(--mono)">${esc(r.nombre)}</code> y toca <b>Compartir</b>.</div>
      </details>` : ''}
    </div>`;
}

function conectarPasarAlPC(){
  const bComp = $('#b-compartir-respaldo');
  if(bComp) bComp.onclick = async ()=>{
    try{
      const j = await post('/api/respaldo/compartir', {});
      toast(j.como === 'compartir' ? 'Abriendo el menú de compartir…' : 'Abriendo la carpeta…');
      // Si Android lo bloquea no hay error que recibir: se deja a la vista
      // la explicación y el camino a mano, por si el menú no aparece.
      const ayuda = $('#ayuda-compartir');
      if(ayuda) ayuda.open = true;
    }catch(e){ toast(e.message); }
  };
  const bRuta = $('#b-copiar-ruta-respaldo');
  if(bRuta) bRuta.onclick = ()=> copiarPie(bRuta, E.ultimo_respaldo.ruta);
  const bExp = $('#b-exportar-ajustes');
  if(bExp) bExp.onclick = ()=> ejecutar('respaldo_ajustes');
  const f = $('#f-importar');
  if(!f) return;
  f.onchange = ()=>{
    const archivo = f.files && f.files[0];
    f.value = '';
    if(!archivo) return;
    if(!confirm(`¿Restaurar «${archivo.name}» en este ${equipo()}?\n\n`
      + 'Pone las claves, la sesión de YouTube, los ajustes, lo ya subido y la cola del teléfono, '
      + 'reemplazando lo que haya aquí.')) return;
    // XMLHttpRequest y no fetch: es lo único que da el avance de la subida,
    // y un respaldo con videos tarda.
    const x = new XMLHttpRequest();
    x.open('POST', '/api/respaldo/importar');
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => {
      if(e.lengthComputable) toast(`Subiendo el respaldo… ${Math.round(e.loaded / e.total * 100)}%`);
    };
    x.onload = ()=>{
      let j = {};
      try{ j = JSON.parse(x.responseText); }catch(e){}
      if(x.status >= 400) return toast(j.error || `Falló (${x.status})`);
      toast(j.encolado ? `En espera (${j.encolado.posicion}º): restaurar el respaldo`
                       : 'Restaurando… mira la tarjeta de arriba');
      secretosCache = []; conectarCache = null; horarioCache = null;
      refrescar();
    };
    x.onerror = ()=> toast('Se cortó la subida. ¿Sigue abierto el panel?');
    toast('Subiendo el respaldo…');
    x.send(archivo);
  };
}

/* ---------- ver / copiar / poner un secreto ----------
   Copiar directamente tras el fetch fallaba: para cuando llega la respuesta,
   Chrome ya no considera el clic "reciente" y niega el portapapeles sin
   decir nada. Por eso primero se muestra el valor y el botón de copiar actúa
   sobre algo que ya está en memoria — y si aun así el portapapeles falla,
   el texto queda a la vista para seleccionarlo a mano. */
async function abrirSecreto(nombre, tipo){
  let valor = '';
  try{ valor = (await api('/api/secretos/'+encodeURIComponent(nombre))).valor; }
  catch(e){ valor = ''; }

  const editable = tipo === 'entorno';
  // Un archivo de credenciales (el token de YouTube, client_secret.json) se
  // puede pegar: se copia con «Ver / copiar» en el otro aparato (teléfono o
  // PC) y aquí se escribe el archivo. Si ya existe, se puede reemplazar.
  const esArchivo = tipo === 'archivo';
  const archivoDe = {YOUTUBE_TOKEN: 'youtube_token.json', YOUTUBE_CLIENT_SECRET: 'client_secret.json'};
  const caja = document.createElement('div');
  caja.className = 'modal';
  caja.innerHTML = `
    <div class="caja">
      <b style="font:12px var(--mono)">${esc(nombre)}</b>
      <div class="muted" style="margin:8px 0 10px">
        ${editable ? 'Pégala aquí para guardarla en secretos.env, o cópiala para GitHub.'
          : valor ? 'Contenido del archivo. Cópialo para pegarlo en el Secret de GitHub o en el panel '
                  + 'del otro aparato (teléfono ↔ PC).'
          : `Falta ${esc(archivoDe[nombre] || 'el archivo')}. Pega aquí su contenido y se crea solo: `
            + 'cópialo con «Ver / copiar» en el panel del aparato donde sí está (teléfono o PC).'}</div>
      ${editable ? `<input type="text" id="s-val" value="${esc(valor)}" spellcheck="false"
                      placeholder="pega aquí la clave">`
                 : `<textarea id="s-val" ${valor ? 'readonly' : ''} spellcheck="false"
                      placeholder='pega aquí el contenido entero, de { a }'>${esc(valor)}</textarea>`}
      <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">
        ${valor ? '<button class="btn go" id="s-copiar">Copiar</button>' : ''}
        ${editable || (esArchivo && !valor) ? '<button class="btn go" id="s-guardar">Guardar</button>' : ''}
        ${esArchivo && valor ? '<button class="btn" id="s-reemplazar">Reemplazar</button>' : ''}
        <button class="btn" id="s-cerrar" style="margin-left:auto">Cerrar</button>
      </div>
      <div class="muted" id="s-nota" style="margin-top:9px"></div>
    </div>`;
  document.body.appendChild(caja);
  const campo = caja.querySelector('#s-val');
  const nota = caja.querySelector('#s-nota');

  const bReemplazar = caja.querySelector('#s-reemplazar');
  if(bReemplazar) bReemplazar.onclick = ()=>{
    if(!confirm('¿Reemplazar el archivo que hay por otro que vas a pegar?')) return;
    campo.readOnly = false; campo.value = ''; campo.focus();
    bReemplazar.outerHTML = '<button class="btn go" id="s-guardar">Guardar</button>';
    caja.querySelector('#s-guardar').onclick = guardarArchivo;
    nota.textContent = 'Pega el contenido nuevo y pulsa Guardar.';
  };
  async function guardarArchivo(){
    try{ await post('/api/secretos/'+encodeURIComponent(nombre), {valor: campo.value.trim()});
      nota.textContent = `✓ Guardado ${archivoDe[nombre] || ''}. Ya se puede usar.`;
      campo.readOnly = true;
      secretosCache = []; conectarCache = null; refrescar();
    }catch(e){ nota.textContent = 'No se guardó: ' + e.message; }
  }
  const bCopiar = caja.querySelector('#s-copiar');
  if(bCopiar) bCopiar.onclick = async ()=>{
    const texto = campo.value;
    if(!texto) return nota.textContent = 'No hay nada que copiar todavía.';
    campo.select(); campo.setSelectionRange(0, texto.length);
    try{
      await navigator.clipboard.writeText(texto);
      nota.textContent = '✓ Copiado al portapapeles.';
    }catch(e){
      // Reserva para cuando el portapapeles está bloqueado.
      const ok = document.execCommand && document.execCommand('copy');
      nota.textContent = ok ? '✓ Copiado al portapapeles.'
        : 'El navegador no dejó copiar. El texto ya está seleccionado: usa «Copiar» del menú largo.';
    }
  };
  if(esArchivo && !valor) caja.querySelector('#s-guardar').onclick = guardarArchivo;
  if(editable) caja.querySelector('#s-guardar').onclick = async ()=>{
    try{ await post('/api/secretos/'+encodeURIComponent(nombre), {valor: campo.value.trim()});
      nota.textContent = '✓ Guardada en secretos.env — ya sobrevive a cerrar Termux.';
      secretosCache = []; refrescar();
    }catch(e){ nota.textContent = 'No se pudo guardar: ' + e.message; }
  };
  const cerrar = ()=>caja.remove();
  caja.querySelector('#s-cerrar').onclick = cerrar;
  caja.onclick = e => { if(e.target === caja) cerrar(); };
}

/* =========================================================
   CICLO DE PINTADO

   Cada vista declara una firma de lo que muestra. Si la firma no cambió, no
   se repinta: reescribir el HTML en cada refresco reiniciaba el <video>, te
   devolvía al inicio de las listas y hacía perder lo que estabas escribiendo.
   ========================================================= */
const VISTAS = {
  revisar:    [firmaRevisar,    pintaRevisar],
  cola:       [firmaCola,       pintaCola],
  estilo:     [firmaEstilo,     pintaEstilo],
  publicados: [firmaPublicados, pintaPublicados],
  canal:      [firmaCanal,      pintaCanal],
  tiktok:     [firmaTiktok,     pintaTiktok],
  ajustes:    [firmaAjustes,    pintaAjustes],
};
let firmas = {};

function vistaActual(){ return document.querySelector('.tabs button.on').dataset.v; }

function pintar(){
  if(!E) return;
  // Antes que nada y antes de las firmas: lo que sigue usa seleccion y
  // musicaElegida, y tienen que estar ya limpias de números que cambiaron
  // de dueño.
  olvidarLoQueSeRenumero();
  // Un contador en 0 no dice nada y ocupa sitio en la tira: se esconde.
  const contador = (id, n) => { const c = $(id); c.textContent = n; c.style.display = n ? '' : 'none'; };
  contador('#c-rev', E.videos.filter(x=>!x.publicado).length);
  contador('#c-col', E.historias.filter(h=>!h.renderizada).length);
  contador('#c-pub', E.publicados.length);
  // En Canal el número que importa es lo que la revisión se llevaría.
  contador('#c-can', E.canal ? (E.canal.repetidas + E.canal.rehacibles
                               + (E.canal.problemas || []).length) : 0);
  contador('#c-tk', (E.tiktok && E.tiktok.pendientes) ? E.tiktok.pendientes.length : 0);
  pintaJob();
  pintaColaTrabajos();
  vigilarFallos();
  pintaPaso();
  pintaDesactivado();
  pintaTally();

  const v = vistaActual();
  const [firma, pinta] = VISTAS[v];
  const f = firma();
  if(firmas[v] !== f){ firmas[v] = f; pinta(); }
  if(v === 'revisar') pintaTira();
}

/* El siguiente paso, para quien no se sabe el orden del pipeline. Lo decide
   el servidor (siguiente_paso en servidor.py); aquí solo se pinta. Va en su
   propio hueco, fuera de las pestañas, con su propia firma: dentro de
   Revisar se quedaría congelado, porque esa vista no se repinta mientras no
   cambien los videos. Sale en Revisar y en Cola, que es donde se empieza. */
let firmaPaso = null;
/* Este aparato desactivado (dispositivo.py): un aviso fijo arriba, en todas
   las pestañas, porque mientras dure los botones no arrancan nada y sin él
   parecería que el panel se rompió. */
let firmaDesactivado = null;
function pintaDesactivado(){
  const d = E && E.desactivado;
  const f = d ? JSON.stringify(d) : '';
  if(f === firmaDesactivado) return;
  firmaDesactivado = f;
  const slot = $('#desactivado-slot');
  if(!d){ slot.innerHTML = ''; return; }
  const desde = d.desde ? new Date(d.desde).toLocaleString('es', {dateStyle:'medium', timeStyle:'short'}) : '';
  slot.innerHTML = `
    <div class="aviso crit"><span>⏸</span><div style="flex:1">
      <b>Este ${equipo()} está desactivado${desde ? ' desde el ' + esc(desde) : ''}.</b>
      No corre nada: ni con botones, ni solo${E.es_android ? ', ni el horario automático' : ''}. Es para que el teléfono y
      el PC no publiquen a la vez. Exportar y restaurar respaldos sí funciona.
      <div style="margin-top:8px"><button class="btn go sm" id="b-reactivar">▶ Reactivar este ${equipo()}</button></div>
    </div></div>`;
  $('#b-reactivar').onclick = async ()=>{
    if(!confirm(`¿Reactivar este ${equipo()}?\n\nAsegúrate de haber desactivado el otro antes: `
      + 'si los dos publican, el mismo video puede subirse dos veces.')) return;
    try{
      const j = await post('/api/dispositivo/reactivar', {});
      toast(j.mensaje || 'Reactivado'); horarioCache = null; refrescar();
    }catch(e){ toast(e.message); }
  };
}

/* La lámpara de tally de la cabecera y su palabra. Mira el trabajo en curso,
   se vea o no su tarjeta: estés en la pestaña que estés, se sabe si algo
   está al aire. */
function pintaTally(){
  const j = E && E.trabajo, est = j ? j.estado : null;
  const modo = est === 'corriendo' ? 'aire' : est === 'pausado' ? 'pausa'
    : est === 'error' ? 'fallo' : (E && E.desactivado) ? 'fuera' : 'espera';
  if(document.documentElement.dataset.aire === modo) return;
  document.documentElement.dataset.aire = modo;
  $('#tally-txt').textContent = {aire:'Al aire', pausa:'En pausa', fallo:'Falló',
    fuera:'Desactivado', espera:'En espera'}[modo];
  $('#tally-lamp').title = modo === 'aire' ? 'Hay algo grabándose ahora mismo' : '';
}
// El reloj de estudio: la hora de este aparato, al segundo. Solo con la
// pestaña a la vista; escondida no hay nadie mirándolo.

  if(r && !document.hidden) r.textContent = new Date().toLocaleTimeString('es', {hour12:false});
}
tictac(); setInterval(tictac, 1000);

function pintaPaso(){
  const s = E && E.siguiente, v = vistaActual();
  // Si el paso solo lleva a la pestaña en la que ya estás («Revisa 40
  // videos» estando en Revisar), el botón no haría nada: no se enseña.
  // Desactivado no hay siguiente paso que dar: lo dice su propio aviso.
  const visible = s && !E.desactivado && (v === 'revisar' || v === 'cola')
    && !(s.ir && !s.accion && s.ir === v);
  const f = visible ? JSON.stringify(s) + v : '';
  if(f === firmaPaso) return;
  firmaPaso = f;
  const slot = $('#paso-slot');
  if(!visible){ slot.innerHTML = ''; return; }
  slot.innerHTML = `
    <div class="card siguiente">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b style="flex:1 1 180px;font-size:16px;min-width:0"><span class="pill acc" style="vertical-align:2px">Siguiente</span> ${esc(s.titulo)}</b>
        <button class="btn go" id="b-paso" style="white-space:nowrap">${esc(s.boton)} →</button>
      </div>
      <div style="margin-top:6px;font-size:13.5px;color:var(--ink-dim)">${esc(s.detalle)}</div>
    </div>`;
  $('#b-paso').onclick = ()=>{
    if(s.accion === 'renderizar') return ejecutar('renderizar', {historias: s.historias});
    if(s.accion) return ejecutar(s.accion);
    if(s.ir) irA(s.ir);
  };
}
// Cambiar de pestaña desde un botón, llevando también la tira de pestañas:
// en un teléfono Ajustes queda fuera de la vista, a la derecha.
/* «ajustes/servicios» abre Ajustes ya en esa pestaña: lo usa el
   diccionario de errores para llevar justo a donde se arregla. */
function irA(vista){
  const [v, grupo] = String(vista).split('/');
  if(grupo) abrirGrupoAjustes(grupo);
  vista = v;
  const b = document.querySelector(`.tabs button[data-v="${vista}"]`);
  if(!b) return;
  b.click();
  window.scrollTo({top:0, behavior:'smooth'});
}

let firmaCredenciales = null;
async function refrescar(){
  try{
    E = await api('/api/estado');
    // Si las credenciales cambiaron por fuera (restaurar un respaldo, otra
    // pestaña), lo que se guardó de Servicios ya no vale: se vuelve a pedir.
    const fc = JSON.stringify(E.credenciales);
    if(firmaCredenciales !== null && fc !== firmaCredenciales){ secretosCache = []; conectarCache = null; }
    firmaCredenciales = fc;
    // Los secretos van aparte: el valor no viaja aquí, solo si están puestos.
    if(vistaActual() === 'ajustes' && !secretosCache.length){
      try{ secretosCache = await api('/api/secretos'); }catch(e){}
    }
    if(vistaActual() === 'ajustes' && !conectarCache){
      try{ conectarCache = await api('/api/conectar'); }catch(e){}
    }
    if(vistaActual() === 'ajustes' && !horarioCache){
      try{ horarioCache = await api('/api/horario');
           horarioBorrador = JSON.parse(JSON.stringify(horarioCache.tareas)); }catch(e){}
    }
    pintar();
  }
  catch(e){ $('#job-slot').innerHTML =
    `<div class="aviso crit"><span>✕</span><div>Se perdió la conexión con el servidor. ¿Sigue corriendo <code style="font:12px var(--mono)">python servidor.py</code>?</div></div>`; }
}

// Tocar la barra de abajo sube a la tarjeta, que es donde están el detalle y
// los botones de pausar y abortar.
// Si la tarjeta es de otra pestaña, la barra lleva a esa pestaña.
$('#mini-job').onclick = ()=>{
  const v = E && E.trabajo && E.trabajo.vista;
  if(v && v !== vistaActual()) irA(v);
  else window.scrollTo({top:0, behavior:'smooth'});
};

/* La tira de pestañas rueda de lado, así que hay que avisar de que queda
   alguna fuera del borde derecho. */
const tiraTabs = document.querySelector('.tabs');
function sombraTabs(){
  tiraTabs.classList.toggle('mas',
    tiraTabs.scrollLeft + tiraTabs.clientWidth < tiraTabs.scrollWidth - 1);
}
tiraTabs.addEventListener('scroll', sombraTabs, {passive:true});
addEventListener('resize', sombraTabs);
sombraTabs();

document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabs button').forEach(o=>o.classList.toggle('on', o===b));
    document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on', s.id==='v-'+b.dataset.v));
    window.scrollTo(0,0);
    // Si la pestaña estaba medio asomada por un lado, se centra: da igual que
    // ya se haya pintado, lo que importa es poder leer en cuál estás.
    b.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    refrescar();
  };
});
refrescar();
// Mientras algo corre conviene ver el avance; si no, no hace falta insistir.
// Con la pestaña oculta (pantalla apagada durante un render, otra app) no se
// pide nada: nadie lo está mirando, y al volver se pone al día en el acto.
setInterval(()=>{ const j=E&&E.trabajo;
  if(!document.hidden && j && (j.estado==='corriendo'||j.estado==='pausado')) refrescar(); }, 1500);
setInterval(()=>{ if(!document.hidden) refrescar(); }, 12000);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  // Al volver de Termux (de instalar cron, por ejemplo) el aviso del horario
  // tiene que ponerse al día. Solo si no hay cambios a medias, que se perderían.
  if(horarioCache && JSON.stringify(horarioBorrador) === JSON.stringify(horarioCache.tareas)) horarioCache = null;
  refrescar();
});

/* Latido: mientras la pestaña esté abierta, el servidor sabe que sigues
   aquí. Si deja de llegar (cerraste el panel), se apaga solo y suelta el
   wake lock. El margen del servidor es amplio porque Chrome ralentiza los
   temporizadores en segundo plano — cambiar de app un rato no lo apaga. */
setInterval(()=>{ fetch('/api/latido',{method:'POST'}).catch(()=>{}); }, 20000);

/* Service worker: es lo que convierte el panel en una app instalable de
   verdad (Chrome no ofrece instalar una página sin uno) y lo que hace que
   abrir el icono con el servidor apagado enseñe una pantalla propia en vez
   del dinosaurio. No cachea el panel — ver web/sw.js. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
fetch('/api/latido',{method:'POST'}).catch(()=>{});

// Actualizar a mano. El panel ya se refresca solo, pero tenerlo a mano
// quita la duda de si lo que ves es de hace un momento o de ahora.
$('#b-actualizar').onclick = async (e)=>{
  const b = e.currentTarget;
  const icono = b.innerHTML;
  b.textContent = '·'; b.disabled = true;
  await refrescar();
  b.innerHTML = icono; b.disabled = false;
  toast('Actualizado');
};

/* Atajos de teclado, para el PC (en el teléfono no hay teclado que pulsar,
   así que no estorban). Nunca mientras escribes en un campo, con Ctrl/Alt
   pulsado —son del navegador— ni con una ventana abierta encima.
   Se miró mousetrap y hotkeys-js: para cinco teclas fijas son una
   dependencia más que cargar, y esto cabe en veinte líneas. */
addEventListener('keydown', ev=>{
  if(ev.ctrlKey || ev.metaKey || ev.altKey || ev.repeat) return;
  const t = ev.target;
  if(t && t.closest && t.closest('input, textarea, select, [contenteditable], .modal')) return;
  if(document.querySelector('.modal, #dicc.on, #hoja-fondos.on')) return;
  const pestanas = [...document.querySelectorAll('.tabs button')];
  const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
  const enRevisar = vistaActual() === 'revisar' && E && E.videos.length;
  const video = document.querySelector('#v-revisar video');
  if(/^[1-9]$/.test(k) && pestanas[+k - 1]){
    pestanas[+k - 1].click();
  }else if(k === 'r'){
    $('#b-actualizar').click();
  }else if(enRevisar && (k === 'ArrowLeft' || k === 'ArrowRight')){
    // Dentro del video las flechas ya adelantan y atrasan: se respeta.
    if(t && t.tagName === 'VIDEO') return;
    const n = E.videos.length;
    elegido = (elegido + (k === 'ArrowRight' ? 1 : n - 1)) % n;
    pintar();
  }else if(enRevisar && k === ' ' && video && !(t && t.closest && t.closest('button, a, video'))){
    video.paused ? video.play().catch(()=>{}) : video.pause();
  }else if(enRevisar && k === 'f' && video){
    document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen().catch(()=>{});
  }else return;
  ev.preventDefault();
});

/* El símbolo de apagar (⏻, U+23FB) no está en la fuente de muchos
   Android y salía como un cuadrito: va dibujado. */
const ICONO_APAGAR = (px) => `<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="display:inline-block;vertical-align:-0.15em">
  <path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>`;

/* Dos botones separados a propósito: ⏻ solo apaga el panel, como siempre;
   ☢️ desactiva este aparato (dispositivo.py) para pasarse al otro sin que
   los dos publiquen a la vez. Juntos en un mismo diálogo era fácil tocar
   uno queriendo el otro. Desactivar dura hasta pulsar «Reactivar», también
   tras cerrar y volver a abrir el panel. */
function loQueSePierde(){
  const j = E && E.trabajo, enEspera = ((E && E.cola) || []).length;
  const corriendo = j && (j.estado==='corriendo'||j.estado==='pausado');
  return corriendo ? `Se interrumpe «${j.nombre}»${enEspera ? ` y se pierden ${enEspera} en espera` : ''}.`
    : enEspera ? `Se pierden los ${enEspera} que están en espera.` : '';
}

$('#b-apagar').onclick = async ()=>{
  const pierde = loQueSePierde();
  if(!confirm('¿Apagar el panel?' + (pierde ? '\n\n' + pierde : '')
    + (E && E.es_android ? '\n\nEl horario automático sigue corriendo aunque el panel esté apagado.' : ''))) return;
  try{ await fetch('/api/apagar',{method:'POST'}); }catch(e){}
  pantallaApagado(false);
};

$('#b-desactivar').onclick = ()=>{
  if(E && E.desactivado){
    const b = $('#b-reactivar');
    if(b) return b.click();
  }
  const pierde = loQueSePierde();
  const caja = document.createElement('div');
  caja.className = 'modal';
  caja.innerHTML = `
    <div class="caja">
      <b style="font-size:16px">☢️ Desactivar este ${equipo()}</b>
      <div class="muted" style="margin:8px 0 0">Para pasarte al otro aparato. Para lo que esté
        corriendo${E.es_android ? ', quita el horario automático' : ''} y no deja arrancar nada —ni
        solo ni con botones— hasta que pulses «Reactivar». Así el teléfono y el PC no publican a la vez.</div>
      ${pierde ? `<div class="aviso warn" style="margin:10px 0 0"><span>⚠</span><div>${esc(pierde)}</div></div>` : ''}
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:14px">
        <button class="btn go" data-ap="desactivar-apagar">Desactivar y apagar</button>
        <button class="btn" data-ap="desactivar">Solo desactivar</button>
        <button class="btn" data-ap="no" style="margin-left:auto">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(caja);
  caja.onclick = async ev => {
    const b = ev.target.closest('[data-ap]');
    if(ev.target === caja || (b && b.dataset.ap === 'no')) return caja.remove();
    if(!b) return;
    const que = b.dataset.ap;
    caja.remove();
    try{
      const r = await post('/api/dispositivo/desactivar', {apagar: que === 'desactivar-apagar'});
      if(que === 'desactivar-apagar') return pantallaApagado(true, r.mensaje);
      toast(r.mensaje || `Este ${equipo()} quedó desactivado`); horarioCache = null; refrescar();
    }catch(e){ toast(e.message); }
  };
};

function pantallaApagado(desactivado, extra){
  const volver = E && E.es_windows ? 'abre otra vez <b>iniciar_windows.bat</b>'
    : E && E.es_android ? '<b>panel</b> en Termux (o abre la app)' : 'vuelve a arrancar el panel';
  document.body.innerHTML = `<div style="max-width:440px;margin:22vh auto;padding:0 20px;
    text-align:center;font:15px/1.6 var(--body);color:var(--ink-dim)">
    <div style="font-size:34px;margin-bottom:12px">${desactivado ? '⏸' : ICONO_APAGAR(34)}</div>
    <b style="color:var(--ink);font-size:16px">${desactivado ? `Este ${equipo()} quedó desactivado` : 'Panel apagado'}</b>
    <p>${desactivado ? 'No corre nada, tampoco solo. ' : ''}${E && E.es_windows
      ? 'Ya puedes cerrar esta pestaña; la ventana negra se cierra sola.'
      : 'Termux quedó libre y se soltó el wake lock. Ya puedes cerrar esta pestaña.'}</p>
    ${extra ? `<p>${esc(extra)}</p>` : ''}
    <p style="font-size:13px">Para volver: ${volver}.${desactivado
      ? ' Seguirá desactivado hasta que pulses «Reactivar» en el aviso de arriba.' : ''}</p></div>`;
}
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mesa de Revisión</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script>
/* Tema y color, antes de que se pinte nada: puesto más abajo, el panel
   parpadearía en oscuro cada vez que se abre en claro. Se guarda en este
   teléfono (localStorage), no en el servidor: es cosa de quien mira. */
// «señal» es el de fábrica: el azul de las teclas de un mezclador de video.
// Los tallies rojo (al aire), verde (previo) y ámbar (en espera) no se
// ofrecen como acento: con uno de ellos una tecla elegida se leería como un
// estado.
const ACENTOS = {
  senal:{o:'#4aa3ff', c:'#0a5cc2'},
  turquesa:{o:'#4db4a8', c:'#1d7d72'}, azul:{o:'#8f9bff', c:'#3b3fc4'},
  morado:{o:'#b596f2', c:'#6a3fc0'},   rosa:{o:'#f08ab4', c:'#b3326b'},
  blanco:{o:'#e6eaef', c:'#2a3038'},
};
function prefTema(){
  try { return JSON.parse(localStorage.getItem('apariencia')) || {}; } catch(e){ return {}; }
}
function aplicarTema(){
  const p = prefTema(), raiz = document.documentElement;
  const modo = p.modo === 'claro' || p.modo === 'oscuro' ? p.modo
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro');
  raiz.dataset.tema = modo;
  const a = ACENTOS[p.acento] || (/^#[0-9a-f]{6}$/i.test(p.acento || '') ? {o:p.acento, c:p.acento} : null);
  for(const v of ['--accent','--accent-soft','--accent-ink']) raiz.style.removeProperty(v);
  if(a && p.acento !== 'senal'){
    const col = modo === 'claro' ? a.c : a.o;
    raiz.style.setProperty('--accent', col);
    raiz.style.setProperty('--accent-soft', `color-mix(in srgb, ${col} ${modo==='claro'?14:20}%, ${modo==='claro'?'#fff':'#15181c'})`);
    // Texto sobre el color: negro o blanco según lo claro que sea el color,
    // para que un color elegido a mano no deje los botones ilegibles.
    const [r,g,b] = [1,3,5].map(i => parseInt(col.slice(i,i+2),16)/255)
      .map(x => x <= .03928 ? x/12.92 : ((x+.055)/1.055)**2.4);
    raiz.style.setProperty('--accent-ink', .2126*r + .7152*g + .0722*b > .25 ? '#0b0f14' : '#fff');
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  // La barra del teléfono, del color de la cabecera del tema elegido: con
  // uno solo, el claro llevaba barra negra o el oscuro una blanca.
  if(meta) meta.content = modo === 'claro' ? '#e4e7eb' : '#0b0d10';
}
function guardarTema(cambio){
  const p = Object.assign(prefTema(), cambio);
  try { localStorage.setItem('apariencia', JSON.stringify(p)); } catch(e){}
  aplicarTema();
}
aplicarTema();
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', aplicarTema); } catch(e){}
</script>
<style>
  /* Sala de control de TV. Oscuro: la sala a media luz, módulos de rack mate
     separados por filetes de 1 px, y el video en negro de monitor. Claro:
     el mismo estudio con las luces encendidas. Los tres tallies no son
     adorno: rojo = al aire (algo se está grabando), verde = previo (listo,
     esperando tu visto bueno), ámbar = en espera. --accent es la tecla que
     elige el usuario en Ajustes → Apariencia, y solo marca acciones y
     selección, nunca un estado. */
  @font-face{font-family:"Rotulo";src:url(/letra/BebasNeue-Regular.ttf) format("truetype");
    font-display:swap}
  :root {
    --ground:#0b0d10; --surface:#15181c; --surface-2:#1c2025;
    --line:#2b3037; --line-soft:#21252b;
    --ink:#eef0f3; --ink-dim:#a6aeb8; --ink-faint:#7a838e;
    --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#132437;
    --aire:#ff3b30; --previo:#34d26d; --previo-ink:#03140a; --espera:#ffb224;
    --warn:#ffb224; --warn-soft:#2e2310;
    --crit:#ff5a4f; --crit-soft:#321614;
    --ok:#34d26d; --ok-soft:#10271a;
    /* El monitor: negro también con el estudio iluminado, como en la vida. */
    --monitor:#060708; --monitor-ink:#e9ecef; --monitor-dim:#8d96a1; --monitor-line:#23272d;
    --relieve:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.4);
    --sombra:0 1px 0 rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.3);
    --ease-out:cubic-bezier(.23,1,.32,1);
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --rotulo:"Rotulo","Arial Narrow","Roboto Condensed",sans-serif;
  }
  /* Claro u oscuro lo decide data-tema, que pone el script de arriba del
     todo: en «Automático» sigue al teléfono, pero también se puede fijar a
     mano en Ajustes → Apariencia. Sin JS se queda en oscuro. */
  :root{color-scheme:dark}
  :root[data-tema="claro"]{ color-scheme:light;
      --ground:#e4e7eb; --surface:#fbfcfd; --surface-2:#eef0f3;
      --line:#c9cfd6; --line-soft:#dde1e6; --ink:#0f1216; --ink-dim:#46505b;
      --ink-faint:#66707c; --accent:#0a5cc2; --accent-ink:#fff; --accent-soft:#dde9f8;
      --aire:#d7261b; --previo:#12803d; --previo-ink:#fff; --espera:#a86400;
      --warn:#a86400; --warn-soft:#f6ebd8; --crit:#c42b20; --crit-soft:#f8e0dd;
      --ok:#12803d; --ok-soft:#dcf0e2;
      --relieve:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.06);
      --sombra:0 1px 0 rgba(20,25,32,.1), 0 2px 4px rgba(20,25,32,.08); }
  /* Los enlaces sin estilo salían en el azul del navegador, que sobre el
     fondo oscuro casi no se lee. */
  a{color:var(--accent);text-underline-offset:2px}
  .acciones-aviso{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .fallos{margin-top:10px;border:1px solid var(--crit);border-radius:8px;background:var(--crit-soft);
    padding:9px 11px}
  .fallos-tit{font-weight:600;color:var(--crit);margin-bottom:4px}
  .fallo{padding:7px 0;border-top:1px solid color-mix(in srgb,var(--crit) 25%,transparent)}
  .fallo:first-of-type{border-top:0}
  .fallo-cab{display:flex;gap:8px;align-items:baseline;min-width:0}
  .fallo-cab b{overflow-wrap:anywhere}
  .fallo-txt{font:11.5px/1.45 var(--mono);color:var(--ink);overflow-wrap:anywhere;margin-top:2px}
  .alerta-fallo{position:fixed;left:10px;right:10px;top:10px;z-index:60;display:flex;gap:10px;
    align-items:flex-start;background:var(--surface);border:1px solid var(--crit);
    border-left:5px solid var(--crit);border-radius:10px;padding:10px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:600px;margin:0 auto}
  .alerta-fallo .ico{color:var(--crit);font-size:18px;line-height:1.2}
  .alerta-fallo b{color:var(--crit)}
  .alerta-fallo .en{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
  .alerta-fallo .que{font:11.5px/1.4 var(--mono);color:var(--ink-dim);margin-top:3px;
    overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .alerta-fallo .acc{display:flex;gap:6px;align-items:center;flex-shrink:0}
  /* Pestañas de Ajustes: ruedan de lado en un renglón, como las de arriba. */
  .tabs-aj{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px -14px 6px;
    padding:2px 14px 6px}
  .tabs-aj::-webkit-scrollbar{display:none}
  .tabs-aj .btn{flex-shrink:0;white-space:nowrap}
  .tabs-aj .btn[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .temas{display:flex;gap:6px;flex-wrap:wrap}
  .temas .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .colores{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .colores button,.colores label{width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:2px solid var(--line);padding:0;position:relative}
  .colores [aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
  .colores label{display:flex;align-items:center;justify-content:center;font-size:15px;
    background:conic-gradient(#e66,#ec5,#6c8,#5ae,#a7e,#e66)}
  .colores input{position:absolute;inset:0;opacity:0;cursor:pointer}
  *{box-sizing:border-box}
  /* Sin esto, un .sangria (display:flex) marcado con hidden se sigue viendo:
     la regla del navegador para [hidden] la pisa cualquier display del autor. */
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);
       -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:1000px;margin:0 auto;padding:0 14px 70px}

  /* Cabecera en dos alturas: la marca arriba, las pestañas debajo. Antes iba
     todo en una sola fila que se plegaba sola, y en un movil de 412px las
     siete pestañas caian en tres renglones apretados contra el titulo. */
  .nav{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--line);margin-bottom:20px}
  .nav-in{max-width:1000px;margin:0 auto;padding:12px 14px 0}
  .marca{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  /* El glifo es el unico adorno de la cabecera: un boton de reproducir, que es
     de lo que va todo esto. Va dibujado con texto y color, no con una imagen
     que haya que cargar aparte. */
  .marca .glifo{flex-shrink:0;width:30px;height:30px;border-radius:9px;
    background:var(--accent-soft);color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    display:flex;align-items:center;justify-content:center}
  .marca .txt{min-width:0}
  .kicker{display:block;font:500 9px var(--mono);text-transform:uppercase;
    letter-spacing:.2em;color:var(--ink-faint);margin-bottom:1px}
  .titulo{margin:0;font:600 20px/1.05 var(--body);letter-spacing:-.02em;color:var(--ink)}
  .titulo .b{color:var(--accent)}
  .nav-acc{margin-left:auto;display:flex;gap:6px;flex-shrink:0}

  /* Las pestañas ya no se pliegan: ruedan de lado en un solo renglon. Los
     margenes negativos las llevan hasta el borde de la pantalla, que es lo que
     deja ver que hay mas a la derecha. */
  .tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;
    margin:0 -14px;padding:0 14px;scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  /* Difuminado en el borde derecho, pero solo mientras quede pestaña por ver:
     lo enciende el JS segun donde este el scroll. Una mascara fija fingiria
     que siempre hay mas, tambien al llegar al final. */
  .tabs.mas{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
  .tabs button{flex-shrink:0;scroll-snap-align:center;
    font:500 13px var(--body);color:var(--ink-dim);background:none;
    border:0;border-bottom:2px solid transparent;
    padding:8px 11px;border-radius:7px 7px 0 0;cursor:pointer;
    display:flex;align-items:center;gap:6px}
  .tabs button.on{color:var(--accent);background:var(--accent-soft);border-bottom-color:var(--accent)}
  .tabs .c{font:11px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
  .tabs button.on .c{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  /* En el teléfono las siete no caben en una fila, y rodando de lado Ajustes
     quedaba fuera de la vista: quien no sabe que hay más no las busca. En
     dos filas se ven todas de un vistazo. */
  @media (max-width:520px){
    .tabs{flex-wrap:wrap;overflow:visible;row-gap:2px;scroll-snap-type:none}
    .tabs.mas{-webkit-mask-image:none;mask-image:none}
    .tabs button{padding:7px 9px}
  }

  .view{display:none} .view.on{display:block}
  h2{font-size:16px;font-weight:600;margin:0 0 3px;letter-spacing:-.01em}
  p.sub{font-size:13px;color:var(--ink-dim);margin:0 0 16px;max-width:64ch}
  h3.sec{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;
    color:var(--ink-faint);margin:24px 0 10px}

  .btn{font:500 13px var(--body);padding:8px 13px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);color:var(--ink-dim);background:var(--surface);
    display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  @media (hover:hover) and (pointer:fine){ .btn:hover{color:var(--ink);border-color:var(--ink-faint)} }
  .btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.sm{font-size:12px;padding:6px 10px}
  .btn.danger{color:var(--crit)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  select.btn{color:var(--ink)}

  .pill{font:10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;
    padding:3px 7px;border-radius:4px;white-space:nowrap}
  .pill.ok{color:var(--ok);background:var(--ok-soft)}
  .pill.warn{color:var(--warn);background:var(--warn-soft)}
  .pill.crit{color:var(--crit);background:var(--crit-soft)}
  .pill.idle{color:var(--ink-faint);background:var(--surface-2)}
  .pill.acc{color:var(--accent);background:var(--accent-soft)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
  details.mas{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
  details.mas > summary{cursor:pointer;font:600 15px var(--body);padding:10px 0;color:var(--ink)}
  .card.siguiente{border-color:var(--accent);border-left-width:4px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .muted{font-size:12.5px;color:var(--ink-dim);line-height:1.45}
  code.cmd{display:block;font:11.5px var(--mono);background:var(--surface-2);
    border:1px solid var(--line-soft);border-radius:6px;padding:7px 9px;color:var(--ink);
    overflow-x:auto;white-space:pre}

  /* trabajo en curso — deliberadamente quieto: una línea de paso actual que
     se reemplaza en su sitio, no un registro que va cayendo. */
  .job{background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;
    padding:12px 14px;margin-bottom:16px}
  .job.err{background:var(--crit-soft);border-color:var(--crit)}
  .job.fin{background:var(--ok-soft);border-color:var(--ok)}
  .job-fin{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-2px 0 10px;
    padding:10px 12px;border-radius:8px;background:var(--ok);color:var(--ground);font-weight:600}
  .job-fin.err{background:var(--crit)}
  .job-fin span{flex-grow:1;font-size:15px}
  /* Sin plegar: con un nombre largo («Escribiendo todos los guiones») el
     renglón se partía y el ⏹ caía solo a la línea de abajo. Ahora es el
     nombre el que se parte en dos líneas y los botones se quedan en su sitio. */
  .job-top{display:flex;align-items:center;gap:8px}
  .job-tit{flex:1 1 0;min-width:0}
  .job-tit b{display:block;overflow-wrap:anywhere;line-height:1.25}
  .job-meta{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .job-top > .tbtn{flex-shrink:0}
  .paso{margin-top:9px;font:12px/1.45 var(--mono);color:var(--ink);
    min-height:2.9em;display:flex;align-items:center;
    overflow:hidden;text-overflow:ellipsis}
  .barra{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
  .barra i{display:block;height:100%;background:var(--accent);width:0;
    transition:width .4s linear}
  .log{margin-top:9px;background:#0c0f13;border-radius:7px;padding:9px 10px;
    font:11.5px/1.5 var(--mono);color:#c8d2dc;height:170px;overflow:auto;white-space:pre-wrap}
  :root[data-tema="claro"] .log{background:#171b20}
  .tbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:14px;cursor:pointer}

  /* El mismo avance, en una linea y pegado abajo. La tarjeta entera vive
     arriba del todo, y en una pestaña larga eso obliga a subir solo para ver
     como va. Esto queda debajo de lo que estes mirando, sea el apartado que
     sea, y se quita solo cuando la tarjeta de arriba ya esta a la vista: dos
     veces lo mismo en pantalla es ruido, no informacion. */
  .mini{position:fixed;left:0;right:0;bottom:0;z-index:40;width:100%;
    background:var(--surface);border:0;border-top:1px solid var(--line);
    padding:8px 14px calc(8px + env(safe-area-inset-bottom));
    font:inherit;color:inherit;text-align:left;cursor:pointer}
  .mini:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mini-top{display:flex;align-items:center;gap:9px}
  /* min-width:0 por lo de siempre: sin esto el paso largo estira la fila y se
     sale por el lado derecho en vez de cortarse con puntos suspensivos. */
  .mini-top .q{flex:1;min-width:0;font:11.5px var(--mono);color:var(--ink-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-top .t{flex-shrink:0;font:11.5px var(--mono);color:var(--ink-dim);
    font-variant-numeric:tabular-nums}
  .mini .barra{margin-top:7px}
  /* La tarjeta de arriba avisa del fallo poniéndose roja entera; aquí abajo no
     hay caja que teñir, así que lo dice la barra. Sin esto quedaba una barra
     verde al 100% justo al lado de la etiqueta ERROR. */
  .mini.err .barra i{background:var(--crit)}
  .mini.fin .barra i{background:var(--ok)}

  /* revisar */
  .review{display:grid;grid-template-columns:300px 1fr;gap:20px}
  video{width:100%;border-radius:9px;background:#000;display:block;aspect-ratio:9/16;object-fit:contain}
  video.wide{aspect-ratio:16/9}
  .facts{display:flex;flex-wrap:wrap;gap:5px 13px;font:11.5px var(--mono);color:var(--ink-dim)}
  .facts b{color:var(--ink);font-weight:500}
  .script{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;
    padding:11px 13px;font-size:13.5px;color:var(--ink-dim);line-height:1.55;max-height:150px;overflow:auto}
  .thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
  .th{position:relative;flex-shrink:0;width:64px;border:1px solid var(--line);
    border-radius:7px;overflow:hidden;cursor:pointer;background:var(--surface)}
  /* El elegido lleva anillo, no solo borde de color: el verde de "subido" y
     el turquesa del acento se parecen demasiado en pantalla pequeña. */
  .th.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .th .im{position:relative;aspect-ratio:9/16;
    /* El degradado se queda debajo: si ffmpeg no pudo sacar el fotograma,
       el recuadro sigue teniendo fondo en vez de quedarse transparente. */
    background:linear-gradient(170deg,#2b3340,#171c23) center/cover no-repeat;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;
    font:9px var(--mono);color:#fff}
  .th .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* La duración va sobre la imagen, con un velo detrás: encima de un
     fotograma claro el texto blanco solo se perdía. */
  .th .im span{position:relative;z-index:1;padding:1px 4px;border-radius:4px;
    background:rgba(0,0,0,.55)}
  .th .cp{font-size:9.5px;color:var(--ink-faint);padding:4px 3px;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .th.on .cp{color:var(--accent)}

  /* Ya subido: el color solo no basta —hay quien no lo distingue y el sol del
     móvil se come los matices—, así que va con marca ✓ y con la miniatura
     apagada. Lo que queda vivo es lo que aún te toca mirar. */
  .th.sub{border-color:var(--ok)}
  /* Con fotograma dentro, el fondo verde no se vería. Lo subido se marca
     apagando la imagen —queda claro que ya está hecho— más el ✓ y el borde. */
  .th.sub .im img{opacity:.32}
  .th.sub.on .im img{opacity:.6}
  .th.sub .cp{color:var(--ok)}
  /* La marca va colgada de .th, no de la miniatura: si colgara de dentro se
     apagaría con ella y en tema claro el ✓ quedaba casi invisible. Como chip
     sólido se lee igual sobre cualquier fondo y en cualquier tema. */
  .th .ck{position:absolute;top:4px;right:4px;display:none;width:15px;height:15px;
    border-radius:50%;background:var(--ok);color:var(--ground);
    align-items:center;justify-content:center;font-size:9.5px;font-weight:700;
    line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .th.sub .ck{display:flex}
  /* El elegido gana al estado: si lo estás mirando, tiene que verse cuál es. */
  .th.sub.on{border-color:var(--accent)}

  .leyenda{display:flex;gap:13px;align-items:center;flex-wrap:wrap;
    margin:-2px 0 8px;font-size:11.5px;color:var(--ink-faint)}
  .leyenda b{color:var(--ink-dim);font-weight:600}
  .leyenda .pt{display:inline-flex;align-items:center;gap:5px}
  .leyenda .mu{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface-2)}
  .leyenda .mu.sub{border-color:var(--ok);background:var(--ok);color:var(--ground);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:8.5px;font-weight:700;line-height:1}

  /* listas */
  .list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .row{display:grid;gap:10px;align-items:center;padding:10px 13px;
    border-bottom:1px solid var(--line-soft);background:var(--surface);font-size:13px}
  .row:last-child{border-bottom:0}
  .row.sel{grid-template-columns:20px 26px 1fr 56px 14px 46px;cursor:pointer}
  .row.sel.on{background:var(--accent-soft)}
  .row.sel input{accent-color:var(--accent);width:15px;height:15px;margin:0}
  /* Una celda de cuadricula no baja de lo que mide su contenido salvo que se
     le diga. Sin esto un titulo largo estira la fila entera y se sale por el
     lado derecho de la pantalla, en vez de cortarse con puntos suspensivos. */
  .row>*{min-width:0}
  .row .n,.row .m{font:11.5px var(--mono);color:var(--ink-faint)}
  .row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Titulo de dos lineas: en un telefono el titulo es lo unico que distingue
     una fila de otra, y cortarlo en la segunda palabra deja dos historias
     distintas con el mismo aspecto. */
  .row .t.dos{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  /* Dos lineas de datos debajo del titulo, y la diferencia importa: .meta es
     una caja flexible para alinear etiquetas, y ahi cada trozo de texto suelto
     cuenta como un elemento aparte que puede saltar de renglon por su cuenta
     («1770» en un renglon y «vistas» en el siguiente). Cuando lo de debajo es
     una frase y no etiquetas, va en .info, que es texto normal. */
  .row .meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:3px}
  .row .info{margin-top:3px}
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;padding:11px 13px;background:var(--surface-2);border-bottom:1px solid var(--line-soft)}
  .list-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;padding:11px 13px;background:var(--surface-2);border-top:1px solid var(--line-soft)}
  .equiv{font:11.5px var(--mono);color:var(--ink-dim);background:var(--ground);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px}

  /* ajuste fino: las casillas de "al rehacer, cambiar…" */
  .finos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .fino{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:9px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
  .fino.on{border-color:var(--accent);background:var(--accent-soft)}
  .fino input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex-shrink:0}
  .fino.no{opacity:.45;cursor:not-allowed}
  .sangria{margin:8px 0 4px 24px;display:flex;flex-direction:column;gap:7px}

  /* botón deslizante, para el interruptor de "usar chip de video" */
  .switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch .rail{position:absolute;inset:0;background:var(--line);border-radius:24px;
    cursor:pointer;transition:background .15s}
  .switch .rail::before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;
    background:#fff;border-radius:50%;transition:transform .15s}
  .switch input:checked + .rail{background:var(--accent)}
  .switch input:checked + .rail::before{transform:translateX(18px)}

  /* presets */
  .presets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .preset{border:1px solid var(--line);border-radius:9px;background:var(--surface);
    padding:13px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .preset.on{border-color:var(--accent)}
  .preset h4{margin:0;font:500 13.5px var(--mono)}
  .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}

  /* editor de estilos: una fila por ajuste, que a 412px no cabe otra cosa */
  .campo{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
    padding:10px 13px;border-bottom:1px solid var(--line)}
  .campo:last-child{border-bottom:0}
  .campo>label{font-size:13px}
  .campo .m{font-size:11.5px}
  .campo input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);
    border-radius:6px;background:none}
  .campo input[type=text],.campo select{min-width:132px}
  .campo .slider{min-width:150px}
  .paleta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  .paleta .quita{cursor:pointer;color:var(--ink-faint);font-size:15px;line-height:1}

  .slider{display:flex;align-items:center;gap:11px}
  .slider input[type=range]{flex-grow:1;accent-color:var(--accent);min-width:90px}
  .slider .v{font:11.5px var(--mono);color:var(--ink);width:42px;text-align:right}

  .aviso{display:flex;gap:10px;align-items:flex-start;background:var(--surface);
    border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 9px 9px 0;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
  /* Sin esto, un texto que no se puede partir (un título largo con
     ellipsis) ensancha el aviso y con él toda la página. */
  .aviso > div{min-width:0}
  /* Diccionario de errores: hoja a pantalla completa, fuera de las vistas
     para que el repintado de cada 1,5 s no se la lleve por delante. */
  #dicc, #hoja-fondos{position:fixed;inset:0;z-index:60;background:var(--ground);overflow-y:auto;
    padding:16px;display:none}
  #dicc.on, #hoja-fondos.on{display:block}
  #hoja-fondos video{width:100%;max-height:52vh;background:#000;border-radius:10px;margin-top:10px}
  #dicc .e{background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;margin-top:8px}
  #dicc .e > b{display:block}
  .explica{margin-top:9px}
  .explica .aviso{margin:6px 0 0}
  .aviso.warn{border-left-color:var(--warn)}
  .aviso.crit{border-left-color:var(--crit)}

  /* Pestaña de TikTok: la tira de pasos. Es lo primero que se ve, y es tambien
     lo que ve el revisor de TikTok en el video de la auditoria, asi que el
     orden de la operacion tiene que leerse sin que nadie lo explique. */
  .pasos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .paso-t{flex:1 1 155px;background:var(--surface);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
  .paso-t .n{flex-shrink:0;width:19px;height:19px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);font:600 11px var(--mono);
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .paso-t .d{font-size:12.5px;line-height:1.4;min-width:0}
  .paso-t .d b{display:block;font-weight:600}
  .paso-t .d span{color:var(--ink-dim)}
  /* En un movil caben dos por fila y la tercera queda suelta a lo ancho, que se
     lee como si fuera otra cosa. O las tres en fila, o una debajo de otra. */
  @media (max-width:560px){ .paso-t{flex-basis:100%} }
  .row.tk .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;
    background:var(--surface);border:1px solid var(--accent);color:var(--ink);
    padding:10px 16px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 26px rgba(0,0,0,.35);
    opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.on{opacity:1}

  .modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .caja{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:18px;max-width:460px;width:100%}
  .modal textarea{width:100%;height:120px;background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:10px;
    font:11.5px/1.5 var(--mono);resize:vertical}
  .modal input[type=text]{width:100%;background:var(--surface-2);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:10px;font:12px var(--mono)}

  @media (max-width:780px){
    .review{grid-template-columns:1fr}
    video{max-width:330px;margin:0 auto}
    .grid2,.presets,.finos{grid-template-columns:1fr}
  }
  /* En un PC (pantalla ancha y ratón). Todo lo de arriba está pensado para
     412px y no se toca: esto solo reparte el sitio que sobra. Las pestañas
     pasan a una barra lateral fija —en una pantalla apaisada lo que escasea
     es el alto, no el ancho—, el contenido se ensancha y el video de Revisar
     crece. El corte en 1100px deja fuera tablets en vertical y ventanas a
     media pantalla, que siguen viendo el diseño de siempre. Si se cambia el
     ancho, hay que cambiarlo también en ESCRITORIO, en el JS. */
  .atajos{display:none}
  kbd{font:11px var(--mono);color:var(--ink-dim);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
  @media (min-width:1100px){
    body{padding-left:224px}
    .nav{position:fixed;top:0;left:0;bottom:0;width:224px;margin:0;
      border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
    .nav-in{max-width:none;padding:18px 12px 14px;min-height:100%;
      display:flex;flex-direction:column}
    .marca{flex-wrap:wrap;margin:0 4px 20px}
    .titulo{font-size:18px}
    .nav-acc{order:3;width:100%;margin:12px 0 0}
    .nav-acc .btn{flex:1;justify-content:center}
    .tabs{flex-direction:column;overflow:visible;margin:0;padding:0;gap:2px;scroll-snap-type:none}
    .tabs.mas{-webkit-mask-image:none;mask-image:none}
    .tabs button{font-size:14px;padding:9px 12px;justify-content:space-between;
      border-bottom:0;border-left:3px solid transparent;border-radius:0 8px 8px 0}
    .tabs button:hover{color:var(--ink);background:var(--surface-2)}
    .tabs button.on{border-left-color:var(--accent);background:var(--accent-soft)}
    .atajos{display:block;margin-top:auto;padding:16px 6px 0;
      font:11px/1.7 var(--mono);color:var(--ink-faint)}

    .wrap{max-width:1280px;padding:26px 36px 80px}
    p.sub{max-width:90ch}
    .review{grid-template-columns:minmax(340px,400px) 1fr;gap:30px;padding:20px}
    /* El video se queda quieto mientras bajas por la narración y los
       títulos, y nunca más alto que la ventana: un vertical de 400px de
       ancho mide 711 de alto y no cabía entero en un portátil. */
    .review > div:first-child{position:sticky;top:20px;align-self:start}
    .review video{max-height:calc(100vh - 60px);width:auto;max-width:100%;margin:0 auto}
    .script{max-height:300px}
    .thumbs{flex-wrap:wrap;overflow:visible}
    .th{width:72px}
    .th:hover{border-color:var(--ink-faint)}
    .row:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
    .row.sel.on:hover{background:var(--accent-soft)}

    .mini{left:224px;width:auto}
    .alerta-fallo{left:244px}
    .modal .caja{max-width:680px}
    .modal textarea{height:260px}
  }

  /* =========================================================
     SALA DE CONTROL — la piel entera del panel. Va al final a propósito:
     manda sobre las reglas de arriba, que siguen dando la estructura
     (rejillas, anchos, qué se ve en el teléfono y qué en el PC).
     ========================================================= */

  /* Lo que el navegador pinta solo también es parte del diseño, y lo que
     separa «una web en el teléfono» de algo instalado (mobile-native):
     sin destello gris al tocar, sin letra inflada en horizontal, sin que
     arrastrar hacia abajo recargue el panel a mitad de un render. */
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
    overscroll-behavior-y:none;scrollbar-color:var(--line) transparent}
  ::selection{background:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--ink)}
  input,textarea{caret-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  code,kbd,.mono,.row .n,.row .m,.facts,.equiv{font-variant-numeric:tabular-nums}
  /* Un campo de texto con letra de menos de 16 px hace que el teléfono
     acerque la página al tocarlo, y ya no vuelve solo. */
  @media (pointer:coarse){
    input:not([type]),input[type=text],input[type=search],input[type=number],textarea{font-size:16px}
  }
  /* Un control no es texto: mantener el dedo encima no debe seleccionarlo,
     y el toque dispara al momento, sin esperar un doble toque. */
  button,.btn,.tabs button,.th,.fino,.switch,label.btn,summary{touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  body{background:var(--ground);letter-spacing:.005em}
  a{color:var(--accent)}

  /* Rótulos: la letra estrecha de los rótulos de bajo monitor (UMD) y de
     las regletas de un control central. Solo títulos y etiquetas; el texto
     que se lee sigue en la letra del sistema. */
  h2{font:400 30px/1 var(--rotulo);letter-spacing:.015em;margin:0 0 6px;color:var(--ink)}
  h3.sec{font:400 17px/1 var(--rotulo);letter-spacing:.07em;color:var(--ink-dim);
    margin:30px 0 10px;display:flex;align-items:center;gap:8px}
  h3.sec::before{content:"";width:6px;height:6px;border-radius:1px;background:var(--line);flex-shrink:0}
  p.sub{color:var(--ink-dim)}
  details.mas{border-top-color:var(--line)}
  details.mas > summary{font:400 21px/1 var(--rotulo);letter-spacing:.03em;padding:14px 0}

  /* --- Cabecera: la marca con la lámpara de tally y el reloj de estudio --- */
  .nav{background:color-mix(in srgb,var(--ground) 92%,transparent);border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top)}
  .marca{gap:12px}
  .titulo{font:400 27px/.95 var(--rotulo);letter-spacing:.02em;color:var(--ink)}
  .titulo .b{color:inherit}
  /* La lámpara: apagada es un cristal oscuro; al aire se enciende en rojo
     con una rampa de brillo, como un tally de verdad, no un parpadeo. */
  .marca .glifo{width:34px;height:34px;border-radius:5px;background:var(--surface-2);
    color:var(--ink-faint);border:1px solid var(--line);box-shadow:var(--relieve);
    transition:background 450ms var(--ease-out),color 450ms var(--ease-out),
      box-shadow 450ms var(--ease-out),border-color 450ms var(--ease-out)}
  .marca .glifo svg{display:block}
  .estado-aire{display:flex;align-items:center;gap:10px;margin-top:4px;
    font:500 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .estado-aire .lamp-txt{display:inline-flex;align-items:center;gap:6px}
  .estado-aire .lamp-txt::before{content:"";width:7px;height:7px;border-radius:50%;
    background:currentColor;opacity:.55}
  .estado-aire .reloj{color:var(--ink-dim);font-variant-numeric:tabular-nums;letter-spacing:.04em}
  :root[data-aire="aire"] .marca .glifo{background:var(--aire);color:#fff;border-color:var(--aire);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--aire) 22%,transparent)}
  :root[data-aire="aire"] .estado-aire .lamp-txt{color:var(--aire)}
  :root[data-aire="aire"] .estado-aire .lamp-txt::before{opacity:1;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  :root[data-aire="pausa"] .marca .glifo{background:var(--espera);color:#1a1000;border-color:var(--espera)}
  :root[data-aire="pausa"] .estado-aire .lamp-txt{color:var(--espera)}
  :root[data-aire="fallo"] .marca .glifo{border-color:var(--crit);color:var(--crit)}
  :root[data-aire="fallo"] .estado-aire .lamp-txt{color:var(--crit)}
  :root[data-aire="fuera"] .estado-aire .lamp-txt{text-decoration:line-through}
  .nav-acc .btn{width:38px;height:38px;padding:0;justify-content:center;font-size:15px}

  /* --- Pestañas: una fila de teclas de bus. La elegida está encendida. --- */
  .tabs{gap:5px;padding-bottom:10px}
  .tabs button{font:400 18px/1 var(--rotulo);letter-spacing:.05em;color:var(--ink-dim);
    background:var(--surface-2);border:1px solid var(--line);border-radius:4px;
    padding:8px 11px 7px;box-shadow:var(--relieve);
    transition:background 160ms var(--ease-out),color 160ms var(--ease-out),
      box-shadow 160ms var(--ease-out),transform 100ms var(--ease-out)}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
    box-shadow:inset 0 -3px 0 color-mix(in srgb,#000 30%,var(--accent))}
  .tabs .c{font:600 11px/1 var(--mono);letter-spacing:0;background:rgba(0,0,0,.28);
    color:inherit;padding:3px 5px;border-radius:2px}
  :root[data-tema="claro"] .tabs .c{background:rgba(0,0,0,.08)}
  .tabs button.on .c{background:rgba(0,0,0,.2)}
  @media (max-width:520px){
    .tabs{gap:5px;row-gap:5px}
    .tabs button{padding:8px 10px 7px;font-size:17px}
  }

  /* --- Teclas: todo lo que se pulsa --- */
  .btn{font:600 13px/1.1 var(--body);letter-spacing:.01em;border-radius:4px;
    background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
    box-shadow:var(--relieve);min-height:36px;
    transition:background 160ms var(--ease-out),border-color 160ms var(--ease-out),
      box-shadow 160ms var(--ease-out),transform 100ms var(--ease-out)}
  .btn.sm{min-height:32px;font-size:12.5px;padding:6px 10px}
  .btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 14px color-mix(in srgb,var(--accent) 30%,transparent)}
  .btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
  .btn:disabled{opacity:.4;box-shadow:none}
  .btn:active:not(:disabled),.tabs button:active,.tbtn:active,.th:active{transform:scale(.97)}
  select.btn{padding-right:28px;appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),
      linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .tabs-aj .btn[aria-selected="true"],.temas .btn[aria-pressed="true"]{
    box-shadow:inset 0 -2px 0 var(--accent)}
  @media (hover:hover) and (pointer:fine){
    .btn:hover:not(:disabled){border-color:var(--ink-faint);background:color-mix(in srgb,var(--surface-2) 70%,var(--ink) 6%)}
    .btn.go:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#fff)}
    .tabs button:not(.on):hover{color:var(--ink);border-color:var(--ink-faint)}
  }

  /* --- Tallies: el estado va con luz y con palabra, nunca solo color --- */
  .pill{font:600 10.5px/1 var(--mono);letter-spacing:.07em;border-radius:3px;
    padding:4px 7px 4px 6px;display:inline-flex;align-items:center;gap:5px;
    border:1px solid color-mix(in srgb,currentColor 30%,transparent)}
  .pill::before{content:"";width:6px;height:6px;border-radius:1px;background:currentColor;flex-shrink:0}
  .pill.idle::before{background:transparent;border:1px solid currentColor}
  .pill.aire{color:var(--aire);background:color-mix(in srgb,var(--aire) 14%,transparent)}
  .pill.aire::before{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}

  /* --- Módulos de rack --- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--relieve)}
  .list{border-radius:6px;border-color:var(--line);box-shadow:var(--relieve)}
  .row{background:var(--surface);border-bottom-color:var(--line-soft)}
  .list-head,.list-foot{background:var(--surface-2)}
  .fino,.preset{border-radius:4px}
  .fino.on,.preset.on{box-shadow:0 0 0 1px var(--accent) inset}
  .script{border-radius:4px;background:var(--surface-2)}
  code.cmd,.equiv{border-radius:3px}
  kbd{border-radius:3px}

  /* Aviso: ni franja de color gruesa a la izquierda ni caja de alerta
     genérica; un filete del color del estado alrededor y el fondo teñido. */
  .aviso{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:6px;
    background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
  .aviso.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));
    background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
  .aviso.crit{border-color:color-mix(in srgb,var(--crit) 60%,var(--line));
    background:color-mix(in srgb,var(--crit) 8%,var(--surface))}
  .alerta-fallo{border:1px solid var(--crit);border-radius:6px;background:var(--surface);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 20%,transparent),var(--sombra);
    top:calc(10px + env(safe-area-inset-top))}
  .fallos{border-radius:4px}

  /* El siguiente paso: un cue. El rótulo va en la misma línea que la
     orden, no encima de ella. */
  .card.siguiente{border:1px solid color-mix(in srgb,var(--accent) 65%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
  .card.siguiente .pill{margin-right:2px}

  /* --- El monitor de PROGRAMA: el trabajo en curso ---
     Negro de monitor en los dos temas; el borde es el tally: rojo al aire,
     ámbar en pausa, rojo sólido si falló, verde al terminar bien. */
  .job,.mini{--ink:var(--monitor-ink);--ink-dim:var(--monitor-dim);--ink-faint:#6f7883;
    --surface:#0f1114;--surface-2:#16191d;--line:var(--monitor-line);--line-soft:#1a1d22;
    /* Dentro del monitor los pilotos son los de la sala, también con el
       estudio iluminado: el monitor es negro en los dos temas. */
    --aire:#ff3b30;--espera:#ffb224;--ok:#34d26d;--ok-soft:#10271a;--warn:#ffb224;
    --warn-soft:#2e2310;--crit:#ff5a4f;--crit-soft:#321614;
    --accent-soft:color-mix(in srgb,var(--accent) 22%,#0f1114);
    background:var(--monitor);color:var(--monitor-ink);border:1px solid var(--monitor-line);
    border-radius:6px;padding:0;overflow:hidden;box-shadow:var(--sombra);
    transition:border-color 450ms var(--ease-out),box-shadow 450ms var(--ease-out)}
  .job > *:not(.umd):not(.linea){margin-left:14px;margin-right:14px}
  .job .umd{display:flex;align-items:center;gap:10px;padding:7px 14px;
    background:#000;border-bottom:1px solid var(--monitor-line);
    font:400 16px/1 var(--rotulo);letter-spacing:.08em;color:var(--monitor-dim)}
  .job .umd .tc{margin-left:auto;font:600 17px/1 var(--mono);letter-spacing:.04em;
    color:var(--monitor-ink);font-variant-numeric:tabular-nums}
  .job .umd .luz{display:inline-flex;align-items:center;gap:6px}
  .job .umd .luz::before{content:"";width:8px;height:8px;border-radius:50%;background:#2a2f36}
  .job.aire{border-color:var(--aire);box-shadow:0 0 0 1px var(--aire)}
  .job.aire .umd .luz{color:var(--aire)}
  .job.aire .umd .luz::before{background:var(--aire);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .job.pausa{border-color:var(--espera)}
  .job.pausa .umd .luz{color:var(--espera)}
  .job.pausa .umd .luz::before{background:var(--espera)}
  .job.err{background:var(--monitor);border-color:var(--crit);box-shadow:0 0 0 1px var(--crit)}
  .job.err .umd .luz{color:var(--crit)}
  .job.err .umd .luz::before{background:var(--crit)}
  .job.fin{background:var(--monitor);border-color:var(--ok)}
  .job.fin .umd .luz{color:var(--ok)}
  .job.fin .umd .luz::before{background:var(--ok)}
  .job-top{margin-top:12px}
  .job-tit b{font:600 16px/1.25 var(--body);color:var(--monitor-ink)}
  .job-fin{border-radius:4px;margin-top:12px}
  .paso{color:var(--monitor-ink);opacity:.92}
  .tbtn{border-radius:4px;background:#15181c;border:1px solid var(--monitor-line);color:var(--monitor-ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:transform 100ms var(--ease-out)}
  #b-detalle{margin-bottom:12px}
  .log{background:#000;border:1px solid var(--monitor-line);border-radius:4px;margin-bottom:12px}
  /* La línea de tiempo: graduada cada 10 %, lo grabado en rojo apagado y
     el cabezal encendido recorriéndola. */
  .job .barra,.mini .barra{height:8px;border-radius:2px;
    background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#2a2f36 calc(10% - 1px) 10%),#101216;
    overflow:visible;position:relative}
  .job .barra i,.mini .barra i{position:relative;border-radius:2px;
    background:color-mix(in srgb,var(--aire) 50%,#101216);transition:width 400ms linear}
  .job .barra i::after,.mini .barra i::after{content:"";position:absolute;right:-1px;top:-3px;bottom:-3px;
    width:2px;background:#fff}
  .job .barra{margin-top:12px}

  /* La barra de abajo: un rótulo de tercio inferior con la luz a un lado. */
  .mini{background:var(--monitor);color:var(--monitor-ink);border-top:1px solid var(--monitor-line);
    --ink:var(--monitor-ink);--ink-dim:var(--monitor-dim)}
  .mini-top .q,.mini-top .t{color:var(--monitor-dim)}

  /* --- Revisar: la pared de monitores --- */
  .th{background:var(--monitor);border:1px solid var(--monitor-line);border-radius:3px;
    transition:transform 100ms var(--ease-out),box-shadow 160ms var(--ease-out)}
  .th .im{background:#0d0f12}
  .th .cp{background:#000;color:var(--monitor-dim);font:400 14px/1 var(--rotulo);
    letter-spacing:.08em;padding:4px 3px 3px}
  /* El que estás mirando está en PREVIO: tally verde alrededor y en su rótulo. */
  .th.on{border-color:var(--previo);box-shadow:0 0 0 2px var(--previo)}
  .th.on .cp,.th.sub.on .cp{background:var(--previo);color:var(--previo-ink)}
  /* Ya emitido: el monitor se apaga y lleva su ✓; lo vivo es lo que falta. */
  .th.sub{border-color:var(--monitor-line)}
  .th.sub .cp{color:#5d6670}
  .th.sub.on{border-color:var(--previo)}
  .th .ck{background:#2a3038;color:var(--monitor-ink);border-radius:2px;box-shadow:none}
  .leyenda .mu{border-radius:2px}
  .leyenda .mu.sub{background:#2a3038;border-color:#2a3038;color:var(--monitor-ink)}
  /* El monitor de previo: el video con su rótulo encima. */
  .review > div:first-child{position:relative}
  /* border-box a mano: el *{box-sizing} del principio no alcanza a los
     ::before, y con el relleno la tira salía 20px más ancha que el video. */
  .review > div:first-child::before{content:"Previo";display:block;width:100%;box-sizing:border-box;
    font:400 16px/1 var(--rotulo);letter-spacing:.08em;color:var(--previo-ink);background:var(--previo);
    padding:5px 10px 4px;border-radius:4px 4px 0 0}
  video{border-radius:0 0 4px 4px;border:1px solid var(--monitor-line);border-top:0}
  #hoja-fondos video{border-radius:4px;border-top:1px solid var(--monitor-line)}

  /* --- Interruptores: una tecla con piloto --- */
  .switch .rail{border-radius:4px;background:var(--surface-2);border:1px solid var(--line);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
  .switch .rail::before{border-radius:2px;left:2px;bottom:2px;background:var(--ink-faint);
    transition:transform 180ms var(--ease-out),background 180ms var(--ease-out)}
  .switch input:checked + .rail{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2));border-color:var(--accent)}
  .switch input:checked + .rail::before{background:var(--accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .switch input:focus-visible + .rail{outline:2px solid var(--accent);outline-offset:2px}

  /* --- Superficies flotantes --- */
  .toast{background:var(--monitor);color:var(--monitor-ink);border:1px solid var(--monitor-line);
    border-radius:4px;box-shadow:var(--sombra);font-size:13.5px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(6px);
    transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
  .toast.on{transform:translateX(-50%) translateY(0)}
  .modal{background:rgba(3,4,6,.72)}
  .modal .caja{border-radius:8px;box-shadow:var(--sombra)}
  .modal textarea,.modal input[type=text]{border-radius:4px}
  #dicc .e{border-radius:6px}
  .paso-t{border-radius:6px}
  .paso-t .n{border-radius:3px}
  .colores button,.colores label{border-radius:4px}

  @media (min-width:1100px){
    .nav{background:var(--surface);padding-top:0}
    .marca{flex-wrap:wrap;margin:0 2px 22px}
    .titulo{font-size:26px}
    .tabs{gap:4px;padding-bottom:0}
    .tabs button{font-size:19px;padding:10px 12px 9px;border-left:1px solid var(--line);border-radius:4px}
    .tabs button.on{border-left-color:var(--accent);background:var(--accent)}
    .tabs button:not(.on):hover{background:var(--surface-2)}
    .row:hover{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
    .row.sel.on:hover{background:var(--accent-soft)}
    .review{padding:18px}
    /* El monitor de previo mide lo que el video vertical que cabe en la
       ventana: así el rótulo PREVIO no sobresale por los lados. */
    .review > .previo-vertical{width:min(100%,calc((100vh - 96px) * 9 / 16));justify-self:center}
    /* El ancho lo pone el contenedor y el video lo llena siempre: si
       alguna regla le limitaba el alto, el video encogía y el rótulo
       PREVIO quedaba más ancho que la imagen. */
    .review > div:first-child video{width:100%;max-width:none;max-height:none;margin:0}
  }
  /* Iconos dibujados (ver iconizar): trazo de Lucide al color del texto. */
  .ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;margin-right:.42em;
    fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico.solo{margin-right:0}
  .tbtn .ico.solo{width:18px;height:18px}
  .pill .ico{width:1.05em;height:1.05em;margin-right:.35em}
  .pill:has(> .ico)::before{display:none}
  #b-desactivar{color:var(--espera)}
  /* Pantallas grandes (un 27–32" a 2K o más): la sala de control completa.
     La pared de monitores a la izquierda y el previo fijo a la derecha, en
     vez de una columna de 1280px en medio y el previo debajo de 65
     miniaturas. El previo crece con la altura de la ventana. */
  @media (min-width:1800px){
    .wrap{max-width:2200px;padding:26px 40px 80px}
    #v-revisar.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
      column-gap:32px;align-items:start}
    #v-revisar > *{grid-column:1;min-width:0}
    #v-revisar > .review{grid-column:2;grid-row:1 / span 20;position:sticky;top:20px;
      max-height:calc(100vh - 40px);overflow-y:auto;margin-top:0;
      grid-template-columns:auto minmax(320px,1fr)}
    #v-revisar > .review > div:first-child{position:static}
    #v-revisar > .review > .previo-vertical{width:calc((100vh - 230px) * 9 / 16);max-width:40vw}
    .th{width:84px}
    /* Las demás vistas son listas de «etiqueta … control»: a 2200px el
       control quedaba a un metro de su nombre. */
    .view:not(#v-revisar){max-width:1500px}
  }
  /* Historias que Gemini no escribió (Cola). */
  .fallidos{margin-bottom:14px}
  .fallido{border-top:1px solid var(--line)}
  .fallido summary{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;list-style:none;min-height:44px}
  .fallido summary::-webkit-details-marker{display:none}
  .fallido summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fallido[open] summary .t{white-space:normal}
  .marca-fallo{flex:none;width:22px;text-align:center;font-size:18px;line-height:1;color:var(--warn)}
  .marca-fallo.bloq{color:var(--crit)}
  .fallido .porque{padding:0 13px 13px 41px;font-size:13.5px;color:var(--ink-dim)}
  .fallido .porque b{color:var(--ink)}
  .fallido .porque p{margin:6px 0}
  .fallido .crudo{font:11.5px/1.5 var(--mono);color:var(--ink-faint);margin:8px 0;overflow-wrap:anywhere}
  .fallido .de{font-size:12.5px}
  @media (hover:hover) and (pointer:fine){ .fallido summary:hover{background:var(--surface-2)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="nav"><div class="nav-in">
  <div class="marca">
    <div class="glifo" id="tally-lamp" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></div>
    <div class="txt">
      <h1 class="titulo">Mesa de <span class="b">Revisión</span></h1>
      <div class="estado-aire" role="status"><span class="lamp-txt" id="tally-txt">En espera</span><span class="reloj" id="reloj" aria-hidden="true"></span></div>
    </div>
    <div class="nav-acc">
      <button class="btn sm" id="b-actualizar" title="Volver a mirar qué hay ahora mismo" aria-label="Actualizar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="btn sm" id="b-desactivar" title="Desactivar este aparato, para que no trabaje a la vez que el otro" aria-label="Desactivar">☢️</button>
      <button class="btn sm" id="b-apagar" title="Apagar el panel" aria-label="Apagar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="display:block"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    </div>
  </div>
  <div class="tabs">
    <button data-v="revisar" class="on">Revisar <span class="c" id="c-rev">0</span></button>
    <button data-v="cola">Cola <span class="c" id="c-col">0</span></button>
    <button data-v="estilo">Estilo</button>
    <button data-v="publicados">Subidos <span class="c" id="c-pub">0</span></button>
    <button data-v="canal">Canal <span class="c" id="c-can">0</span></button>
    <button data-v="tiktok">TikTok <span class="c" id="c-tk">0</span></button>
    <button data-v="ajustes">Ajustes</button>
  </div>
  <div class="atajos">
    <kbd>1</kbd>–<kbd>7</kbd> pestañas<br>
    <kbd>←</kbd> <kbd>→</kbd> otro video<br>
    <kbd>espacio</kbd> ver / pausar<br>
    <kbd>F</kbd> pantalla completa<br>
    <kbd>R</kbd> volver a mirar
  </div>
</div></div>

<div class="wrap">
  <div id="desactivado-slot"></div>
  <div id="paso-slot"></div>
  <div id="job-slot"></div>
  <div id="dicc"></div>
  <div id="hoja-fondos"></div>
  <div id="cola-slot"></div>

  <section class="view on" id="v-revisar"></section>
  <section class="view" id="v-cola"></section>
  <section class="view" id="v-estilo"></section>
  <section class="view" id="v-publicados"></section>
  <section class="view" id="v-canal"></section>
  <section class="view" id="v-tiktok"></section>
  <section class="view" id="v-ajustes"></section>
</div>

<button class="mini" id="mini-job" hidden title="Ver el trabajo en curso">
  <div class="mini-top">
    <span class="pill acc" id="mini-estado"></span>
    <span class="q" id="mini-paso"></span>
    <span class="t" id="mini-t"></span>
  </div>
  <div class="barra"><i id="mini-barra"></i></div>
</button>

<div class="alerta-fallo" id="alerta-fallo" hidden role="alert"></div>
<div class="toast" id="toast"></div>
<audio id="oido" style="display:none"></audio>

<script>
const $ = s => document.querySelector(s);

/* Iconos: los botones siguen escritos con un emoji delante ("🗑 Borrar"), que
   es cómodo de leer en el código; al pintarse, ese emoji se cambia por su
   dibujo de Lucide (lucide.dev, licencia ISC, trazos copiados tal cual). Un
   emoji que no esté en ICONO_DE se queda como está. */

const ICONO_DE = {"→":"arrow-right","✓":"check","✔":"check","⚠":"triangle-alert","▶":"play","✂":"scissors","✕":"x","✗":"x","❌":"x","⛔":"octagon-x","🗑":"trash-2","↻":"refresh-cw","⏸":"pause","✅":"circle-check","☢":"radiation","📖":"book-open","✍":"pen-line","🔎":"search","🔍":"search","⏹":"square","←":"arrow-left","📦":"archive","🚫":"ban","💡":"lightbulb","✎":"pencil","🎞":"film","⏱":"timer","⏳":"hourglass","⚡":"zap","🖥":"monitor","📂":"folder-open","↺":"rotate-ccw","🎬":"clapperboard","🧹":"brush-cleaning","🩺":"stethoscope","🔑":"key-round","🎨":"palette","📤":"share","📥":"download","⏻":"power","🧠":"cpu","✨":"sparkles","🔀":"shuffle","🧪":"flask-conical","📋":"clipboard-paste","👁":"eye","🔌":"plug","⚙":"settings","🎵":"music","🧰":"wrench","📱":"smartphone","☀":"sun","🌙":"moon","🌐":"globe"};
const RE_ICONO = new RegExp('^\\s*(' + Object.keys(ICONO_DE).join('|') + ')\\uFE0F?\\s*', 'u');
const CON_ICONO = 'button,.btn,.tbtn,.pill,summary';
// Un botón que se queda solo con el dibujo necesita nombre para el lector
// de pantalla (y el globo al pasar el ratón): el emoji al menos se leía.
const NOMBRE_ICONO = {'trash-2':'Quitar', play:'Reproducir', pause:'Pausar', x:'Cerrar',
  pencil:'Editar', 'refresh-cw':'Actualizar', square:'Parar', 'rotate-ccw':'Rehacer',
  search:'Buscar', power:'Apagar', radiation:'Desactivar'};
function iconizar(raiz){
  const els = raiz.matches?.(CON_ICONO) ? [raiz] : [];
  els.push(...raiz.querySelectorAll(CON_ICONO));
  for(const el of els){
    const t = el.firstChild;
    if(!t || t.nodeType !== 3) continue;
    const m = RE_ICONO.exec(t.data);
    if(!m) continue;
    t.data = t.data.slice(m[0].length);
    const solo = !el.textContent.trim();
    if(solo && el.tagName === 'BUTTON' && !el.title && !el.getAttribute('aria-label')){
      const n = NOMBRE_ICONO[ICONO_DE[m[1]]];
      if(n){ el.title = n; el.setAttribute('aria-label', n); }
    }
    el.insertAdjacentHTML('afterbegin', `<svg class="ico${solo ? ' solo' : ''}" viewBox="0 0 24 24" aria-hidden="true">${TRAZOS[ICONO_DE[m[1]]]}</svg>`);
  }
}
new MutationObserver(ms => {
  for(const m of ms){
    const el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
    if(el) iconizar(el);
  }
}).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
document.addEventListener('DOMContentLoaded', () => iconizar(document.body));
let E = null;            // último estado del servidor
let elegido = 0;         // índice del video en revisión
let seleccion = new Set();
let tocado = false;      // ¿el usuario ya eligió historias a mano?
let abiertoRehacer = false;
let finos = {};          // qué casillas de "al rehacer, cambiar…" están marcadas
let musicaElegida = {};  // nº de historia -> archivo de música fijado a mano
let verGrabadas = false; // en la cola, ¿enseñar también las que ya tienen video?

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }

async function api(url, opts){
  const r = await fetch(url, opts);
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
const post = (url, cuerpo) => api(url, {method:'POST',
  headers:{'Content-Type':'application/json'}, body: JSON.stringify(cuerpo||{})});

async function ejecutar(accion, cuerpo){
  try{
    const r = await post('/api/ejecutar/'+accion, cuerpo);
    // Sin esto, pulsar con algo corriendo parece que no hace nada: antes
    // salía un error y ahora se encola en silencio.
    if(r && r.encolado) toast(`En espera (${r.encolado.posicion}º): ${r.encolado.nombre}`);
    refrescar();
  }catch(e){ toast(e.message); }
}
async function trabajo(que){
  try{ await api('/api/trabajo/'+que, {method:'POST'}); refrescar(); }
  catch(e){ toast(e.message); }
}

/* ---------- previsualizar música ---------- */
let sonando = null;
function oir(archivo, boton){
  const a = $('#oido');
  if(sonando === archivo){ a.pause(); sonando = null; pintaBotonesOir(); return; }
  a.src = '/audio/' + encodeURIComponent(archivo);
  a.play().catch(e => toast('No se pudo reproducir: ' + e.message));
  sonando = archivo; pintaBotonesOir();
}
function pintaBotonesOir(){
  document.querySelectorAll('[data-oir]').forEach(b=>{
    b.textContent = b.dataset.oir === sonando ? '⏸' : '▶';
  });
}
$('#oido').onended = ()=>{ sonando = null; pintaBotonesOir(); };

/* =========================================================
   TRABAJO EN CURSO

   Se construye una vez y después solo se reemplaza el texto de los nodos.
   Repintar el bloque entero en cada refresco es lo que hacía que el registro
   pareciera una cascada: el navegador redibujaba las 120 líneas cada 1.5 s.
   ========================================================= */
let jobMontado = null;   // nombre+arranque del trabajo ya dibujado

/* La barra de abajo (.mini) enseña lo mismo que la tarjeta, pero solo cuando
   la tarjeta no se ve. Quien decide eso es el navegador, no un cálculo de
   scroll a mano: el margen negativo descuenta la cabecera pegajosa, porque la
   tarjeta asomando POR DEBAJO de la cabecera no es una tarjeta que puedas
   leer. */
// El mismo corte que el @media de escritorio en el CSS.
const ESCRITORIO = matchMedia('(min-width:1100px)');
// Dónde están los archivos, para decirlo con su nombre: «teléfono» sigue
// siendo lo normal; en Windows es el PC.
function equipo(){ return E && E.es_windows ? 'PC' : (E && !E.es_android ? 'equipo' : 'teléfono'); }
let hayTrabajo = false, tarjetaALaVista = false, vigilante = null;

function refrescarMini(){
  $('#mini-job').hidden = !hayTrabajo || tarjetaALaVista;
}

function vigilarTarjeta(caja){
  if(vigilante) vigilante.disconnect();
  tarjetaALaVista = false;
  // En el PC la cabecera es la barra lateral: no tapa nada por arriba, y
  // su alto (la pantalla entera) dejaría la tarjeta siempre «fuera de vista».
  const alto = ESCRITORIO.matches ? 0 : document.querySelector('.nav').offsetHeight;
  vigilante = new IntersectionObserver(entradas=>{
    tarjetaALaVista = entradas[0].isIntersecting;
    refrescarMini();
  }, {rootMargin: `-${alto}px 0px 0px 0px`});
  vigilante.observe(caja);
}

/* La cola de espera y los últimos terminados.

   Va en su propio hueco y no dentro de la tarjeta del trabajo, porque esa
   solo se vuelve a montar cuando cambia el nombre de lo que corre: la cola
   cambia mientras el nombre es el mismo, y se quedaría congelada.

   Los terminados están aquí porque con cola el panel deja de estar mirando:
   arrancas cinco, sales, y al volver quieres ver cómo fueron los cuatro que
   ya pasaron. De los que fallaron se enseña el final de su salida, que es lo
   que hay que leer. */
/* Las historias que no caben en un short. Partirlas es decisión tuya: aquí
   se ofrece, historia por historia, y nada se parte solo salvo que actives
   el modo automático en Ajustes → Automático. */
function bloquePartibles(h){
  const largas = h.filter(x => x.larga && !x.renderizada);
  const guardadas = (E && E.archivadas) || 0;
  // Las apartadas se enseñan aunque ya no quede ninguna larga en la cola: es
  // el único sitio desde donde se pueden devolver.
  const pie = (solo) => `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:${solo?0:10}px">
      <span class="${solo?'':'m'}" style="flex-grow:1">${solo?'':'📦 '}${guardadas} historia${guardadas>1?'s':''}
        larga${guardadas>1?'s':''} guardada${guardadas>1?'s':''} para cuando se abran los videos largos.</span>
      <button class="btn sm" id="b-devolver-largas">Devolver a la cola</button></div>`;
  if(!largas.length) return guardadas ? `<div class="aviso"><span>📦</span><div>${pie(true)}</div></div>` : '';
  return `<div class="aviso"><span>✂</span><div>
    <b>${largas.length === 1 ? 'Una historia es demasiado larga' : largas.length + ' historias son demasiado largas'}
      para un short.</b> Mientras los videos largos estén bloqueados no se graban. Puedes
    partirlas en varios shorts seguidos («Parte 1 de 3…»), sin cambiar el texto, o apartarlas
    hasta que se abran los largos.
    ${largas.map(x=>`<div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <span style="flex-grow:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.titulo)}</span>
      ${x.partes > 1 ? `<button class="btn sm" style="white-space:nowrap" data-partir="${x.n}" data-partes="${x.partes}">✂ Partir en ${x.partes}</button>`
                     : `<span class="m" style="white-space:nowrap">no cabe ni partida</span>`}
    </div>`).join('')}
    <div style="margin-top:10px"><button class="btn sm" id="b-archivar-largas">📦 Archivar ${largas.length === 1 ? 'la larga' : 'las ' + largas.length}</button></div>
    ${guardadas ? pie(false) : ''}</div></div>`;
}

/* «✂ Recortes», en la pestaña Shorts: las largas que sí salen como shorts
   si se parten. Es la otra cara del bloque de arriba: allí se ven como videos
   que esperan, aquí como shorts que se pueden sacar ya. */
function bloqueRecortes(h){
  const partibles = h.filter(x => x.larga && !x.renderizada && x.partes > 1);
  if(!partibles.length) return '';
  const total = partibles.reduce((a,x)=>a + x.partes, 0);
  return `<h3 class="sec">✂ Recortes: ${total} shorts más si partes ${partibles.length === 1 ? 'esta' : 'estas ' + partibles.length}</h3>
    <div class="list">${partibles.map(x=>`
      <div class="row" style="grid-template-columns:1fr auto auto;gap:8px">
        <span class="t" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.titulo)}</span>
        <span class="m">${x.duracion}</span>
        <button class="btn sm" style="white-space:nowrap" data-partir="${x.n}" data-partes="${x.partes}">✂ En ${x.partes}</button>
      </div>`).join('')}</div>
    <p class="sub" style="margin-top:6px">Cada una sale como «Parte 1 de 2…», cortada entre frases y sin
      cambiar el texto. La original queda entera en el historial.</p>`;
}

/* En «Todo» las largas no se despliegan: una línea dice cuántas hay y lleva
   a la pestaña Videos, que es donde se deciden. */
function lineaLargas(h){
  const largas = h.filter(x => x.larga && !x.renderizada).length;
  const guardadas = (E && E.archivadas) || 0;
  if(!largas && !guardadas) return '';
  return `<div class="aviso"><span>🎞</span><div>
    ${largas ? `<b>${largas} ${largas===1?'no cabe':'no caben'} en un short.</b> ` : ''}${guardadas
      ? `${guardadas} guardada${guardadas>1?'s':''} para los videos largos. ` : ''}
    <div class="acciones-aviso">
      <button class="btn sm" onclick="filtroCola='videos';pintar()">🎞 Verlas en Videos</button>
      ${h.some(x=>x.larga && x.partes>1 && !x.renderizada)
        ? `<button class="btn sm" onclick="filtroCola='shorts';pintar()">✂ Partirlas en Shorts</button>` : ''}
    </div>
  </div></div>`;
}

function enlazarArchivadas(){
  const bArch = $('#b-archivar-largas');
  if(bArch) bArch.onclick = ()=>{
    if(!confirm('Se apartan de la cola las historias demasiado largas para un short, a guion_largas.txt.\n\n'
      + 'El texto no cambia y queda una copia con fecha de la cola. Las que quedan se renumeran. '
      + 'Cuando se abran los videos largos, «Devolver a la cola» las trae de vuelta al final.')) return;
    ejecutar('archivar_largas');
  };
  const bDev = $('#b-devolver-largas');
  if(bDev) bDev.onclick = ()=>{
    if(!confirm('¿Devolver a la cola las historias largas guardadas? Van al final, así que ninguna otra cambia de número.')) return;
    ejecutar('devolver_largas');
  };
}

/* ---------- tramos de los fondos que no se usan (fondos_excluidos.py) ----------
   Hoja a pantalla completa, fuera de las vistas: el repintado periódico
   no la toca, así que el video no se reinicia mientras marcas. */
let fondosCache = [], fondoAbierto = null, marca = {inicio:null, fin:null};
const mmss = t => { t = Math.max(0, +t||0); const m = Math.floor(t/60), s = t - m*60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`; };
function cerrarFondos(){
  const v = $('#hoja-fondos video'); if(v) v.pause();
  $('#hoja-fondos').classList.remove('on'); document.body.style.overflow = '';
}
async function abrirFondos(archivo){
  const hoja = $('#hoja-fondos');
  try{ fondosCache = await api('/api/fondos'); }
  catch(e){ return toast('No se pudo cargar la lista de fondos: ' + e.message); }
  fondoAbierto = archivo || null; marca = {inicio:null, fin:null};
  hoja.classList.add('on'); document.body.style.overflow = 'hidden'; hoja.scrollTop = 0;
  fondoAbierto ? pintaEditorFondo() : pintaListaFondos();
}
function pintaListaFondos(){
  $('#hoja-fondos').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <h2 style="flex-grow:1;margin:0">✂ Tramos que no se usan</h2>
      <button class="btn" onclick="cerrarFondos()">✕ Cerrar</button></div>
    <p class="sub">El render corta trozos de 6 a 12 segundos de estos videos, en puntos al azar.
      Abre uno, míralo y marca lo que no quieres que salga: ningún corte lo volverá a pisar.</p>
    ${!fondosCache.length ? '<p class="sub">No hay videos de fondo en la carpeta.</p>' : `<div class="list">${fondosCache.map(f=>`
      <div class="row" style="grid-template-columns:1fr auto;gap:8px">
        <div style="min-width:0"><div class="t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.archivo)}</div>
          <div class="m">${mmss(f.duracion)} · ${f.mb} MB · ${f.entero ? '🚫 no se usa'
            : f.tramos.length ? `✂ ${f.tramos.length} tramo${f.tramos.length>1?'s':''} fuera` : 'se usa entero'}</div></div>
        <button class="btn sm" data-abrir-fondo="${esc(f.archivo)}">Abrir</button>
      </div>`).join('')}</div>`}`;
  document.querySelectorAll('[data-abrir-fondo]').forEach(b => b.onclick = ()=>{
    fondoAbierto = b.dataset.abrirFondo; marca = {inicio:null, fin:null}; pintaEditorFondo();
  });
}
function pintaEditorFondo(){
  const f = fondosCache.find(x=>x.archivo===fondoAbierto);
  if(!f) return pintaListaFondos();
  $('#hoja-fondos').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn sm" id="fx-volver">← Fondos</button>
      <b style="flex-grow:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.archivo)}</b>
      <button class="btn sm" onclick="cerrarFondos()">✕</button></div>
    <video id="fx-video" controls playsinline preload="metadata" src="/fondo/${encodeURIComponent(f.archivo)}"></video>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
      <button class="btn" id="fx-ini">⏱ Marcar inicio</button>
      <button class="btn" id="fx-fin">⏱ Marcar fin</button>
      <button class="btn go" id="fx-guardar" disabled>✂ Excluir este tramo</button>
    </div>
    <div class="m" id="fx-marca" style="margin-top:6px"></div>
    <div id="fx-tramos"></div>
    <div style="margin-top:14px"><button class="btn" id="fx-entero">${f.entero ? '✅ Volver a usar este fondo' : '🚫 No usar este fondo nunca'}</button></div>`;
  const v = $('#fx-video');
  const pintaMarca = ()=>{
    $('#fx-marca').textContent = `Inicio: ${marca.inicio===null ? '—' : mmss(marca.inicio)} · Fin: ${marca.fin===null ? '—' : mmss(marca.fin)}`;
    $('#fx-guardar').disabled = marca.inicio===null || marca.fin===null;
  };
  const pintaTramos = ()=>{
    const g = fondosCache.find(x=>x.archivo===fondoAbierto) || f;
    $('#fx-tramos').innerHTML = !g.tramos.length ? `<p class="sub" style="margin-top:10px">Ningún tramo fuera: se usa entero.</p>`
      : `<h3 class="sec" style="margin-top:14px">Tramos que no se usan</h3><div class="list">${g.tramos.map((t,i)=>`
        <div class="row" style="grid-template-columns:1fr auto auto;gap:8px">
          <span class="t">${mmss(t[0])} – ${mmss(t[1])}</span>
          <button class="btn sm" data-ir="${t[0]}">▶ Ver</button>
          <button class="tbtn" title="Quitar este tramo" data-quitar="${i}">✕</button>
        </div>`).join('')}</div>`;
    document.querySelectorAll('[data-ir]').forEach(b => b.onclick = ()=>{ v.currentTime = +b.dataset.ir; v.play(); });
    document.querySelectorAll('[data-quitar]').forEach(b => b.onclick = ()=> guardarFondo({quitar: +b.dataset.quitar}, pintaTramos));
  };
  $('#fx-volver').onclick = ()=>{ v.pause(); fondoAbierto = null; pintaListaFondos(); };
  $('#fx-ini').onclick = ()=>{ marca.inicio = v.currentTime; pintaMarca(); };
  $('#fx-fin').onclick = ()=>{ marca.fin = v.currentTime; pintaMarca(); };
  $('#fx-guardar').onclick = ()=> guardarFondo({inicio: marca.inicio, fin: marca.fin}, ()=>{
    marca = {inicio:null, fin:null}; pintaMarca(); pintaTramos(); toast('✓ Ese tramo ya no se usará');
  });
  $('#fx-entero').onclick = ()=>{
    const g = fondosCache.find(x=>x.archivo===fondoAbierto) || f;
    guardarFondo({entero: !g.entero}, ()=>{ v.pause(); pintaEditorFondo();
      toast(g.entero ? '✓ Se vuelve a usar' : '✓ Este fondo ya no se usará'); });
  };
  pintaMarca(); pintaTramos();
}
async function guardarFondo(cambio, luego){
  try{ fondosCache = await post('/api/fondos/excluir', Object.assign({archivo: fondoAbierto}, cambio)); luego(); }
  catch(e){ toast(e.message); }
}

/* ---------- diccionario de errores (errores.py) ---------- */
const NOMBRE_VISTA = {ajustes:'Ajustes', cola:'la Cola', revisar:'Revisar', canal:'Canal'};
/* Qué modelo de Gemini está escribiendo y cuáles se quedaron por el camino
   (sin cuota, saturados, retirados). Lo cuenta el servidor a partir de lo
   que va diciendo script_writer. */
const corto = m => String(m).replace(/^gemini-/, '');
function bloqueModelos(mo, vivo){
  if(!mo) return '';
  const fila = (ico, txt, lista) => lista && lista.length
    ? `<div>${ico} ${txt}: <b>${lista.map(corto).map(esc).join(', ')}</b></div>` : '';
  return `<div class="m" style="margin-top:8px;line-height:1.6">
    ${mo.en_uso ? `<div>🟢 ${vivo ? 'Escribiendo con' : 'Último usado'}: <b>${esc(corto(mo.en_uso))}</b></div>` : ''}
    ${fila('⛔', 'Sin cuota hoy', mo.sin_cuota)}
    ${fila('⏳', 'Saturados en el último intento', mo.saturados)}
    ${fila('🚫', 'No existen', mo.no_existen)}
  </div>`;
}

/* Qué falló, en qué y cuándo: una fila por fallo, lo último arriba, con
   lo que estaba procesando («Video 3 · 03_Titulo.txt»), el mensaje real y,
   si el diccionario lo conoce, qué hacer. Lo apunta el servidor al vuelo
   (Trabajo._mirar_fallo), así que sale en cuanto pasa, no al terminar. */
function bloqueFallos(fs, maximo = 5){
  if(!fs || !fs.length) return '';
  const ult = fs.slice(-maximo).reverse();
  const hora = seg => `${Math.floor(seg/60)}:${String(seg%60).padStart(2,'0')}`;
  return `<div class="fallos">
    <div class="fallos-tit">⚠ ${fs.length === 1 ? 'Un fallo' : fs.length + ' fallos'} en este trabajo
      ${fs.length > maximo ? `<span class="m">(los ${maximo} últimos)</span>` : ''}</div>
    ${ult.map(f => `<div class="fallo">
      <div class="fallo-cab"><span class="m">${hora(f.seg)}</span>
        <b>${esc(f.contexto || 'Sin detalle de qué procesaba')}</b></div>
      <div class="fallo-txt">${esc(f.texto)}</div>
      ${f.explicacion ? `<div class="m" style="margin-top:3px">💡 <b>${esc(f.explicacion.titulo)}.</b>
        ${esc(f.explicacion.que_hacer)}
        ${f.explicacion.ir ? ` <a href="#" onclick="irA('${esc(f.explicacion.ir)}');return false">Ir allí</a>` : ''}</div>` : ''}
    </div>`).join('')}
  </div>`;
}

/* El aviso de fallo que sale en cualquier pestaña, en el momento: la
   tarjeta del trabajo solo se ve en su pestaña, y un fallo a media tanda
   no puede esperar a que alguien vaya a mirar. Uno por fallo nuevo; si
   llegan varios seguidos, dice cuántos. Con el panel en segundo plano,
   además vibra y cambia el título de la pestaña (y el servidor manda una
   notificación de Android, ver avisar_fallo). */
let fallosVistos = null;   // "inicio:n" del último fallo ya avisado
function vigilarFallos(){
  const fuentes = [E && E.trabajo, ...((E && E.hechos) || []).slice(-3)].filter(Boolean);
  let nuevo = null, total = 0, dueño = null;
  for(const t of fuentes){
    for(const f of (t.fallos || [])){
      const clave = `${t.inicio}:${f.n}`;
      if(fallosVistos === null) continue;
      if(!fallosVistos.has(clave)){ fallosVistos.add(clave); nuevo = f; dueño = t; total++; }
    }
  }
  if(fallosVistos === null){
    // Al abrir el panel, lo que ya había fallado no se avisa como nuevo:
    // está en la tarjeta y en «Ya terminados».
    fallosVistos = new Set(fuentes.flatMap(t => (t.fallos || []).map(f => `${t.inicio}:${f.n}`)));
    return;
  }
  if(!nuevo) return;
  const caja = $('#alerta-fallo');
  const exp = nuevo.explicacion;
  caja.innerHTML = `<span class="ico">⚠</span>
    <div style="min-width:0;flex:1">
      <b>${total > 1 ? total + ' fallos' : 'Falló'} · ${esc(dueño.nombre)}</b>
      ${nuevo.contexto ? `<div class="en">${esc(nuevo.contexto)}</div>` : ''}
      <div class="que">${esc(exp ? exp.titulo + ': ' : '')}${esc(nuevo.texto)}</div>
    </div>
    <div class="acc">
      ${dueño.vista ? `<button class="btn sm" id="af-ver">Ver</button>` : ''}
      <button class="tbtn" id="af-cerrar" title="Cerrar">✕</button>
    </div>`;
  caja.hidden = false;
  const ver = $('#af-ver');
  if(ver) ver.onclick = ()=>{ caja.hidden = true; irA(dueño.vista); };
  $('#af-cerrar').onclick = ()=>{ caja.hidden = true; };
  try{ if(navigator.vibrate) navigator.vibrate([200, 100, 200]); }catch(e){}
  if(document.hidden){
    document.title = '⚠ Falló · ' + TITULO_BASE;
    document.addEventListener('visibilitychange', function volver(){
      if(!document.hidden){ document.title = TITULO_BASE; document.removeEventListener('visibilitychange', volver); }
    });
  }
}

function bloqueExplicacion(ex){
  if(!ex || !ex.length) return '';
  return `<div class="explica">${ex.map(e=>`

/* La tarjeta grande del trabajo (y la lista de en espera / ya terminados)
   sale solo en la pestaña de lo que está haciendo: grabar en la Cola,
   publicar en Subidos… En las demás basta la barra de abajo. El servidor
   dice cuál es («vista»); si no lo sabe, sale en todas. Sin trabajo en
   curso manda el último terminado. */
function trabajoEnEstaPestana(){
  const ref = (E && E.trabajo) || (E && E.hechos && E.hechos[E.hechos.length-1]);
  return !ref || !ref.vista || ref.vista === vistaActual();
}

function pintaJob(){
  const j = E && E.trabajo, slot = $('#job-slot');
  const aqui = trabajoEnEstaPestana();
  slot.hidden = !aqui;
  $('#cola-slot').hidden = !aqui;
  if(!j){
    slot.innerHTML=''; jobMontado=null;
    if(vigilante){ vigilante.disconnect(); vigilante = null; }
    hayTrabajo = false; refrescarMini();
    return;
  }

  const id = j.nombre;
  if(jobMontado !== id){
    jobMontado = id;
    slot.innerHTML = `
      <div class="job" id="job-caja">
        <div class="umd"><span class="luz" id="job-luz">Programa</span><span class="tc" id="job-tc">00:00:00</span></div>
        <div id="job-fin"></div>
        <div class="job-top">
          <div class="job-tit">
            <b id="job-nom"></b>
            <div class="job-meta">
              <span class="pill acc" id="job-estado" hidden></span>
              <span id="job-t" hidden></span>
              <span class="pill" id="job-cod" hidden></span>
              <span class="pill idle" id="job-uso" hidden title="Cuánto del procesador entero usa el render (100% = todos los núcleos)"></span>
            </div>
          </div>
          <button class="tbtn" id="b-pausa" title="Pausar">⏸</button>
          <button class="tbtn" id="b-abort" title="Abortar" style="color:var(--crit)">⏹</button>
          <button class="tbtn" id="b-cerrar" title="Cerrar">✕</button>
        </div>
        <div class="paso" id="job-paso"></div>
        <div id="job-fallos"></div>
        <div id="job-modelos"></div>
        <div id="job-explica"></div>
        <div class="barra"><i id="job-barra"></i></div>
        <button class="btn sm" id="b-detalle" style="margin-top:9px">Ver detalle</button>
        <div class="log" id="log" style="display:none"></div>
      </div>`;
    $('#b-pausa').onclick = ()=>trabajo(E.trabajo.estado==='pausado'?'reanudar':'pausar');
    $('#b-abort').onclick = ()=>{ if(confirm('¿Abortar lo que está corriendo?')) trabajo('abortar'); };
    // Cerrar solo aparece cuando ya terminó: quita la tarjeta de la vista.
    // Lo que pasó no se pierde, queda apuntado abajo en "Ya terminados".
    $('#b-cerrar').onclick = cerrarTrabajo;
    $('#b-detalle').onclick = ()=>{
      const l = $('#log'), abierto = l.style.display !== 'none';
      l.style.display = abierto ? 'none' : 'block';
      $('#b-detalle').textContent = abierto ? 'Ver detalle' : 'Ocultar detalle';
      if(!abierto) l.scrollTop = l.scrollHeight;
    };
    vigilarTarjeta($('#job-caja'));
  }

  const corriendo = j.estado==='corriendo' || j.estado==='pausado';
  const mins = Math.floor(j.segundos/60), segs = j.segundos%60;
  $('#job-caja').className = 'job' + ({error:' err', ok:' fin', corriendo:' aire', pausado:' pausa'}[j.estado] || '');
  // El rótulo del monitor y su timecode: lo que dice la luz y cuánto lleva.
  $('#job-luz').textContent = {corriendo:'Al aire', pausado:'En pausa', ok:'Terminado',
    error:'Fallo', abortado:'Abortado'}[j.estado] || 'Programa';
  $('#job-tc').textContent = [Math.floor(j.segundos/3600), Math.floor(j.segundos/60)%60, j.segundos%60]
    .map(n => String(n).padStart(2,'0')).join(':');
  $('#job-nom').textContent = j.nombre;
  $('#job-estado').textContent = j.estado;
  $('#job-estado').className = 'pill ' + (j.estado==='ok'?'ok':j.estado==='error'?'crit':'acc');
  $('#job-t').textContent = `${mins}:${String(segs).padStart(2,'0')}`;
  $('#b-pausa').style.display = corriendo ? '' : 'none';
  $('#b-abort').style.display = corriendo ? '' : 'none';
  $('#b-cerrar').style.display = corriendo ? 'none' : '';
  $('#b-pausa').textContent = j.estado==='pausado' ? '▶' : '⏸';

  // El paso actual es la última línea con contenido. El HUD del render ya
  // trae el porcentaje entre corchetes: se saca de ahí para la barra en vez
  // de inventar un avance que no se puede saber.
  // El HUD del render escribe varias líneas por vuelta (avance, ETA, RAM):
  // si la última no trae porcentaje, se usa la más reciente de las últimas
  // cuatro que sí lo trae. Si no, la tarjeta enseñaba «ETA: 00:13» con la
  // barra vacía.
  const RE_PCT = /(\d{1,3}(?:\.\d)?)\s*%/;
  const recientes = j.lineas.slice(-4).reverse();
  const ultima = recientes.find(l => RE_PCT.test(l) && !/RAM:|CPU:|Procesador:/.test(l))
    || (j.lineas.length ? j.lineas[j.lineas.length-1] : '(arrancando…)');
  $('#job-paso').textContent = ultima;
  const m = ultima.match(RE_PCT);
  // Con qué se está renderizando, a la vista y con su nombre real: el chip
  // que solo codifica video (MediaCodec), el procesador (libx264) o, en un
  // PC, la tarjeta NVIDIA (NVENC). Sale de la línea de avance.
  const COD = {'chip de video': ['⚡ Chip de video', 'ok', 'MediaCodec: el bloque del teléfono que solo codifica video'],
               'procesador': ['🖥 Procesador', 'idle', 'libx264: por software, con todos los núcleos'],
               'tarjeta NVIDIA': ['⚡ Tarjeta NVIDIA', 'ok', 'NVENC']};
  const cod = $('#job-cod'), c = COD[j.codificador];
  cod.hidden = !c;
  if(c){ cod.textContent = c[0]; cod.className = 'pill ' + c[1]; cod.title = c[2]; }
  // Y cuánto del procesador se come: con el chip no baja a cero, porque
  // subtítulos, tarjeta y recortes se montan igual en el procesador; solo la
  // compresión final se va al chip.
  const uso = $('#job-uso');
  uso.hidden = !corriendo || j.uso_procesador == null;
  if(!uso.hidden) uso.textContent = `🧠 ${j.uso_procesador}% procesador`;
  $('#job-barra').style.width = m ? Math.min(100, parseFloat(m[1])) + '%' : (corriendo ? '' : '100%');
  // Una barra llena al 100% no dice nada que no diga ya la etiqueta "ok":
  // en cuanto termina se va, y queda el resultado a secas.
  $('#job-barra').parentElement.style.display = corriendo ? '' : 'none';

  // La mini repite lo que acaba de calcularse arriba, no lo recalcula: si
  // algún día cambia cómo se saca el porcentaje, cambia en un solo sitio.
  // La barra de abajo es para seguir el avance sin subir: terminado el
  // trabajo no hay avance que seguir, así que desaparece.
  // «¡Trabajo terminado!»: cuando acaba lo último y no queda nada esperando.
  // Mientras hay cola no se dice, porque enseguida arranca lo siguiente.
  const todoAcabado = !corriendo && !((E.cola || []).length);
  const pendientes = (E.videos || []).filter(v => !v.publicado).length;
  const errores = (E.hechos || []).filter(h => h.estado === 'error').length;
  const fin = !todoAcabado ? '' : JSON.stringify([j.estado, pendientes, errores]);
  const cajaFin = $('#job-fin');
  if(cajaFin.dataset.firma !== fin){
    cajaFin.dataset.firma = fin;
    cajaFin.className = !todoAcabado ? '' : 'job-fin' + (j.estado === 'error' || errores ? ' err' : '');
    cajaFin.innerHTML = !todoAcabado ? '' : `
      <span>${j.estado === 'abortado' ? '⏹ Detenido' : j.estado === 'error' ? '⚠ Terminado, con error'
        : errores ? `✅ ¡Trabajo terminado! (${errores} con error, míralo abajo)` : '✅ ¡Trabajo terminado!'}</span>
      ${pendientes ? `<button class="btn sm" onclick="irA('revisar')">Revisar ${pendientes} video${pendientes>1?'s':''} →</button>` : ''}`;
  }
  // Si terminó con el panel en segundo plano, que se note al volver: el
  // título de la pestaña cambia y el teléfono vibra una vez.
  if(hayTrabajo && todoAcabado){
    avisoTerminado(j.estado === 'error' || errores ? '⚠ Terminado con error' : '✅ Trabajo terminado');
  }
  hayTrabajo = corriendo;
  $('#mini-job').className = 'mini' + (j.estado==='error' ? ' err' : (j.estado==='ok' ? ' fin' : ''));
  // La mini habla como la lámpara de la cabecera: «Al aire» en rojo, no
  // el nombre interno del estado.
  $('#mini-estado').textContent = $('#job-luz').textContent;
  $('#mini-estado').className = 'pill ' + ({corriendo:'aire', pausado:'warn', ok:'ok', error:'crit'}[j.estado] || 'idle');
  $('#mini-paso').textContent = ultima;
  $('#mini-t').textContent = $('#job-t').textContent;
  $('#mini-barra').style.width = $('#job-barra').style.width;
  refrescarMini();

  // Solo se repinta si cambió: si no, el botón «Ir a…» se recrearía cada
  // segundo y medio y se perdería el toque a medias.
  // Lo que ya explica un fallo concreto no se repite debajo en general.
  const yaEnFallos = new Set((j.fallos || []).map(f => f.explicacion && f.explicacion.id).filter(Boolean));
  const explicacion = (j.explicacion || []).filter(e => !yaEnFallos.has(e.id));
  const ex = JSON.stringify(explicacion);
  const cajaMod = $('#job-modelos'), fm = JSON.stringify(j.modelos || null);
  if(cajaMod.dataset.firma !== fm){
    cajaMod.dataset.firma = fm;
    cajaMod.innerHTML = bloqueModelos(j.modelos, j.estado==='corriendo' || j.estado==='pausado');
  }
  const cajaFa = $('#job-fallos'), ff = JSON.stringify(j.fallos || []);
  if(cajaFa.dataset.firma !== ff){
    cajaFa.dataset.firma = ff;
    cajaFa.innerHTML = bloqueFallos(j.fallos);
  }
  const cajaEx = $('#job-explica');
  if(cajaEx.dataset.firma !== ex){
    cajaEx.dataset.firma = ex;
    cajaEx.innerHTML = bloqueExplicacion(explicacion);
  }

  const log = $('#log');
  if(log.style.display !== 'none'){
    // Solo sigue el final si ya estabas al final: si subiste a leer algo,
    // que no te lo arrastre hacia abajo en el siguiente refresco.
    const alFinal = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const texto = j.lineas.join('\n');
    if(log.textContent !== texto){
      log.textContent = texto;
      if(alFinal) log.scrollTop = log.scrollHeight;
    }
  }
}

function firmaRevisar(){
  const v = E.videos;
  // La metadata entra en la firma para que al terminar de generarla se vea
  // sola. Pero mientras estés escribiendo en sus campos, el repintado se
  // congela: te borraría lo que llevas escrito a media frase.
  //
  // Solo cuenta el foco en un campo de texto. Incluir los botones dejaba el
  // bloque congelado justo después de pulsar "Guardar" —el foco se queda en
  // el botón— y el resultado del guardado no llegaba a verse.
  const foco = document.activeElement;
  if(foco && foco.matches && foco.matches('#caja-meta input, #caja-meta textarea'))
    return firmas.revisar;
  if(!v.length) return 'vacio';
  // Solo entra el video que estás mirando, NO la lista entera. Terminar de
  // renderizar otro video cambia la lista, y con la lista dentro de esta
  // firma el repintado rehacía el <video>: se te reiniciaba justo mientras
  // lo veías. La tira se actualiza aparte, en pintaTira().
  const a = v[Math.min(elegido, v.length - 1)];
  return ['hay', elegido, a.archivo, a.mtime, a.publicado, a.subido, JSON.stringify(a.meta),
          JSON.stringify(a.calidad), abiertoRehacer, JSON.stringify(finos)].join('~');
}

// La tira de miniaturas, aparte de la ficha y con su propia firma: puede
// crecer mientras un render avanza sin tocar nada de lo que estás usando.
let firmaTiraActual = null;
function pintaTira(){
  const v = E.videos, caja = document.querySelector('#v-revisar .thumbs');
  if(!caja) return;   // la vista aún no está montada (o no hay videos)
  const f = [v.length, elegido,
             v.map(x=>x.archivo+x.mtime+x.subido).join('|')].join('~');
  if(firmaTiraActual === f) return;
  firmaTiraActual = f;

  const enc = document.querySelector('#v-revisar h2');
  if(enc) enc.textContent = `${v.length} video${v.length>1?'s':''} grabado${v.length>1?'s':''}`;
  const ley = document.querySelector('#v-revisar .leyenda');
  if(ley) ley.outerHTML = leyendaSubidos(v);

  const izq = caja.scrollLeft;
  caja.innerHTML = miniaturas(v);
  caja.scrollLeft = izq;   // que no se te vaya al principio al aparecer una
  caja.querySelectorAll('.th').forEach(t =>
    t.onclick = ()=>{ elegido = +t.dataset.i; pintar(); });
}

function miniaturas(v){
  return v.map((x,i)=>`
      <div class="th ${i===elegido?'on':''} ${x.subido?'sub':''}" data-i="${i}"
           title="${x.subido?'ya subido a YouTube':(x.publicado?'rechazado, no se subió':'sin subir')}">
        <div class="im"><img loading="lazy" alt=""
             src="/miniatura/${encodeURIComponent(x.archivo)}?v=${x.mtime||0}"
             onerror="this.remove()"><span>${Math.floor(x.duracion_sec/60)}:${String(Math.round(x.duracion_sec%60)).padStart(2,'0')}</span></div>
        <span class="ck">✓</span>
        <div class="cp">${String(x.numero??i+1).padStart(2,'0')}</div>
      </div>`).join('');
}
function leyendaSubidos(v){
  // El recuento delante de la tira: cuántos quedan es lo que de verdad
  // quieres saber al abrir el panel, y el número lo dice antes de que te
  // pongas a contar miniaturas.
  const subidos = v.filter(x => x.subido).length;
  const faltan = v.length - subidos;
  return `<div class="leyenda">
    <span class="pt"><span class="mu sub">✓</span><b>${subidos}</b> subido${subidos===1?'':'s'}</span>
    <span class="pt"><span class="mu"></span><b>${faltan}</b> sin subir</span>
    ${faltan ? '' : '<span style="color:var(--ok)">todo al día</span>'}
  </div>`;
}

/* Dónde quedan los videos, con un botón para abrir la carpeta en el PC. En
   Android no hay forma fiable de abrir una carpeta desde Termux: allí va la
   ruta y dónde verlos (la Galería los enseña si están en DCIM). */
/* Lo que rindieron las tandas de verdad (concurrencia.py): es lo que usa el
   automático para empezar, y lo que deja comparar un número con otro. */
function bloqueRendimiento(){
  const r = E.rendimiento; if(!r) return '';
  const nums = Object.entries(r.por_numero || {});
  const mejor = nums.length ? Math.max(...nums.map(([, v]) => v.por_hora)) : 0;
  const u = r.ultima;
  return (nums.length ? `<br><b>Tus tandas:</b> <span style="font:11px var(--mono)">${nums.map(([n, v]) =>
      `${v.por_hora === mejor ? '<b>' : ''}${n} a la vez → ${v.por_hora} videos/h${v.por_hora === mejor ? '</b>' : ''}`
      + ` (${v.tandas} tanda${v.tandas === 1 ? '' : 's'})`).join(' · ')}</span>` : '')
    + (u ? `<br><b>Última:</b> ${u.videos} videos, ${u.por_hora}/h, ${u.media} a la vez de media${
        u.maximo !== u.inicial ? ` (empezó en ${u.inicial} y llegó a ${u.maximo})` : ''}.` : '');
}

  const c = E.carpeta_salida;

    <button class="btn sm" data-copiar-salida>Copiar la ruta</button>

}

  // Borrar libera sitio sin salir del panel ni abrir el gestor de archivos.
  // El aviso cambia según esté subido o no: para uno que ya está en YouTube
  // esto es tirar una copia; para uno sin subir es tirar lo único que hay.
  $('#b-borrar').onclick = async ()=>{
    const aviso = a.subido
      ? `¿Borrar «${a.titulo.slice(0,60)}» del ${equipo()}?\n\n`
        + 'Sigue en YouTube: esto solo tira la copia local. Sale de esta lista.'

  // Vaciar de una vez lo que ya está a salvo en YouTube, que es de donde
  // sale el sitio de verdad: uno a uno son diez confirmaciones.
  const bSub = $('#b-borrar-subidos');
  if(bSub) bSub.onclick = async ()=>{
    if(!confirm(`¿Borrar del ${equipo()} los ${subidos} videos que ya están en YouTube?\n\n`
      + 'Siguen en tu canal; esto solo tira las copias locales. Los que no se '
      + 'subieron (y los rechazados) se quedan.')) return;
    try{
      const j = await post('/api/borrar-subidos', {});
      const sitio = j.kb >= 1024 ? (j.kb/1024).toFixed(1) + ' MB' : j.kb + ' KB';
      toast(`${j.borrados} borrados · ${sitio} libres` + (j.fallos ? ` · ${j.fallos} no se pudo` : ''));
      elegido = 0;
      await refrescar();
    }catch(e){ toast(e.message); }
  };

  $('#b-rehacer').onclick = ()=>{ abiertoRehacer = !abiertoRehacer; pintar();
    if(abiertoRehacer) $('#panel-rehacer').scrollIntoView({behavior:'smooth', block:'nearest'}); };
  $('#b-rehacer-no').onclick = ()=>{ abiertoRehacer = false; pintar(); };
  $('#b-rehacer-ya').onclick = ()=>{
    const cuerpo = { historias: String(a.numero||''), rehacer: true };
    if(finos.musica){
      const f = $('#r-musica').value;
      // Sin pista concreta se pide "otra al azar": se excluye la actual
      // eligiendo una distinta de la misma emoción aquí, porque el render
      // sortea de nuevo y podría repetir la que ya tienes.
      const alt = f || otraPistaDe(a.emocion, a.musica);
      if(alt) cuerpo.musica = {[String(a.numero||'*')]: alt};
    }
    if(finos.voz)     cuerpo.voz = $('#r-voz').value;
    if(finos.fondo)   cuerpo.fondo = $('#r-fondo').value;
    if(finos.estilo)  cuerpo.estilo = $('#r-estilo').value;
    if(finos.volumen) cuerpo.volumen_musica = (+$('#r-vol').value / 100).toFixed(2);
    ejecutar('renderizar', cuerpo);
    abiertoRehacer = false;
  };
}
/* ---------- lo que se puede medir del archivo ----------
   Los defectos que no se ven mirando el video por encima: el audio que se
   corta a mitad de frase, el volumen doce decibelios por debajo de lo normal,
   el medio segundo en negro del principio —que además es el fotograma que
   YouTube ofrece como miniatura—. Los mide calidad.py con ffmpeg y aquí solo
   se leen: medirlos es descodificar el video entero y esta ficha se repinta
   sola cada segundo y medio. */
function bloqueCalidad(a){
  const c = a.calidad;
  const caja = (dentro) => `<div class="card" style="background:var(--surface-2);padding:13px">
    <b style="font:10px var(--mono);text-transform:uppercase;letter-spacing:.09em;
       color:var(--ink-faint);display:block;margin-bottom:8px">Cómo salió el archivo</b>
    ${dentro}</div>`;

  // Sin revisar no es lo mismo que revisado y limpio, así que no se pinta
  // un ✓ que nadie ha comprobado.
  if(!c) return caja(`
    <div class="muted" style="margin-bottom:9px">Todavía no se ha medido.</div>
    <button class="btn sm" onclick="ejecutar('calidad')">Revisar los renderizados</button>`);

  const m = c.medidas || {};
  const datos = [`${Math.round(m.duracion||0)}s`, `${m.ancho}x${m.alto}`, `${m.tamano_mb} MB`];
  if(m.lufs != null) datos.push(`${m.lufs.toFixed(1)} LUFS`);

  const resumen = c.hallazgos.length
    ? `${c.fallos ? `<span class="pill crit">${c.fallos} para arreglar</span>` : ''}
       ${c.avisos ? `<span class="pill warn">${c.avisos} aviso${c.avisos>1?'s':''}</span>` : ''}`
    : '<span class="pill ok">sin defectos</span>';

  return caja(`
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:${
      c.hallazgos.length?'10px':'0'}">
      ${resumen}<span class="m">${datos.join('\u00a0· ')}</span>
    </div>
    ${c.hallazgos.map(h=>`<div style="margin-bottom:9px">
      <div style="font-size:13px"><b style="color:var(--${h.nivel==='fallo'?'crit':'warn'})">${
        h.nivel==='fallo'?'❌':'⚠️'}</b> ${esc(h.que)}</div>
      <div class="muted" style="margin-left:19px">${esc(h.arreglo)}</div>
    </div>`).join('')}
    ${bloqueIA(c.ia)}`);
}

/* La opinión de Gemini va aparte y debajo, con su etiqueta: lo de arriba son
   números que no se discuten y esto es un parecer. Mezclarlos haría que uno
   se leyera con la autoridad del otro. */
function bloqueIA(ia){

  const nota = n => `<b style="color:var(--${n>=4?'ok':(n>=3?'warn':'crit')})">${n}/5</b>`;
  return `<div style="${borde}">
    <b style="font:10px var(--mono);text-transform:uppercase;letter-spacing:.09em;
       color:var(--ink-faint);display:block;margin-bottom:8px">Lo que opina Gemini</b>

      <span>Se lee ${nota(ia.legibilidad)}</span>

                                      : '<b style="color:var(--crit)">no cumple</b>'}</span>

    ${ia.titulo_cumple ? '' : `<div class="muted" style="margin-bottom:6px">${esc(ia.titulo_por_que)}</div>`}
    ${(ia.defectos||[]).map(d=>`<div class="muted">· ${esc(d)}</div>`).join('')}

// Vista previa del recorte. El cálculo lo hace el servidor (POST /api/recorte)
// en vez de repetirse aquí en JavaScript: dos implementaciones del mismo
// algoritmo acabarían separándose, y esta vista previa solo sirve si dice
// exactamente lo que se va a subir. El servidor es local, así que preguntar
// cuesta un milisegundo.
let recortePedido = 0, recorteReloj = null;
const recorteCache = new Map();

function pedirRecorte(texto, caja){
  const pinta = (donde, t) => { if(donde) donde.innerHTML =
    `Se pasa de 100. Se subirá recortado por palabras:<br>
     <b style="color:var(--ink)">${esc(t)}</b>`; };

  if(recorteCache.has(texto)){ pinta(caja, recorteCache.get(texto)); return; }

  const token = ++recortePedido;
  caja.textContent = 'Se pasa de 100. Calculando el recorte…';
  clearTimeout(recorteReloj);
  recorteReloj = setTimeout(async ()=>{
    let r;
    try{
      r = await (await fetch('/api/recorte', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({titulo: texto})})).json();
    }catch(e){ return; }   // sin servidor no hay nada que enseñar
    if(token !== recortePedido) return;   // ya escribiste algo más
    recorteCache.set(texto, r.titulo);
    // Puede haber repintado mientras tanto: se busca el div otra vez.
    pinta(document.querySelector('#m-recorte'), r.titulo);
  }, 250);
}

function conectarMeta(a){
  if(!$('#caja-meta')) return;
  const tit = $('#m-titulo'), cuenta = $('#m-cuenta');
  // Copia de trabajo: se edita aquí y solo se manda al guardar, para que un
  // refresco a media escritura no se lleve lo que estabas poniendo.
  let tags = [...(a.meta.hashtags || [])];

  const contar = ()=>{
    // .length de JS ya cuenta en unidades UTF-16, que es como mide YouTube
    // (y como mide largo_youtube en el servidor): coinciden sin convertir.
    const n = tit.value.length;
    cuenta.textContent = `${n}/100`;
    cuenta.style.color = n > 100 ? 'var(--crit)' : (n > 90 ? 'var(--warn)' : 'var(--ink-faint)');

    // Pasarse no es un error: se recorta por palabras. Pero verlo antes de
    // guardar evita la sorpresa de descubrir en YouTube dónde quedó el corte.
    const av = $('#m-recorte');
    if(n > 100){ av.style.display = 'block'; pedirRecorte(tit.value, av); }
    else { av.style.display = 'none'; recortePedido++; }
  };
  tit.oninput = contar; contar();

  const repintaTags = ()=>{
    const caja = $('#m-tags');
    caja.querySelectorAll('.pill').forEach(e=>e.remove());
    const add = $('#m-add');
    tags.forEach(t=>{
      const s = document.createElement('span');
      s.className = 'pill acc';
      s.style.cssText = 'display:inline-flex;gap:6px;align-items:center;text-transform:none;font-size:11.5px;padding:5px 8px';
      s.innerHTML = `#${esc(t)} <b style="cursor:pointer;opacity:.65">×</b>`;
      s.querySelector('b').onclick = ()=>{ tags = tags.filter(x=>x!==t); repintaTags(); };
      caja.insertBefore(s, add);
    });
    add.style.display = tags.length >= 6 ? 'none' : '';
  };
  repintaTags();

  $('#m-add').onclick = ()=>{
    const crudo = prompt('Hashtag (sin #):');
    if(!crudo) return;
    const limpio = crudo.replace(/[^\w]/g, '');
    if(!limpio) return toast('Ese hashtag se queda en nada al limpiarlo');
    if(tags.includes(limpio)) return toast('Ya está');
    if(tags.length >= 6) return toast('Seis es el tope que sube publisher.py');
    tags.push(limpio); repintaTags();
  };

  $('#m-guardar').onclick = async ()=>{
    if(!tit.value.trim()) return toast('El título no puede quedar vacío');
    try{
      await post('/api/metadata/'+encodeURIComponent(a.archivo), {
        titulo_youtube: tit.value,
        descripcion_youtube: $('#m-desc').value,
        hashtags: tags,
      });
      toast('Guardado — se subirá así');
      refrescar();
    }catch(e){ toast(e.message); }
  };
  $('#m-regenerar').onclick = ()=>{
    if(a.meta.origen === 'manual' &&
       !confirm('Lo editaste a mano. Regenerar reemplaza tu texto. ¿Seguir?')) return;
    ejecutar('regenerar_metadata', {numero: a.numero});
  };
}

function otraPistaDe(emocion, evitar){
  const pool = (E.musica||[]).filter(p => p.emocion === emocion && p.archivo !== evitar);
  const alt = pool.length ? pool : (E.musica||[]).filter(p => p.archivo !== evitar);
  return alt.length ? alt[Math.floor(Math.random()*alt.length)].archivo : '';
}

function rangoTexto(){
  const a = [...seleccion].sort((x,y)=>x-y), p=[]; let i=0;
  while(i<a.length){ let j=i; while(j+1<a.length && a[j+1]===a[j]+1) j++;
    p.push(j>i+1 ? a[i]+'-'+a[j] : a.slice(i,j+1).join(',')); i=j+1; }
  return p.join(',');
}
/* Al limpiar la cola, lo que queda se renumera: la 54 pasa a ser la 1. Pero
   lo que has elegido —qué renderizar y qué música— se guarda por número, no
   por historia. Sin esto, después de limpiar la música que le pusiste a la 20
   se la queda la que ahora ocupa el 20, que es otra, y «Renderizar 62» sigue
   diciendo 62 con tres historias en la lista.

   Se recuerda qué título tenía cada número y se suelta lo que dejó de
   coincidir. Perder la elección es lo correcto aquí: el número ya no
   significa lo mismo, y renderizar la historia equivocada se descubre veinte
   minutos después. */
let tituloPorNumero = {};
function olvidarLoQueSeRenumero(){
  const antes = tituloPorNumero;
  tituloPorNumero = {};
  (E.historias || []).forEach(h => { tituloPorNumero[h.n] = h.titulo; });
  Object.keys(antes).forEach(n => {
    if(tituloPorNumero[n] !== antes[n]){ seleccion.delete(+n); delete musicaElegida[n]; }
  });
  [...seleccion].forEach(n => { if(!(n in tituloPorNumero)) seleccion.delete(n); });
  Object.keys(musicaElegida).forEach(n => {
    if(!(n in tituloPorNumero)) delete musicaElegida[n];
  });
}

/* Las historias que Gemini no escribió. 🚫 = Google la bloqueó (con el
   motivo); ⚠ = otro fallo. Al tocarla se despliega el porqué. Las que se
   reintentan siguen en la cola; las descartadas, hasta que se archivan. */
const fallosAbiertos = new Set();
function bloqueFallidos(){
  const f = E.guiones_fallidos || [];
  if(!f.length) return '';
  const fila = x => {
    const e = x.explicacion, fallo = x.fallo || {};
    const estado = x.estado === 'descartada'
      ? '<span class="pill crit">Descartada</span>'
      : `<span class="pill warn">Intento ${x.intentos} de ${x.max}</span>`;
    return `<details class="fallido" data-fallido="${esc(x.id)}" ${fallosAbiertos.has(x.id) ? 'open' : ''}>
      <summary><span class="marca-fallo ${x.bloqueada ? 'bloq' : ''}" aria-hidden="true">${x.bloqueada ? '🚫' : '⚠'}</span>
        <span class="t">${esc(x.titulo || x.id)}</span>${estado}</summary>
      <div class="porque">
        ${e ? `<b>${esc(e.titulo)}</b><p>${esc(e.que_pasa)}</p><p><b>Qué hacer:</b> ${esc(e.que_hacer)}</p>` : ''}
        <div class="crudo">${esc(fallo.texto || '')}</div>
        ${x.fuente ? `<p class="de">Viene de ${esc(x.fuente)}</p>` : ''}
        <button class="btn sm" data-archivar-guion="${esc(x.id)}">📦 Archivar</button>
      </div>
    </details>`;
  };
  const bloq = f.filter(x => x.bloqueada).length;
  return `<div class="list fallidos">
    <div class="list-head"><div><b>Gemini no las escribió</b>
      <div style="font:11.5px var(--mono);color:var(--ink-dim);margin-top:2px">${f.length} historia${f.length>1?'s':''}${bloq ? ` · ${bloq} bloqueada${bloq>1?'s':''} por Google` : ''} · toca una para ver por qué</div></div></div>
    ${f.map(fila).join('')}
  </div>`;
}
document.addEventListener('toggle', ev => {
  const d = ev.target.closest && ev.target.closest('[data-fallido]');
  if(!d) return;
  d.open ? fallosAbiertos.add(d.dataset.fallido) : fallosAbiertos.delete(d.dataset.fallido);
}, true);
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-archivar-guion]');
  if(!b) return;
  b.disabled = true;
  try{ await post('/api/guiones/archivar', {id: b.dataset.archivarGuion}); toast('Archivada'); refrescar(); }
  catch(e){ toast(e.message); b.disabled = false; }
});

function firmaCola(){
  return [filtroCola, JSON.stringify(E.guiones_fallidos || []), E.historias.length, E.historias.map(h=>h.n+h.titulo+(h.renderizada?'✓':'')).join('|'),
          [...seleccion].sort().join(','), JSON.stringify(musicaElegida),
          (E.musica||[]).length, E.candidatos || 0, verGrabadas, E.archivadas || 0,
          E.historias.map(h=>h.larga?1:0).join(''), JSON.stringify(E.bateria && E.bateria.espera)].join('~');
}
/* El aviso de limpiar la cola sale en dos sitios —aquí y en Mantenimiento—
   y dice justo lo que se pierde, que es la numeración. Una sola copia para
   que no se queden diciendo cosas distintas. */
const AVISO_LIMPIAR_COLA =
  "Quita de guion.txt las historias que ya tienen video.\n\nEl texto no se pierde: pasa a guion_historial.txt, y además queda una copia con fecha. Las que quedan se renumeran (un «--historias 44» de antes deja de apuntar a lo mismo).";

/* La cola enseña lo que falta por grabar.

   guion.txt guarda todo lo que Gemini escribió y renderizar no borra nada de
   ahí, así que a las pocas semanas la lista eran decenas de historias ya
   grabadas y había que ir recordando cuáles. Quitarlas de verdad es cosa de
   «Limpiar» (que las pasa al historial); aquí solo se ocultan, que es
   reversible y no renumera nada. */
// «(58)» detrás de «Escribir guiones»: cuántas encontradas esperan guion.
const nCandidatos = () => E.candidatos ? ` (${E.candidatos})` : '';
/* Dos formas de escribir: la tanda que respeta la cuota del día de Gemini
   (MAX_POR_CORRIDA de script_writer) o todos de una vez. Con menos
   candidatos que la tanda, las dos serían lo mismo y sobra el segundo. */
// La confirmación va aquí y no en el onclick: dentro de la plantilla, un
// "\n" se vuelve un salto de línea de verdad en el atributo, y eso rompía el
// JavaScript del botón (pulsarlo no hacía nada).
function escribirTodos(){
  const n = E.candidatos || 0;
  if(!confirm(`¿Escribir los ${n} guiones de una vez?\n\nGasta mucha más cuota de Gemini. `
    + 'Si se agota, sigue con los modelos gratis de respaldo; lo que no salga vuelve a la cola.')) return;
  ejecutar('guiones_todos');
}
function botonesGuiones(destacar){
  const n = E.candidatos || 0, tanda = E.guiones_por_tanda || 12;
  const cls = destacar ? 'btn go' : 'btn';
  if(n <= tanda) return `<button class="${cls}" onclick="ejecutar('guiones')">✍ Escribir guiones${nCandidatos()}</button>`;
  return `<button class="${cls}" title="Escribe ${tanda} y deja el resto para otra tanda, sin agotar la cuota del día"
      onclick="ejecutar('guiones')">✍ Escribir ${tanda} (respeta la cuota)</button>
    <button class="btn" title="Todos de una vez: si Gemini se queda sin cuota, pasa a los modelos de respaldo"
      onclick="escribirTodos()"
      >✍ Escribir todos (${n})</button>`;
}

function pintaCola(){
  const todas = E.historias, cont = $('#v-cola');
  const grabadas = todas.filter(x=>x.renderizada).length;
  const h = verGrabadas ? todas : todas.filter(x=>!x.renderizada);
  // Lo que no se ve tampoco se renderiza: una historia grabada oculta pero
  // marcada saldría en «Renderizar 3,7,12» sin que nadie la vea en la lista.
  if(!verGrabadas) todas.forEach(x=>{ if(x.renderizada) seleccion.delete(x.n); });
  if(!h.length && grabadas && !verGrabadas){
    cont.innerHTML = `<h2>Nada pendiente</h2>
      <p class="sub">Las ${grabadas} historia(s) de la cola ya tienen video.</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn go" onclick="ejecutar('buscar')">🔍 Buscar en Reddit</button>
        ${botonesGuiones(true)}
        <button class="btn" onclick="verGrabadas=true;pintar()">👁 Ver las ya grabadas</button>
        <button class="btn" title="Las pasa al historial y renumera lo que quede"
          onclick="if(confirm(AVISO_LIMPIAR_COLA)) ejecutar('limpiar_cola')">🧹 Limpiar</button>
      </div><div style="margin-top:12px">${bloquePartibles([])}</div>`;
    enlazarArchivadas();
    return;
  }
  if(!h.length){
    // Con candidatos esperando, lo que toca es escribirlos, no buscar más:
    // ese botón pasa a ser el destacado.
    const hay = (E.candidatos || 0) > 0;
    cont.innerHTML = `<h2>Sin historias</h2>
      <p class="sub">${hay
        ? `No queda ninguna por grabar, pero hay ${E.candidatos} encontrada${E.candidatos>1?'s':''} esperando guion.`
        : 'No queda ninguna por grabar. Busca historias en Reddit o YouTube y conviértelas en guiones.'}</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn ${hay?'':'go'}" onclick="ejecutar('buscar')">🔍 Buscar en Reddit</button>
        <button class="btn ${hay?'':'go'}" onclick="ejecutar('buscar_youtube')">▶️ Buscar en YouTube</button>
        ${botonesGuiones(hay)}
        <button class="btn" onclick="ejecutar('diagnostico_busqueda')">🩺 ¿Por qué no hay historias?</button>
        <button class="btn" onclick="abrirDiccionario()">📖 Errores</button>
      </div><div style="margin-top:12px">${bloquePartibles([])}</div>`;
    enlazarArchivadas();
    return;
  }
  // De entrada, las tres primeras que se pueden grabar tal cual: una larga
  // marcada por defecto se aplazaría al grabar sin producir nada.
  if(!tocado && !seleccion.size) h.filter(x=>!x.larga).slice(0,3).forEach(x=>seleccion.add(x.n));
  const pistas = E.musica || [];
  const elegidas = h.filter(x=>seleccion.has(x.n));

  // El scroll de la lista se guarda y se repone: sin esto, repintar mientras
  // recorres las historias te devuelve al principio de la lista.
  const cajaPrevia = cont.querySelector('#caja-lista');
  const scrollPrevio = cajaPrevia ? cajaPrevia.scrollTop : 0;

  // Los candidatos que trajeron los buscadores no son historias todavía:
  // están en candidatos.json esperando a que Gemini les escriba el guion.
  // Antes esto no se veía en ningún sitio, así que buscar en Reddit parecía
  // no traer nada: la lista seguía enseñando las mismas de siempre.
  const esperando = E.candidatos || 0;
  const cortas = h.filter(x=>!x.larga), largasH = h.filter(x=>x.larga);

    <div class="list">
      <div class="list-head">
        <div><b>${filtroCola === 'videos' ? 'Videos largos' : filtroCola === 'shorts' ? 'Shorts para grabar' : 'Elige cuáles grabar'}</b><div id="cuenta" style="font:11.5px var(--mono);color:var(--ink-dim);margin-top:2px"></div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">

        </div>
      </div>
      ${filtroCola === 'videos' ? `<div class="m" style="padding:8px 14px 0">Mientras los largos estén

      ${!hv.length ? `<div class="m" style="padding:12px 14px">${filtroCola === 'videos'

          <span class="m">${esc(x.emocion).slice(0,5)}</span>
          <span class="m" title="voz ${x.genero==='femenino'?'femenina (Dalia)':'masculina (Jorge)'}"

        </label>`).join('')}</div>

        <code class="equiv" id="equiv" style="display:none"></code>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn" onclick="ejecutar('buscar')">🔍 Buscar en Reddit</button>
          <button class="btn" onclick="ejecutar('buscar_youtube')">▶️ Buscar en YouTube</button>
          ${botonesGuiones(false)}
          <button class="btn" onclick="ejecutar('diagnostico_busqueda')">🩺 Diagnóstico</button>
          <button class="btn" onclick="abrirDiccionario()">📖 Errores</button>
          <button class="btn" title="Quita las que ya tienen video. Para verlas antes sin tocar nada: Ajustes → Tareas"
            onclick="if(confirm(AVISO_LIMPIAR_COLA)) ejecutar('limpiar_cola')">🧹 Limpiar</button>
          <button class="btn go" id="b-render">▶ Grabar</button>

    ${!pistas.length ? `<div class="aviso warn"><span>⚠</span><div>No hay pistas descargadas.
      Ve a <b>Ajustes → Música y video</b> y actualízalas, o los videos saldrán sin fondo musical.</div></div>`
    : !elegidas.length ? `<div class="aviso"><span>·</span><div>Selecciona historias arriba para elegirles música.</div></div>`
    : `<p class="sub">Por omisión sale una al azar de la emoción que detectó el guion. Si eliges
       una a mano, óyela antes — así no descubres que no pegaba después de esperar el render.
       Lo que dejes en «al azar» sigue funcionando sin ti, que es lo que necesita el cron.</p>
    <div class="list">${elegidas.map(x=>`
      <div class="row" style="grid-template-columns:26px 1fr auto auto">
        <span class="n">${String(x.n).padStart(2,'0')}</span>
        <select class="btn sm" data-mus="${x.n}" style="min-width:0">
          <option value="">al azar · ${esc(x.emocion)}</option>
          ${pistas.map(p=>`<option value="${esc(p.archivo)}" ${musicaElegida[x.n]===p.archivo?'selected':''}>
            ${esc(p.emocion)} · ${esc(p.titulo || p.archivo.replace(/^musica_[a-z]*_|\.mp3$/g,''))}</option>`).join('')}
        </select>
        <button class="btn sm" data-oir-fila="${x.n}" title="Oír la pista" style="padding:6px 9px">▶</button>
        <span class="m">${musicaElegida[x.n] ? 'fijada' : 'auto'}</span>
      </div>`).join('')}</div>`}`;

  const caja = cont.querySelector('#caja-lista');
  if(caja) caja.scrollTop = scrollPrevio;

  const sync = ()=>{
    $('#cuenta').textContent = `${seleccion.size} de ${h.length} seleccionadas`;
    $('#equiv').textContent = seleccion.size ? '--historias '+rangoTexto() : 'nada seleccionado';

    b.textContent = seleccion.size ? `▶ Grabar ${seleccion.size}` : '▶ Grabar';
    b.disabled = !seleccion.size;
  };
  cont.querySelectorAll('.row.sel').forEach(r=>{
    r.querySelector('input').onchange = e=>{
      tocado = true;
      const n = +r.dataset.n;
      e.target.checked ? seleccion.add(n) : seleccion.delete(n);
      r.classList.toggle('on', e.target.checked);
      sync(); pintar();
    };
  });
  cont.querySelectorAll('[data-mus]').forEach(s => s.onchange = ()=>{
    const n = s.dataset.mus;
    if(s.value) musicaElegida[n] = s.value; else delete musicaElegida[n];
    pintar();
  });
  cont.querySelectorAll('[data-oir-fila]').forEach(b => b.onclick = ()=>{
    const n = b.dataset.oirFila;
    const f = musicaElegida[n] || (E.historias.find(x=>x.n==n)
      ? otraPistaDe(E.historias.find(x=>x.n==n).emocion, null) : '');
    if(!f) return toast('No hay pista que oír');
    oir(f, b);
  });
  cont.querySelectorAll('[data-partir]').forEach(b => b.onclick = ()=>{
    if(!confirm(`¿Partir esta historia en ${b.dataset.partes} shorts seguidos?\n\nEl texto no cambia: solo se corta entre frases. `
      + 'La original queda guardada entera en el historial.')) return;
    ejecutar('partir_una', {numero: +b.dataset.partir});
  });
  enlazarArchivadas();
  cont.querySelectorAll('[data-filtro]').forEach(b => b.onclick = ()=>{ filtroCola = b.dataset.filtro; pintar(); });
  // «Todas» marca las de la pestaña que se ve, no las escondidas.
  $('#q-todas').onclick = ()=>{ tocado=true; hv.forEach(x=>seleccion.add(x.n)); pintar(); };
  $('#q-ning').onclick  = ()=>{ tocado=true; seleccion.clear(); pintar(); };
  $('#b-render').onclick = ()=>{
    const mus = {};
    for(const n of seleccion) if(musicaElegida[n]) mus[String(n)] = musicaElegida[n];
    ejecutar('renderizar', {historias: rangoTexto(), musica: mus});
  };
  sync();
  pintaBotonesOir();
}

/* =========================================================
   ESTILO
   ========================================================= */
const DESCR = {
  predeterminado:'Frase completa; solo las palabras con carga se pintan, rotando colores.',
  verde_fijo:'Todas las palabras activas del mismo verde, sin rotación.',
  amarillo_clasico:'Karaoke por relleno: lo ya dicho se queda amarillo.',
  una_palabra:'Una palabra a la vez con rebote, un solo color.',
  sobrio:'Sin color: la palabra activa solo crece. Lo más discreto.',
  alto_contraste:'Bebas Neue, resalte rojo, menos palabras por frase.',
  palabras_clave:'Una palabra a la vez, algunas pintadas rotando. El del video de referencia.'
};
/* El editor vive aquí y no en el DOM: mientras está abierto, lo que escribes
   se queda en los inputs, y la firma solo cambia al abrirlo o cerrarlo. Así un
   refrescar() de los que corren cada 1,5s no te borra lo que ibas poniendo. */
let editorEstilo = null;   // null = cerrado; {base, nombre} = abierto

function firmaEstilo(){
  return [JSON.stringify(E.subtitulos), JSON.stringify(E.presets_propios||{}),
          (E.previsualizaciones||[]).join(','),
          editorEstilo ? 'editando:'+editorEstilo.base+':'+editorEstilo.nombre : ''].join('~');
}

/* Los valores con los que arranca el formulario: los del estilo que se está
   copiando, ya resueltos (defaults -> preset), que es lo que se ve en pantalla. */
function valoresDe(nombre){
  const propio = (E.presets_propios||{})[nombre];
  // El activo ya viene resuelto del servidor; de los demás solo llegan las
  // claves que cambian, así que el resto se completa con el activo.
  const base = Object.assign({}, E.subtitulos);
  delete base.preset;
  return nombre === (E.subtitulos.preset||'predeterminado') ? base
       : Object.assign(base, propio || {});
}

function campoColor(clave, etiqueta, valor, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <input type="color" data-k="${clave}" value="${esc(valor)}"></div>`;
}
function campoRango(clave, etiqueta, valor, min, max, sufijo, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <div class="slider"><input type="range" data-k="${clave}" data-num="1" min="${min}" max="${max}" step="1" value="${valor}">
      <span class="v">${valor}${sufijo||''}</span></div></div>`;
}
function campoSiNo(clave, etiqueta, valor, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <button class="btn sm" data-k="${clave}" data-bool="${valor?'1':'0'}">${valor?'sí':'no'}</button></div>`;
}
function campoLista(clave, etiqueta, valor, opciones, nota){
  return `<div class="campo"><label>${etiqueta}${nota?`<div class="m muted">${nota}</div>`:''}</label>
    <select class="btn sm" data-k="${clave}">${opciones.map(o=>
      `<option value="${esc(o)}" ${o===valor?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
}

function pintaEditorEstilo(){
  const op = E.estilo_opciones || {estilos:[], repartos:[], fuentes:[]};
  const v = valoresDe(editorEstilo.base);
  const fuenteConocida = (op.fuentes||[]).includes(v.fuente);
  const paleta = (v.colores_resalte||[]);
  return `
    <h3 class="sec">${editorEstilo.nuevo ? 'Estilo nuevo' : 'Editando «'+esc(editorEstilo.nombre)+'»'}</h3>
    <p class="sub">Parte de «${esc(editorEstilo.base)}». Al guardarlo queda activo y se usa en el próximo render.</p>
    <div class="list" id="editor-estilo">
      <div class="campo"><label>Nombre<div class="m muted">minúsculas y guion bajo</div></label>
        <input type="text" id="e-nombre" value="${esc(editorEstilo.nombre)}"
               placeholder="mi_estilo" autocapitalize="none" spellcheck="false"></div>

      ${campoLista('estilo','Tipo', v.estilo, op.estilos,
        'frase_activa: frase con una palabra resaltada · relleno: karaoke · pop: una palabra sola')}

      <div class="campo"><label>Fuente<div class="m muted">las cuatro vienen en el repo</div></label>
        <select class="btn sm" data-k="fuente" id="e-fuente">
          ${(op.fuentes||[]).map(f=>`<option value="${esc(f)}" ${f===v.fuente?'selected':''}>${esc(f)}</option>`).join('')}
          <option value="__otra" ${fuenteConocida?'':'selected'}>otra (escribirla)</option>
        </select></div>
      <div class="campo" id="e-fuente-otra" style="${fuenteConocida?'display:none':''}">
        <label>Nombre de la familia<div class="m muted">tal como la busca libass; si no existe, sustituye sola</div></label>
        <input type="text" id="e-fuente-libre" value="${fuenteConocida?'':esc(v.fuente||'')}"
               placeholder="Impact" spellcheck="false"></div>

      ${campoColor('color_texto','Color del texto', v.color_texto)}
      ${campoColor('color_activo','Color de la palabra activa', v.color_activo, 'solo si no hay paleta')}
      ${campoColor('color_borde','Color del borde', v.color_borde)}

      <div class="campo"><label>Paleta de resalte
          <div class="m muted">con 2 o más, el color va rotando; vacía, se usa el de arriba</div></label>
        <div class="paleta" id="e-paleta">
          ${paleta.map((c,i)=>`<span><input type="color" data-paleta="1" value="${esc(c)}">
            <span class="quita" data-quita="${i}">×</span></span>`).join('')}
          <button class="btn sm" id="e-mas-color">＋</button></div></div>

      ${campoSiNo('resaltar_solo_clave','Solo palabras con carga', v.resaltar_solo_clave,
        'las de relleno («que», «la») no se pintan')}
      ${campoRango('min_letras_resalte','Letras mínimas para pintar', v.min_letras_resalte, 1, 12)}

      ${campoRango('palabras_por_frase_short','Palabras por frase (short)', v.palabras_por_frase_short, 1, 8, '',
        v.estilo==='pop' ? 'con «pop» no se usa: siempre es una' : '')}
      ${campoRango('palabras_por_frase_largo','Palabras por frase (largo)', v.palabras_por_frase_largo, 1, 10)}
      ${campoRango('tamano_short','Tamaño en shorts', v.tamano_short, 40, 160, ' px')}
      ${campoRango('tamano_largo','Tamaño en largos', v.tamano_largo, 40, 200, ' px')}
      ${campoRango('escala_activa','Cuánto crece la activa', v.escala_activa, 100, 160, '%')}
      ${campoRango('grosor_borde','Grosor del borde', v.grosor_borde, 0, 20)}
      ${campoRango('sombra','Sombra', v.sombra, 0, 10)}

      ${campoSiNo('mayusculas','Mayúsculas', v.mayusculas)}
      ${campoSiNo('italica','Itálica', v.italica)}
      ${campoLista('reparto_respaldo','Reparto del respaldo', v.reparto_respaldo, op.repartos,
        'solo si edge-tts no da el tiempo por palabra')}
    </div>
    <div style="display:flex;gap:7px;margin-top:12px">
      <button class="btn go" id="e-guardar">Guardar y activar</button>
      <button class="btn" id="e-cancelar">Cancelar</button>
    </div>`;
}

function pintaEstilo(){
  const s = E.subtitulos, act = s.preset || 'predeterminado';
  const paleta = (s.colores_resalte||[]);
  const propios = Object.keys(E.presets_propios||{});
  const todos = E.presets.concat(propios.filter(p=>!E.presets.includes(p)));
  $('#v-estilo').innerHTML = `
    <h2>Estilo de subtítulos</h2>
    <p class="sub">Cambiarlo escribe el preset en config.json. Aplica al próximo render, no a lo ya hecho.</p>
    <div class="presets">${todos.map(p=>`
      <div class="preset ${p===act?'on':''}" data-p="${p}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <h4>${p}</h4>${p===act?'<span class="pill acc">Activo</span>'
            : (propios.includes(p)?'<span class="pill">tuyo</span>':'')}
        </div>
        <div class="muted">${esc(DESCR[p]|| (propios.includes(p)?'Hecho por ti.':''))}</div>
        ${propios.includes(p)?`<div style="display:flex;gap:6px;margin-top:2px">
          <button class="btn sm" data-editar="${esc(p)}">✎</button>
          <button class="btn sm" data-borrar="${esc(p)}">🗑</button></div>`:''}
      </div>`).join('')}</div>

    ${editorEstilo ? pintaEditorEstilo() : `
      <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px">
        <div class="muted" style="flex-grow:1">Copia el activo y cámbiale lo que quieras: tipo, fuente,
          colores, tamaños. Se guarda con nombre propio en config.json y sale en la comparación.</div>
        <button class="btn go" id="b-estilo-nuevo">✎ Crear estilo</button>
      </div>`}

    <h3 class="sec">Qué usa el activo</h3>
    <div class="list">
      <div class="row" style="grid-template-columns:1fr auto"><span>Estilo</span><span class="m">${esc(s.estilo)}</span></div>
      <div class="row" style="grid-template-columns:1fr auto"><span>Fuente</span><span class="m">${esc(s.fuente)}${s.italica?' · itálica':''}</span></div>
      <div class="row" style="grid-template-columns:1fr auto"><span>Colores de resalte</span>
        <span>${paleta.length>1 ? paleta.map(c=>`<span class="sw" style="background:${esc(c)}"></span>`).join(' ')
              : `<span class="sw" style="background:${esc(s.color_activo)}"></span>`}</span></div>
      <div class="row" style="grid-template-columns:1fr auto"><span>Solo palabras con carga</span>
        <span class="m">${s.resaltar_solo_clave ? 'sí, de '+s.min_letras_resalte+'+ letras' : 'no, todas'}</span></div>
      <div class="row" style="grid-template-columns:1fr auto"><span>Palabras en pantalla</span>
        <span class="m">${s.estilo==='pop' ? '1' : s.palabras_por_frase_short+' / '+s.palabras_por_frase_largo}</span></div>
      <div class="row" style="grid-template-columns:1fr auto">
        <span>Reparto del respaldo<div class="m">Solo si edge-tts no da el tiempo por palabra</div></span>
        <span class="m">${s.reparto_respaldo === 'proporcional' ? 'por letras' : 'partes iguales'}</span></div>
    </div>

    <h3 class="sec">Comparar sobre tu gameplay</h3>
    <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="muted" style="flex-grow:1">Renderiza el mismo momento con cada estilo —los del repo y los tuyos—
        y los enseña aquí abajo. También quedan como PNG en la carpeta de videos.</div>
      <button class="btn go" onclick="ejecutar('previsualizar')">Generar comparación</button>
    </div>
    ${(E.previsualizaciones||[]).length ? `
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
        ${E.previsualizaciones.map(f=>`
          <div>
            <div class="m muted" style="margin-bottom:5px">${esc(f.replace(/\.png$/,'').replace(/^_/,''))}</div>
            <img src="/previsualizacion/${encodeURIComponent(f)}" alt="${esc(f)}" loading="lazy"
                 style="width:100%;border:1px solid var(--line);border-radius:9px;display:block">
          </div>`).join('')}
      </div>`
      : `<div class="muted" style="margin-top:10px">Todavía no hay muestras. El botón tarda un
         minuto y hace falta ffmpeg.</div>`}`;

  document.querySelectorAll('.preset').forEach(el=>{
    el.onclick = async (ev)=>{
      // Los botones de ✎ y 🗑 viven dentro de la tarjeta: sin esto, tocarlos
      // activaría además el preset, que no es lo que pediste.
      if(ev.target.closest('[data-editar],[data-borrar]')) return;
      try{ await post('/api/preset',{preset:el.dataset.p});
        toast('Estilo: '+el.dataset.p); refrescar();
      }catch(e){ toast(e.message); }
    };
  });

  document.querySelectorAll('[data-editar]').forEach(b=>{
    b.onclick = ()=>{ const n = b.dataset.editar;
      editorEstilo = {base:n, nombre:n, nuevo:false}; pintar(); };
  });
  document.querySelectorAll('[data-borrar]').forEach(b=>{
    b.onclick = async ()=>{
      const n = b.dataset.borrar;
      if(!confirm('¿Borrar el estilo «'+n+'»?\n\nLos videos ya renderizados no cambian.')) return;
      try{ const j = await post('/api/estilo/borrar',{nombre:n});
        toast(j.volvio_al_predeterminado ? 'Borrado; vuelve el predeterminado' : 'Borrado: '+n);
        refrescar();
      }catch(e){ toast(e.message); }
    };
  });

  const bNuevo = $('#b-estilo-nuevo');
  if(bNuevo) bNuevo.onclick = ()=>{
    const base = E.subtitulos.preset || 'predeterminado';
    editorEstilo = {base, nombre:'', nuevo:true}; pintar();
  };

  if(editorEstilo) conectarEditorEstilo();
}

function conectarEditorEstilo(){
  // Los rangos enseñan su número al moverlos; el resto se lee al guardar.
  document.querySelectorAll('#editor-estilo input[type=range]').forEach(r=>{
    const v = r.parentElement.querySelector('.v');
    const sufijo = (v.textContent.match(/[^0-9]+$/)||[''])[0];
    r.oninput = ()=>{ v.textContent = r.value + sufijo; };
  });
  document.querySelectorAll('#editor-estilo [data-bool]').forEach(b=>{
    b.onclick = ()=>{ const ahora = b.dataset.bool === '1';
      b.dataset.bool = ahora ? '0' : '1'; b.textContent = ahora ? 'no' : 'sí'; };
  });

  const selFuente = $('#e-fuente');
  selFuente.onchange = ()=>{
    $('#e-fuente-otra').style.display = selFuente.value === '__otra' ? '' : 'none';
  };

  $('#e-mas-color').onclick = ()=>{
    const cont = $('#e-paleta');
    if(cont.querySelectorAll('[data-paleta]').length >= 8) return toast('Ocho colores es el tope');
    const hueco = document.createElement('span');
    hueco.innerHTML = '<input type="color" data-paleta="1" value="'+
      (E.subtitulos.color_activo||'#3BF07A')+'"> <span class="quita">×</span>';
    hueco.querySelector('.quita').onclick = ()=> hueco.remove();
    cont.insertBefore(hueco, $('#e-mas-color'));
  };
  document.querySelectorAll('#e-paleta .quita').forEach(x=>{
    x.onclick = ()=> x.parentElement.remove();
  });

  $('#e-cancelar').onclick = ()=>{ editorEstilo = null; pintar(); };
  $('#e-guardar').onclick = guardarEstilo;
}

function leerEditorEstilo(){
  const valores = {};
  document.querySelectorAll('#editor-estilo [data-k]').forEach(el=>{
    const k = el.dataset.k;
    if(el.dataset.bool !== undefined)      valores[k] = el.dataset.bool === '1';
    else if(el.dataset.num !== undefined)  valores[k] = parseInt(el.value, 10);
    else                                   valores[k] = el.value;
  });
  if(valores.fuente === '__otra') valores.fuente = ($('#e-fuente-libre').value||'').trim();
  valores.colores_resalte = [...document.querySelectorAll('#e-paleta [data-paleta]')].map(i=>i.value);
  return valores;
}

async function guardarEstilo(){
  const nombre = ($('#e-nombre').value||'').trim().toLowerCase().replace(/\s+/g,'_');
  if(!/^[a-z0-9_]{1,32}$/.test(nombre))
    return toast('El nombre va en minúsculas, sin acentos ni espacios');
  const valores = leerEditorEstilo();
  if(!valores.fuente) return toast('Falta el nombre de la fuente');
  try{
    const j = await post('/api/estilo/guardar',{nombre, valores, activar:true});
    editorEstilo = null;
    toast('Estilo «'+j.nombre+'» guardado y activo');
    refrescar();
  }catch(e){ toast(e.message); }
}

function estadoPublicacion(x){
  // Se distingue "lo pedimos y YouTube lo aplicó" de "lo pedimos y no".
  // Antes solo se enseñaba lo que habíamos pedido, así que un video ya
  // público seguía apareciendo como "programado" y nada lo delataba.
  if(x.programado_ok === false)
    return `<span style="color:var(--crit)">⛔ YouTube no respetó la ventana` +
           (x.privacidad_real ? ` — quedó ${esc(x.privacidad_real)}` : '') + `</span>`;
  if(x.publish_at) return 'programado ' + esc(x.publish_at.slice(0,16).replace('T',' '));
  return 'público';
}

function datosPublicado(x){
  // Todo en una linea debajo del titulo, con su etiqueta al lado del numero.
  // Antes iba en columnas, y en un telefono las columnas dejaban al titulo
  // unos 80 px: ninguna fila se distinguia de la siguiente.
  // Los espacios duros no son decoracion: sin ellos la linea parte entre el
  // numero y la palabra, y queda un "1770" solo al final de un renglon.
  const d = [estadoPublicacion(x)];
  // Falta el dato no es lo mismo que cero vistas: un video borrado a mano, con
  // las estadisticas ocultas o subido despues de la ultima lectura no aparece
  // en vistas.json, y ensenar "0" ahi seria inventarselo.
  d.push(x.vistas === null || x.vistas === undefined
    ? '<span title="Sin leer todavía: pestaña Canal → Releer vistas">vistas&nbsp;sin&nbsp;leer</span>'
    : `<b style="color:var(--ink);font-variant-numeric:tabular-nums">${x.vistas.toLocaleString('es')}</b>&nbsp;vistas`);
  if(x.borrado_local) d.push(`borrado&nbsp;del&nbsp;${equipo()}`);
  else if(x.dias_restantes !== null) d.push(`${x.dias_restantes}d&nbsp;en&nbsp;el&nbsp;${equipo()}`);
  return d;
}

/* =========================================================
   CANAL

   Lo que pasó después de publicar: cuántas vistas tiene cada video de
   verdad, cuáles la revisión quincenal daría por muertos, y si ya toca
   volver a hacer largos.

   Las vistas no se piden aquí. Las deja relanzar.py en vistas.json y esto
   las pinta: pintar una pestaña no puede depender de que haya cobertura, y
   la API de YouTube tiene cuota diaria. Por eso se ve la fecha de la última
   lectura y hay un botón para releerlas.
   ========================================================= */
function firmaCanal(){ return JSON.stringify(E.canal || null); }

function haceCuanto(iso){
  if(!iso) return null;
  const min = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(min < 2) return 'ahora mismo';
  if(min < 60) return `hace ${min} min`;
  const h = Math.round(min/60);
  if(h < 24) return `hace ${h} h`;
  const d = Math.round(h/24);
  return d === 1 ? 'ayer' : `hace ${d} días`;
}

/* Lo que YouTube quitó, rechazó o limitó. Solo avisa: volver a subir un
   video que YouTube quitó por un clip de fondo puede costar otra
   advertencia, así que qué hacer lo decides tú. Lo llena la revisión del 1
   y 15 (relanzar.py --problemas) o el botón de aquí. */
const PROBLEMA_YT = {quitado: ['⛔', 'Quitado', 'crit'], rechazado: ['⛔', 'Rechazado', 'crit'],
  fallido: ['⚠', 'Roto', 'crit'], restringido: ['🔞', 'Solo +18', 'warn'],
  bloqueado: ['🌐', 'Bloqueado en países', 'warn']};
function bloqueProblemasYoutube(c){
  const ps = c.problemas || [];
  const cuando = haceCuanto(c.problemas_cuando);
  const pie = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px">
      <span class="m" style="flex-grow:1">${cuando ? `Mirado ${cuando}.` : 'Todavía no se ha mirado.'}
        Se mira solo los días 1 y 15.</span>
      <button class="btn sm" onclick="ejecutar('problemas_youtube')">🔎 Mirar ahora</button></div>`;
  if(!ps.length) return `<div class="card" style="margin-bottom:14px">
      <div class="muted">✓ YouTube no ha quitado ni limitado ningún video.</div>${pie}</div>`;
  return `<div class="aviso crit" style="margin-bottom:14px"><span>⛔</span><div style="flex-grow:1">
    <b>YouTube quitó o limitó ${ps.length === 1 ? 'un video' : ps.length + ' videos'}.</b>
    No se borra ni se vuelve a subir nada solo. Si fue por un clip de fondo, quita ese tramo
    antes de rehacer la historia; si crees que es un error, se puede apelar desde Studio.
    <div class="list" style="margin-top:9px">${ps.map(x => {
      const [ico, txt, tono] = PROBLEMA_YT[x.tipo] || ['·', x.tipo, 'idle'];
      return `<div class="row" style="grid-template-columns:1fr auto">
        <div style="min-width:0"><div class="t dos">${ico} ${esc(x.titulo)}</div>
          <div class="meta"><span class="pill ${tono}">${esc(txt)}</span>
            <span class="m">${esc(x.detalle)}</span></div>
          <div class="acciones-aviso">
            <a class="btn sm" href="${esc(x.url)}" target="_blank" rel="noopener">Abrir en Studio ↗</a>
            <button class="btn sm" onclick="irA('ajustes/material'); abrirFondos()">✂ Tramos de fondo</button>

}

/* Pantalla de publicación de TikTok. La pide su guía de revisión: tiene que
   verse a qué cuenta va, la privacidad hay que elegirla a mano (sin valor por
   defecto), los permisos respetan lo que la cuenta admite, y la declaración de
   contenido comercial enseña el aviso legal que toque. */
let creadorTk = null;

const TK_ETIQUETA = {PUBLIC_TO_EVERYONE:'Público', MUTUAL_FOLLOW_FRIENDS:'Amigos',
                     FOLLOWER_OF_CREATOR:'Seguidores', SELF_ONLY:'Solo yo (privado)'};

async function abrirTiktok(nombre){
  const caja = $('#tk-form-'+CSS.escape(nombre));
  if(!caja) return;
  if(caja.innerHTML){ caja.innerHTML=''; return; }
  caja.innerHTML = '<div class="muted" style="padding:10px 13px">Preguntando a TikTok qué permite tu cuenta…</div>';

  if(!creadorTk){
    const r = await fetch('/api/tiktok/creador');
    const d = await r.json();
    if(!d.ok){ caja.innerHTML = '<div class="aviso crit"><span>⛔</span><div>'+esc(d.error||'')+'</div></div>'; return; }
    creadorTk = d.creador;
  }
  const c = creadorTk;
  const previo = (E.tiktok.pendientes.find(p=>p.nombre===nombre)||{}).opciones || null;
  const n = esc(nombre);

  caja.innerHTML = `
    <div class="card" style="margin:8px 13px 13px;background:var(--surface-2)">
      <div class="muted" style="margin-bottom:12px">
        TikTok exige que estas decisiones se tomen una por una, sin valores por
        defecto. Nada se publica hasta que guardes.
      </div>

      <div style="display:flex;align-items:center;gap:8px;padding-bottom:11px;
                  border-bottom:1px solid var(--line)">
        <span class="pill acc">Cuenta</span>
        <b>@${esc(c.creator_username||'')}</b>
        <span class="m">${c.creator_nickname?esc(c.creator_nickname):''}</span>
      </div>

      <div style="margin-top:13px">
        <label for="tk-priv-${n}"><b>1 · ¿Quién puede verlo?</b></label>
        <select id="tk-priv-${n}" class="btn" style="width:100%;margin-top:5px"
                onchange="revisaTiktok('${n}')">
          <option value="">— elige una opción —</option>
          ${(c.privacy_level_options||[]).map(o=>`<option value="${esc(o)}"
            ${previo && previo.privacidad===o?'selected':''}>${esc(TK_ETIQUETA[o]||o)}</option>`).join('')}
        </select>
      </div>

      <div style="margin-top:15px">
        <b>2 · ¿Qué permites a quien lo vea?</b>
        <div class="finos" style="margin-top:6px">
          ${[['comentarios','Comentarios',c.comment_disabled],
             ['dueto','Dúo',c.duet_disabled],
             ['stitch','Stitch',c.stitch_disabled]].map(([k,txt,off])=>`
            <label class="fino ${off?'no':''}">
              <input type="checkbox" id="tk-${k}-${n}" ${off?'disabled':''}
                ${previo && previo[k] && !off ? 'checked':''}>
              <span>${txt}${off?'<br><span class="m">apagado en tu cuenta</span>':''}</span>
            </label>`).join('')}
        </div>
      </div>

      <div style="margin-top:15px">
        <b>3 · ¿Promociona algo?</b>
        <label class="fino" style="margin-top:6px">
          <input type="checkbox" id="tk-com-${n}"
            ${previo && previo.comercial && previo.comercial.activo?'checked':''}
            onchange="document.getElementById('tk-com-caja-${n}').hidden=!this.checked;revisaTiktok('${n}')">
          <span>Sí, este vídeo promociona algo</span>
        </label>
        <div id="tk-com-caja-${n}" class="sangria"
             ${previo && previo.comercial && previo.comercial.activo?'':'hidden'}>
          <label class="fino"><input type="checkbox" id="tk-marca-${n}"
            onchange="revisaTiktok('${n}')"
            ${previo && previo.comercial && previo.comercial.marca_propia?'checked':''}>
            <span>Mi propia marca<br><span class="m">se etiqueta «Contenido promocional»</span></span></label>
          <label class="fino"><input type="checkbox" id="tk-patro-${n}"
            onchange="revisaTiktok('${n}')"
            ${previo && previo.comercial && previo.comercial.patrocinado?'checked':''}>
            <span>Contenido patrocinado<br><span class="m">se etiqueta «Colaboración pagada»</span></span></label>
          <div class="muted">
            <a href="https://www.tiktok.com/legal/page/global/bc-policy/es" target="_blank" rel="noopener">Política de contenido de marca ↗</a>
            · <a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/es" target="_blank" rel="noopener">Uso de música ↗</a></div>
        </div>
      </div>

      <div id="tk-alerta-${n}" style="margin-top:13px"></div>
      <div style="margin-top:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn go" id="tk-ok-${n}" onclick="guardarTiktok('${n}')">Guardar y dejar listo</button>
        <button class="btn" onclick="abrirTiktok('${n}')">Cerrar</button>
        <span class="m" id="tk-msg-${n}"></span>
      </div>
    </div>`;
  revisaTiktok(nombre);
}

/* Las mismas reglas que valida el servidor, pero dichas antes de pulsar
   Guardar: enterarse de que el patrocinio no puede ser privado *después* de
   rellenar el formulario es justo lo que hacia opaca esta pantalla. */
function tkFallo(nombre){
  const v = id => document.getElementById(id+'-'+nombre);
  if(!v('tk-priv').value) return 'Elige quién puede verlo.';
  if(v('tk-com').checked){
    if(!v('tk-marca').checked && !v('tk-patro').checked)
      return 'Marca si es tu marca, contenido patrocinado, o las dos.';
    if(v('tk-patro').checked && v('tk-priv').value === 'SELF_ONLY')
      return 'El contenido patrocinado no puede ser privado: elige otra visibilidad.';
  }
  return '';
}

function revisaTiktok(nombre){
  const fallo = tkFallo(nombre);
  const alerta = document.getElementById('tk-alerta-'+nombre);
  const boton = document.getElementById('tk-ok-'+nombre);
  if(!alerta || !boton) return;
  boton.disabled = !!fallo;
  alerta.innerHTML = fallo
    ? `<div class="aviso warn"><span>·</span><div>${esc(fallo)}</div></div>` : '';
}

async function guardarTiktok(nombre){
  const v = id => document.getElementById(id+'-'+nombre);
  const msg = v('tk-msg');
  const comercial = v('tk-com').checked;
  const cuerpo = {
    privacidad: v('tk-priv').value,
    comentarios: v('tk-comentarios').checked,
    dueto: v('tk-dueto').checked,
    stitch: v('tk-stitch').checked,
    comercial: {activo: comercial,
                marca_propia: comercial && v('tk-marca').checked,
                patrocinado: comercial && v('tk-patro').checked},
  };
  const r = await fetch('/api/tiktok/opciones/'+encodeURIComponent(nombre), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cuerpo)});
  const d = await r.json();
  msg.textContent = d.ok ? 'Guardado.' : (d.error||'No se pudo guardar');
  if(d.ok){ firmas.tiktok = null; refrescar(); }
}

/* El guion del vídeo demo de la auditoría.

   TikTok pide una grabación de pantalla con cinco escenas seguidas y sin
   cortes entre la elección y el resultado. Una toma fallida son cuatro
   minutos tirados, y lo que se olvida no es apretar grabar: es el orden, y
   comprobar antes que la toma va a salir.

   Las cuatro primeras escenas se marcan solas porque el panel se entera de
   que han ocurrido de verdad (token nuevo, cuenta consultada, elección
   guardada, subida terminada). La quinta pasa dentro de la app de TikTok,
   así que se enseña como recordatorio y no como casilla.

   Fuera de una grabación en curso esto es una línea y un botón: no estorba
   los otros 364 días. */
/* Copia el pie al portapapeles del telefono.

   navigator.clipboard solo existe en contexto seguro: va bien en
   http://localhost, que es como se abre el panel normalmente, pero no si lo
   abres por la IP de la red local. De ahi el respaldo con un textarea y
   execCommand, que es viejo pero sigue funcionando en el WebView de Android. */
async function copiarPie(boton, texto){
  let ok = false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(texto);
      ok = true;
    }
  }catch(e){ ok = false; }
  if(!ok){
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
  }
  // El aviso va en el propio boton: un toast pediria sitio que a 412px no
  // sobra, y aqui lo que hace falta es saber si pegar ya vale la pena.
  const antes = boton.textContent;
  boton.textContent = ok ? '\u2713 Copiado' : '\u2717 No pude';
  boton.disabled = true;
  setTimeout(()=>{ boton.textContent = antes; boton.disabled = false; }, 1500);
}

      </div>`).join('')}</div>` : ''}`;
}

/* Horario automático: días, hora y pausa de cada tanda de cron. Lo que se
   toca aquí es un borrador; «Guardar y aplicar» lo manda a horario.py, que
   escribe el crontab. Los comandos no se ven ni se tocan: son fijos. */
const LETRAS_DIA = [[1,'L'],[2,'M'],[3,'X'],[4,'J'],[5,'V'],[6,'S'],[0,'D']];
function bloqueHorario(){
  // En Windows no hay cron: el horario automático es cosa del teléfono (o
  // de un Linux). Se dice claro en vez de pedir un Termux que no existe.
  if(E && E.es_windows) return `<div class="aviso"><span>🖥</span><div>El horario automático
    usa cron, que Windows no tiene: aquí cada paso se lanza con su botón. Si quieres que corra
    solo, déjalo en el teléfono (y no publiques desde los dos a la vez).</div></div>`;
  if(!horarioCache || !horarioBorrador) return `<div class="muted">Cargando…</div>`;
  const h = horarioCache;
  const cambiado = JSON.stringify(horarioBorrador) !== JSON.stringify(h.tareas);
  const aviso = !h.hay_cron
    ? `<div class="aviso warn"><span>⚠</span><div>Cron no está instalado en el teléfono, así que nada
        corre solo. Una vez, en Termux:<div style="display:flex;gap:6px;align-items:center;margin-top:6px">
        <code style="flex-grow:1;font:12px var(--mono)">bash instalar_cron.sh</code>
        <button class="btn sm" data-cx-copiar="bash instalar_cron.sh">Copiar</button></div></div></div>`
    : h.ilegible
    ? `<div class="aviso crit"><span>✕</span><div>No pude leer lo que hay en cron (${esc(h.ilegible)}),
        así que no lo toco: guardar aquí podría borrar otras tareas tuyas. En Termux:
        <code style="font:12px var(--mono)">crontab -l</code></div></div>`
    : h.crond_vivo === false
    ? `<div class="aviso warn"><span>⚠</span><div>El horario está puesto, pero cron no está corriendo:
        no se ejecutará nada. En Termux: <code style="font:12px var(--mono)">sv-enable crond</code></div></div>`
    : (!h.al_dia && !cambiado)
    ? `<div class="aviso warn"><span>⚠</span><div>Lo que hay en cron no coincide con este horario.
        Pulsa «Guardar y aplicar» para ponerlo al día.</div></div>` : '';
  return `${aviso}
    <div class="list">${horarioBorrador.map(t=>`
      <div class="row" style="display:block">
        <div style="display:flex;gap:8px;align-items:center">
          <b style="flex-grow:1;${t.activa?'':'opacity:.55'}">${esc(t.nombre)}</b>
          <button class="btn sm" data-hr-activa="${t.id}">${t.activa ? 'Pausar' : 'Reanudar'}</button>
        </div>
        <div class="m" style="margin-top:3px">${t.activa ? esc(t.que) : 'En pausa: no corre sola. Puedes lanzarla a mano cuando quieras.'}</div>
        ${t.activa ? `
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:8px">
          ${t.tipo === 'mes'
            ? `<span class="m">Días del mes</span>
               <input data-hr-mes="${t.id}" value="${esc((t.dias_mes||[]).join(', '))}" inputmode="numeric"
                      style="width:90px" placeholder="1, 15">`
            : LETRAS_DIA.map(([d,l])=>`<button class="btn sm ${t.dias.includes(d)?'go':''}"
                 style="min-width:34px;justify-content:center" data-hr-dia="${t.id}:${d}">${l}</button>`).join('')}
          ${t.tipo === 'franja' ? `<span class="m">a una hora sorteada</span>`
            : `<span class="m" style="margin-left:4px">a las</span>
               <input type="time" data-hr-hora="${t.id}" value="${esc(t.hora)}" style="width:104px">`}
        </div>` : ''}
      </div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn go" id="b-horario" ${(cambiado || (h.hay_cron && !h.al_dia && !h.ilegible)) ? '' : 'disabled'}>Guardar y aplicar</button>
      ${cambiado ? `<button class="btn" id="b-horario-deshacer">Deshacer cambios</button>` : ''}
    </div>
    <div class="muted" style="margin-top:6px">Las horas son las del teléfono. El teléfono tiene que estar
      encendido y con Termux vivo a esa hora.</div>`;
}

function enlazarHorario(){
  const tarea = id => horarioBorrador.find(t=>t.id===id);
  document.querySelectorAll('[data-hr-activa]').forEach(b => b.onclick = ()=>{
    const t = tarea(b.dataset.hrActiva); t.activa = !t.activa; pintar();
  });
  document.querySelectorAll('[data-hr-dia]').forEach(b => b.onclick = ()=>{
    const [id, d] = b.dataset.hrDia.split(':'); const t = tarea(id), n = +d;
    t.dias = t.dias.includes(n) ? t.dias.filter(x=>x!==n) : [...t.dias, n].sort();
    pintar();
  });
  document.querySelectorAll('[data-hr-hora]').forEach(i => i.onchange = ()=>{
    tarea(i.dataset.hrHora).hora = i.value; i.blur(); pintar();
  });
  document.querySelectorAll('[data-hr-mes]').forEach(i => i.onchange = ()=>{
    tarea(i.dataset.hrMes).dias_mes = i.value.split(/[^0-9]+/).filter(Boolean).map(Number);
    i.blur(); pintar();
  });
  const des = $('#b-horario-deshacer');
  if(des) des.onclick = ()=>{ horarioBorrador = JSON.parse(JSON.stringify(horarioCache.tareas)); pintar(); };
  const b = $('#b-horario');
  if(b) b.onclick = async ()=>{
    const tareas = {};
    horarioBorrador.forEach(t => tareas[t.id] = {activa:t.activa, dias:t.dias, dias_mes:t.dias_mes, hora:t.hora});
    b.disabled = true;
    // fetch a mano y no post(): un 409 trae el horario ya guardado (solo
    // faltó cron) y hay que pintarlo; un 400 no trae nada y lo que llevas
    // cambiado se queda para que corrijas solo lo que está mal.
    let r, j;
    try{
      r = await fetch('/api/horario', {method:'POST', headers:{'Content-Type':'application/json'},
                                       body: JSON.stringify({tareas})});
      j = await r.json().catch(()=>({}));
    }catch(e){ toast('Sin conexión con el servidor'); b.disabled = false; return; }
    if(j.tareas){ horarioCache = j; horarioBorrador = JSON.parse(JSON.stringify(j.tareas)); }
    toast(r.ok ? '✓ Horario aplicado' : (j.error || 'HTTP '+r.status));
    pintar();
  };
}

async function conectarGuardar(clave){
  const valor = (cxBorrador[clave] || '').trim();
  if(!valor){ cxNota[clave] = {ok:false, texto:'Primero pega la clave.'}; pintar(); return; }
  cxNota[clave] = {ok:true, texto:'Probándola con el servicio…'}; pintar();
  try{
    const r = await post('/api/conectar/' + encodeURIComponent(clave), {valor});
    // Guardada: la clave sale del panel. No tiene por qué quedarse a la vista.
    delete cxBorrador[clave]; cxAbierto.delete(clave);
    cxNota[clave] = {ok:true, texto:'✓ ' + r.mensaje + (r.aviso ? ' ' + r.aviso : '')};
    conectarCache = null; secretosCache = []; refrescar();
  }catch(e){ cxNota[clave] = {ok:false, texto:'✗ ' + e.message}; pintar(); }
}

function enlazarConectar(){
  document.querySelectorAll('[data-cx-input]').forEach(i => i.oninput = ()=>{
    cxBorrador[i.dataset.cxInput] = i.value;
  });
  document.querySelectorAll('[data-cx-cambiar]').forEach(b => b.onclick = ()=>{
    cxAbierto.add(b.dataset.cxCambiar); delete cxNota[b.dataset.cxCambiar]; pintar();
  });
  document.querySelectorAll('[data-cx-cancelar]').forEach(b => b.onclick = ()=>{
    const k = b.dataset.cxCancelar; cxAbierto.delete(k); delete cxBorrador[k]; delete cxNota[k]; pintar();
  });
  document.querySelectorAll('[data-cx-guardar]').forEach(b => b.onclick = ()=> conectarGuardar(b.dataset.cxGuardar));
  // Pegar y probar de un toque: es lo que se hace nueve de cada diez veces.
  // Si el navegador no deja leer el portapapeles, se deja el campo listo
  // para pegar a mano con una pulsación larga.
  document.querySelectorAll('[data-cx-pegar]').forEach(b => b.onclick = async ()=>{
    const k = b.dataset.cxPegar;
    let texto = '';
    try{ texto = (await navigator.clipboard.readText()).trim(); }catch(e){}
    if(!texto){
      const campo = document.querySelector(`[data-cx-input="${k}"]`);
      if(campo) campo.focus();
      toast('Mantén pulsado el campo y elige «Pegar»');
      return;
    }
    cxBorrador[k] = texto;
    conectarGuardar(k);
  });
  document.querySelectorAll('[data-cx-copiar]').forEach(b => b.onclick = ()=> copiarPie(b, b.dataset.cxCopiar));
}

name: Compilar la app de Android

# El APK se compila aquí porque en el teléfono no hay dónde: el SDK de
# Android no existe para Termux, y bajarlo son varios gigas que no caben ni
# sirven. El runner lo compila en un par de minutos y devuelve el .apk.
#
# Qué sale de aquí: un APK firmado con la clave de depuración. Es la única
# firma posible sin guardar un keystore en el repo, y basta para lo que es
# esto — una app personal que se instala a mano en un teléfono, no algo que
# vaya a Play Store. Android pedirá permiso para instalar "de orígenes
# desconocidos" la primera vez.

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Dejar el APK en una release (más fácil de bajar desde el móvil que el artifact, que viene en zip)"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # solo para la release opcional de abajo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          # Las mismas versiones con las que se probó la compilación. Sin
          # fijarlas, el runner elige lo que traiga ese mes y un día deja de
          # compilar sin que nadie haya tocado nada.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mesa-de-revision-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Bajar un artifact desde el móvil significa bajar un zip y
      # descomprimirlo antes de poder instalar nada. Una release deja el
      # .apk a un toque. Se hace solo si se pide.
      - name: Publicar en la release 'apk'
        if: ${{ inputs.publicar }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mesa-de-revision.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk mesa-de-revision.apk \
            --title "Mesa de Revisión (APK)" \
            --prerelease \
            --notes "APK de depuración compilado desde ${{ github.sha }}.

          Instalación y qué hace falta en Termux: ver INSTALAR.md, sección
          \"La app de Android\"."

  # La app sin Termux (android/nativa). Va en su propio job a propósito: es
  # la experimental, y si un día deja de compilar, el APK que la gente tiene
  # que poder instalar —el de arriba— sigue saliendo igual.
  nativa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Los binarios los deja el workflow "Compilar ffmpeg para Android", que
      # se lanza a mano porque tarda una hora. Si todavía no hay release, el
      # APK se compila igual: arranca, sirve el panel y falla solo al
      # renderizar, con el aviso de Arranque en logcat.
      - name: Traer ffmpeg (si ya está compilado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/nativa/src/main/jniLibs/arm64-v8a
          if gh release download ffmpeg-android \
               --pattern 'lib*.so' \
               --dir android/nativa/src/main/jniLibs/arm64-v8a 2>/dev/null; then
            echo "ffmpeg incluido:"
            ls -la android/nativa/src/main/jniLibs/arm64-v8a
          else
            echo "::warning::Sin release 'ffmpeg-android': el APK saldrá sin ffmpeg y no podrá renderizar."
          fi

      - name: Compilar
        working-directory: android
        run: gradle :nativa:assembleDebug --no-daemon --console=plain

      - name: Comprobar que Python entró en el APK
        run: |
          set -e
          APK=android/nativa/build/outputs/apk/debug/nativa-debug.apk
          ls -la "$APK"
          # Sin esto, un APK al que le falte el runtime se vería igual de
          # bien aquí y moriría al arrancar en el teléfono.
          unzip -l "$APK" | grep -q "libpython" \
            && echo "✓ runtime de Python dentro" \
            || (echo "✗ falta el runtime de Python" && exit 1)
          unzip -l "$APK" | grep -q "assets/pipeline.zip" \
            && echo "✓ pipeline dentro" \
            || (echo "✗ falta el pipeline" && exit 1)

      - name: Guardar el APK nativo
        uses: actions/upload-artifact@v4
        with:
          name: mesa-nativa-apk
          path: android/nativa/build/outputs/apk/debug/nativa-debug.apk
          if-no-files-found: error

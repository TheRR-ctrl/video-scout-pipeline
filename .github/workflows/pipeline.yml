name: Pipeline diario

# Corre las 4 etapas (historias -> guion -> video -> subida a YouTube) sin
# intervención manual, en el runner gratuito de GitHub Actions.
#
# Requisitos antes de activar este workflow (ver README.md, sección
# "Automatización en la nube"):
#   1. Secrets del repo (Settings -> Secrets and variables -> Actions):
#        GEMINI_API_KEY        - API key gratuita de https://aistudio.google.com/apikey
#        YOUTUBE_CLIENT_SECRET - contenido de tu client_secret.json (OAuth desktop)
#        YOUTUBE_TOKEN         - contenido de youtube_token.json ya autorizado
#                                 una vez en tu máquina (ver README)
#   2. Assets de música (musica_*.mp3, tarjeta_plantilla.png) commiteados en
#      el repo o descargados en el paso "Descargar assets" de abajo. Los
#      videos de fondo (fondo_vertical*.mp4, fondo_horizontal*.mp4) solo
#      hacen falta con motor_fondo=cortes; con motor_fondo=hyperframes el
#      fondo se genera y no se necesita ningún video propio.

# A mano y nada más. El disparador diario estaba puesto y es peligroso aquí:
# pipeline_state/ está en .gitignore, así que el runner arranca cada día con
# el registro en blanco — sin publicados.json, sin historial de vistos y sin
# las huellas de texto que evitan contar dos veces la misma historia. Con eso,
# la única defensa contra subir un refrito es que el título coincida letra por
# letra con uno del canal, y Gemini nunca escribe dos veces el mismo título.
#
# Además chocaría con el cron del teléfono (instalar_cron.sh), que es el que
# sí lleva el registro. Si algún día quieres la versión en la nube, primero
# hay que restaurar pipeline_state/ al empezar y guardarlo al terminar.
on:
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña Actions
    inputs:
      motor_fondo:
        description: "Motor de fondo (cortes = recorta tus videos propios; hyperframes = lo genera con IA, sin videos propios)"
        required: false
        default: "cortes"
        type: choice
        options: ["cortes", "hyperframes"]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Solo lo usa motor_fondo=hyperframes (el CLI corre con npx), pero
      # instalarlo siempre sale gratis en tiempo y evita un fallo tardío.
      - name: Configurar Node.js (CLI de HyperFrames)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Si tus videos/música de fondo no están commiteados en el repo,
      # descárgalos aquí (por ejemplo desde un bucket o Google Drive) antes
      # de continuar. Déjalo vacío si ya los versionas en el repo.
      - name: Descargar assets (opcional)
        run: echo "Sin paso de descarga configurado; usando assets del repo."

      - name: Fijar motor de fondo
        env:
          MOTOR_FONDO: ${{ github.event.inputs.motor_fondo || 'cortes' }}
        run: |
          python -c "
          import json, os
          try:
              with open('config.json') as f:
                  cfg = json.load(f)
          except FileNotFoundError:
              cfg = {}
          cfg['motor_fondo'] = os.environ['MOTOR_FONDO']
          with open('config.json', 'w') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          "

      - name: Restaurar credenciales
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN" > youtube_token.json

      - name: Correr pipeline completo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline.py

      - name: Subir logs y estado como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            pipeline_state/
            guion.txt
          retention-days: 14

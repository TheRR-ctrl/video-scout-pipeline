<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Revisión</title>
<!--
  Lo que se ve mientras Python arranca dentro de la app.

  La primera vez tarda: hay que descomprimir el pipeline e iniciar el
  intérprete. Las siguientes es casi instantáneo, así que esta pantalla
  pasa de largo sin que dé tiempo a leerla — que es la intención.
-->
<style>
  :root{
    --ground:#12151a; --ink:#eceef1; --ink-dim:#98a2ae;
    --accent:#4db4a8; --warn:#d9944a;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px 18px}
  .caja{width:100%;max-width:420px}
  .marca{font:500 13px var(--mono);color:#626c79;margin-bottom:22px}
  .marca b{color:var(--accent);font-weight:500}
  .luz{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .punto{width:11px;height:11px;border-radius:50%;background:var(--accent);
    flex-shrink:0;animation:late 1.1s ease-in-out infinite}
  .punto.lento{background:var(--warn)}
  @keyframes late{0%,100%{opacity:1}50%{opacity:.25}}
  h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
  p{color:var(--ink-dim);font-size:13.5px;margin:10px 0 0}
  code{font:12px var(--mono);color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="caja">
  <div class="marca">mesa de <b>revisión</b></div>
  <div class="luz"><span class="punto" id="punto"></span>
    <h1 id="titulo">Arrancando el panel…</h1></div>
  <p id="detalle">Python está levantando dentro de la app. La primera vez
     tarda unos segundos porque hay que desplegar el pipeline.</p>
</div>
<script>
/* La llama MainActivity cuando el puerto no contestó en 60 segundos. Eso ya
   no es lentitud: algo reventó al importar el pipeline. */
window.tardando = function(){
  document.querySelector('#punto').className = 'punto lento';
  document.querySelector('#titulo').textContent = 'El panel no arrancó';
  document.querySelector('#detalle').innerHTML =
    'Pasó un minuto y nadie contesta en el puerto 8770. Lo que falló se lee '
    + 'en logcat con la etiqueta <code>ServicioPanel</code>: casi siempre es '
    + 'una dependencia de Python que no está en el APK.';
};
</script>
</body>
</html>
